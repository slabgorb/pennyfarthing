    # ==========================================================================
    # REPOSITORY OPTIMIZATION - Reduce Clone Times
    # ==========================================================================
    - name: "Repository Optimization"
      description: |
        Reduce repository size from ~750MB to ~100MB by moving portrait images
        to external CDN. Improves clone times, CI/CD performance, and developer
        experience.
      status: ready
      blocked_by: null
      epics:
        # ======================================================================
        # EPIC 55: CDN Portrait Storage
        # ======================================================================
        - id: epic-55
          title: "CDN Portrait Storage"
          description: |
            Move 606MB of portrait images out of main repository to jsDelivr CDN.

            Current state:
            - pennyfarthing-dist/personas/portraits/ = 606MB
            - ~1,000 PNG images across 102 themes
            - Every clone downloads all portraits

            Target state:
            - Portraits in separate pennyfarthing-portraits repo
            - Served via jsDelivr CDN (free, fast, global)
            - Main repo shrinks from ~750MB to ~100MB
            - Optional local cache for offline development

            ADR: docs/adr/0006-cdn-portrait-storage.md
          points: 13
          priority: P1
          marker: "infrastructure"
          repos: pennyfarthing
          status: planning
          stories:
            # Phase 1: Repository Setup
            - id: "55-1"
              title: "Create pennyfarthing-portraits repository"
              description: |
                Create new GitHub repository for portrait images:
                - Repository: 1898andCo/pennyfarthing-portraits
