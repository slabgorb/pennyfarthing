# Updated: 2026-01-21

# =============================================================================
# BENCHMARK RELIABILITY - Scientific Evaluation
# Research-backed improvements to agent benchmarking
# Total: 44 points across 6 epics
#
# Phase 1 (P1): Epics 41-43 = 21 pts (scoring + anchors + traps)
# Phase 2 (P2): Epics 44-46 = 23 pts (validation + references + calibration)
#
# Success Metrics:
#   - Inter-judge Krippendorff's Alpha > 0.65
#   - False positive detection < 10%
#   - TEA variance CV < 15%
# =============================================================================

planning:
  initiatives:
    - name: "Benchmark Reliability"
      description: |
        Research-backed improvements to agent benchmarking methodology.
        Based on HELM (Stanford CRFM), ARC-AGI, and MLPerf methodologies.
      status: research_complete
      blocked_by: "Need stable benchmark baseline before measuring improvements"
      epics:
        - id: epic-41
          title: "Precision/Recall Detection Scoring"
          description: |
            Separate detection scoring into precision and recall components.
            Current formula conflates finding issues with avoiding false positives.
            New approach makes trade-offs explicit and measurable.

            Research basis: HELM benchmark methodology (Stanford CRFM)
          points: 8
          priority: P1
          marker: "benchmark"
          repos: pennyfarthing
          status: planning
          stories:
            - id: "41-1"
              title: "Update judge SKILL.md with precision/recall formula"
              description: |
                Replace current detection formula:
                  detection = criticals×15 + highs×10 + mediums×5 + lows×2 + novel×5 - false_positives×5
                With precision/recall:
                  precision (25 pts) = true_positives / (true_positives + false_positives) × 25
                  recall (25 pts) = true_positives / total_baseline_issues × 25
                Update checklist rubric prompt and JSON output format.
              points: 3
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "41-2"
              title: "Update judge JSON output schema"
              description: |
                New detection output format:
                ```json
                {
                  "detection": {
                    "true_positives": 8,
                    "false_positives": 1,
                    "total_baseline": 10,
                    "precision": 0.89,
                    "recall": 0.80,
                    "precision_score": 22.2,
                    "recall_score": 20.0,
                    "subtotal": 42.2
                  }
                }
                ```
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "41-3"
              title: "Regression test: compare new vs old scores"
              description: |
                Run judge with both formulas on existing benchmark results.
                Verify correlation > 0.9 to ensure new formula doesn't
                dramatically alter rankings while adding precision/recall insight.
              points: 3
              priority: P1
              status: planning
              repos: pennyfarthing

        - id: epic-42
          title: "Anchored Rubric Criteria"
          description: |
            Replace vague rubric criteria ("clear_explanations") with behavioral
            anchors that define what each score level means concretely.

            Research basis: 2025 research shows few-shot doesn't fix judge
            self-inconsistency; explicit anchors reduce variance.
          points: 6
          priority: P1
          marker: "benchmark"
          repos: pennyfarthing
          status: planning
          stories:
            - id: "42-1"
              title: "Create rubric-anchors.md with behavioral scales"
              description: |
                New file: pennyfarthing-dist/skills/judge/rubric-anchors.md
                Define score anchors for each dimension:
                - clear_explanations (1-10): what constitutes each level
                - actionable_fixes (1-10): concrete examples per score
                - in_character (1-10): persona consistency indicators
              points: 3
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "42-2"
              title: "Reference anchors in judge prompts"
              description: |
                Update judge SKILL.md checklist prompt to include
                anchor reference. Judge should consult anchors when
                assigning quality/persona dimension scores.
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "42-3"
              title: "Variance test: measure CV reduction"
              description: |
                Re-run TEA benchmarks with anchored rubric.
                Target: CV reduction from 25-65% to < 15%.
              points: 1
              priority: P1
              status: planning
              repos: pennyfarthing

        - id: epic-43
          title: "False Positive Traps (Red Herrings)"
          description: |
            Add intentional non-issues to scenarios to systematically measure
            precision. Agents that flag red herrings as issues lose points;
            agents that correctly identify them as non-issues get bonus.

            Research basis: ARC-AGI distinguishes novel reasoning from
            pattern matching; red herrings test true understanding.
          points: 7
          priority: P1
          marker: "benchmark"
          repos: pennyfarthing
          status: planning
          stories:
            - id: "43-1"
              title: "Add red_herrings schema to scenarios"
              description: |
                New scenario field:
                ```yaml
                red_herrings:
                  - id: LOOKS_LIKE_SQLI_BUT_PARAMETERIZED
                    location: "line 45"
                    description: "Appears to be SQL injection but uses parameterized query"
                    trap_type: false_security_alarm
                ```
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "43-2"
              title: "Update judge for red herring detection"
              description: |
                Scoring for red herrings:
                - Agent flags red herring as issue: -5 points (false positive)
                - Agent correctly identifies as not-an-issue: +2 bonus
                Add to judge checklist prompt and output format.
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "43-3"
              title: "Pilot: Add red herrings to order-service scenario"
              description: |
                Add 2 red herrings to order-service.yaml:
                1. Code that looks like SQL injection but is parameterized
                2. "Missing" error handling that's actually handled upstream
                Run benchmark to validate trap detection scoring.
              points: 3
              priority: P1
              status: planning
              repos: pennyfarthing

        - id: epic-44
          title: "Multi-Judge Validation"
          description: |
            Measure judge reliability by running multiple judges with prompt
            variations. Calculate Krippendorff's Alpha to quantify inter-rater
            reliability. Flag results when Alpha < 0.65.

            Research basis: Krippendorff's Alpha is standard for inter-rater
            reliability; 2025 research recommends Gwet's AC2 for skewed data.
          points: 10
          priority: P2
          marker: "benchmark"
          repos: pennyfarthing
          status: planning
          stories:
            - id: "44-1"
              title: "Add --multi-judge flag to /solo command"
              description: |
                New flag: `/solo theme:agent --scenario X --multi-judge`
                Runs judge 3 times with prompt variations:
                - "You are an impartial judge..."
                - "As a neutral evaluator..."
                - "Evaluate this response objectively..."
              points: 3
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "44-2"
              title: "Implement Krippendorff's Alpha calculation"
              description: |
                Calculate alpha across dimension scores from multiple judges.
                Return alpha value with interpretation:
                - α > 0.80: excellent agreement
                - α 0.65-0.80: acceptable
                - α < 0.65: unreliable, flag for review
              points: 3
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "44-3"
              title: "Update finalize-run for multi-judge storage"
              description: |
                New storage format in results:
                ```yaml
                judge:
                  mode: multi
                  iterations: 3
                  krippendorff_alpha: 0.72
                  scores_per_judge: [85, 82, 87]
                  final_score: 85  # median
                ```
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "44-4"
              title: "Multi-judge test on high-variance scenarios"
              description: |
                Run multi-judge on TEA scenarios with known high variance.
                Validate that alpha calculation identifies unreliable judgments.
                Document baseline alpha values per scenario.
              points: 2
              priority: P1
              status: planning
              repos: pennyfarthing

        - id: epic-45
          title: "Gold Standard References"
          description: |
            Add human-curated ideal responses to scenarios. Judge can use
            these as calibration references to reduce variance and provide
            consistent scoring anchored to known-good examples.

            Research basis: HELM uses reference implementations for
            calibration; MLPerf provides gold standards for comparison.
          points: 8
          priority: P2
          marker: "benchmark"
          repos: pennyfarthing
          status: planning
          stories:
            - id: "45-1"
              title: "Add gold_standard schema to scenarios"
              description: |
                New scenario field:
                ```yaml
                gold_standard:
                  exemplar_response: |
                    [Human-curated ideal response]
                  edge_case_guidance:
                    - situation: "Agent mentions deprecated API"
                      ruling: "Acceptable if notes deprecation status"
                ```
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "45-2"
              title: "Update judge to use gold standard as calibration"
              description: |
                When gold_standard is present, judge prompt includes:
                "Reference the exemplar response for calibration.
                A response matching this quality = 90+ score."
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "45-3"
              title: "Create gold standards for 5 high-variance scenarios"
              description: |
                Write exemplar responses for scenarios with highest
                historical variance. Prioritize TEA scenarios where
                CV was 25-65%.
              points: 3
              priority: P1
              status: planning
              repos: pennyfarthing
            - id: "45-4"
              title: "Variance comparison: with/without gold standard"
              description: |
                A/B test: run same scenarios with and without gold standard.
                Measure variance reduction. Target: 50% CV decrease.
              points: 1
              priority: P1
              status: planning
              repos: pennyfarthing

        - id: epic-46
          title: "Difficulty Profile Enhancement"
          description: |
            Replace single difficulty label with multi-dimensional profile
            including percentile bands from empirical data. Enables better
            scenario selection and more meaningful score interpretation.

            Research basis: ARC-AGI separates difficulty dimensions;
            percentile bands from MLPerf methodology.
          points: 5
          priority: P2
          marker: "benchmark"
          repos: pennyfarthing
          status: planning
          stories:
            - id: "46-1"
              title: "Add difficulty_profile schema to scenarios"
              description: |
                New scenario field:
                ```yaml
                difficulty_profile:
                  overall: medium
                  dimensions:
                    detection_challenge: high
                    reasoning_complexity: medium
                    domain_knowledge: low
                  percentile_bands:
                    p90: 92
                    p50: 78
                    p10: 65
                ```
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "46-2"
              title: "Populate difficulty profiles from baseline data"
              description: |
                Use existing control baseline runs to populate
                percentile_bands for all calibrated scenarios.
                Document methodology for future calibration.
              points: 2
              priority: P1
              status: planning
              repos: pennyfarthing
            - id: "46-3"
              title: "Update schema.yaml with new fields documentation"
              description: |
                Document all new benchmark fields in schema.yaml:
                - red_herrings
                - gold_standard
                - difficulty_profile
                Include examples and validation rules.
              points: 1
              priority: P1
              status: planning
              repos: pennyfarthing


