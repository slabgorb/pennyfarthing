                - Add to monorepo as packages/vscode-extension
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "50-2"
              title: "Terminal provider for Claude Code sessions"
              description: |
                Create custom terminal profile that:
