  - id: epic-40
    title: Scale Adaptation and Brownfield Support
    description: |
      Adopt BMAD's scale-adaptive approach and add brownfield codebase discovery.

      Scale Levels (from BMAD):
      - Level 0: Bug fixes (1 story, minimal overhead)
      - Level 1: Small features (1-10 stories, quick-spec)
      - Level 2: Dashboards/admin panels (5-15 stories, PRD-based)
      - Level 3: Platforms/complex systems (12-40 stories, full workflow)
      - Level 4: Enterprise (40+ stories, governance)

      Current Pennyfarthing only has trivial (1-2 pts) and TDD (3+ pts).
      This epic adds upward scaling for larger initiatives and brownfield
      analysis for existing codebases.

