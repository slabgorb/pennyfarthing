          - Module: src/dangerous-path.ts (~1000 lines, 104 tests)
        points: 3
        priority: P1
        status: wontfix
        repos: cyclist
        wontfix_reason: |
          Same architectural limitation as 29-1. Claude Code executes Write/Edit
          tools internally before Cyclist sees the tool_use message in the stream.
          Cannot intercept file operations to request approval.
        acceptance_criteria:
