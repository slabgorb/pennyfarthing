      - id: 31-13
        title: Context-aware handoffs with auto-compaction
        description: |
          When an agent invokes the handoff subagent, make intelligent decisions
          based on context usage and user settings:

          **Low context (< 50%):**
          - If 'auto handoff' setting enabled: Handoff immediately
          - Otherwise: Offer handoff to user

          **High context (> 50%):**
          - If 'auto handoff' setting enabled: Run 'compact' action, then
            invoke the new agent and prime them (resets context window)
          - Otherwise: Offer handoff with context warning

          **Implementation:**
          1. Add context threshold check to generic-handoff subagent
          2. Add 'auto_handoff' setting to workflow config or project settings
          3. Integrate with Claude Code's /compact action for context reset
          4. After compact, auto-invoke next agent with /prime to reload context
          5. Track context percentage in session file for visibility
          6. Update Cyclist settings UI: Replace two checkboxes with radio button
             group for handoff mode (auto/manual)
          7. Verify auto_handoff setting is read and respected by generic-handoff

          This ensures smooth handoffs when context is low, and graceful
          context management when approaching limits.
        points: 3
        priority: P1
        status: done
        completed: 2026-01-14
        repos: pennyfarthing, cyclist
        jira: MSSCI-11683
        acceptance_criteria:
          - generic-handoff checks context percentage before handoff
          - Context < 50% with auto_handoff: Immediate handoff
          - Context < 50% without auto_handoff: Offer handoff
          - Context > 50% with auto_handoff: Compact then invoke+prime new agent
          - Context > 50% without auto_handoff: Offer handoff with warning
          - auto_handoff setting configurable in workflow or project config
          - Session file tracks context percentage at handoff points
          - Works with all workflow types (TDD, trivial, custom)
          - Cyclist settings UI uses radio button group for handoff mode (not checkboxes)
          - Radio options: "Auto handoff" / "Manual handoff (ask first)"
          - Setting persists and is correctly read by generic-handoff subagent
          - End-to-end test: change setting, trigger handoff, verify behavior matches
      - id: 31-14
        title: Run subagents in background for parallel work
        description: |
          Enable subagents to run in background using Claude Code's Task tool
          `run_in_background` parameter. This allows the main agent to continue
          working while slow operations complete asynchronously.

          **Use cases:**
          - Run tests in background while writing more code
          - Parallel exploration of multiple code paths
          - Long-running git operations (fetch, clone)
          - Multiple independent file searches

          **Implementation:**
          1. Add `background: true` option to subagent spawning patterns
          2. Track background task IDs in session file
          3. Provide status check mechanism (TaskOutput tool)
          4. Handle completion notifications gracefully
          5. Update agent guidance for when to use background vs foreground

          **Constraints:**
          - Only independent operations should run in background
          - Operations with dependencies must wait for results
          - Background tasks should not modify shared state concurrently
        points: 3
        priority: P1
        status: done
        started: 2026-01-14
        completed: 2026-01-14
        assigned_to: Keith Avery
        repos: pennyfarthing
        jira: MSSCI-11686
        acceptance_criteria:
