epics:
  # ===========================================================================
  # MSSCI-11715: Cyclist UI/UX Improvements
  # ===========================================================================
  - id: MSSCI-11715
    type: epic
    title: "Cyclist UI/UX Improvements"
    priority: P2
    status: in_progress
    stories:
      - id: MSSCI-11725
        title: "Line numbers in file diffs"
        points: 2
        priority: P2
        status: in_progress
        repos: cyclist
        workflow: tdd
        acceptance_criteria:
          - File diffs display line numbers
          - Line numbers match source file positions
          - Styling consistent with diff view
  # ===========================================================================
  # MSSCI-11705: Runtime Permission Management
  # ===========================================================================
  - id: MSSCI-11705
    type: epic
    title: "Runtime Permission Management"
    priority: P1
    status: in_progress
    stories:
      - id: MSSCI-11710
        title: "Permission presets by workflow"
        points: 2
        priority: P2
        status: backlog
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - Workflow schema supports permissions field
          - Workflow start checks required permissions
          - Prompts for missing permissions
          - Cached grants skip prompts
  # ===========================================================================
  # Standalone Stories (no epic)
  # ===========================================================================
  - id: standalone
    type: collection
    title: "Standalone Stories"
    status: in_progress
    stories:
      - id: MSSCI-11799
        title: "Detect Jira-only stories missing from sprint YAML"
        points: 3
        priority: P2
        status: in_progress
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - Sync script queries Jira sprint for all pennyfarthing stories
          - Compares against sprint YAML story list
          - Reports stories in Jira but not in YAML
          - Optionally imports missing stories to YAML
      - id: MSSCI-11918
        title: "Rude mode - inject queued messages mid-conversation"
        points: 2
        priority: P3
        status: backlog
        repos: cyclist
        workflow: tdd
        description: |
          Allow queued user messages to be injected into the conversation
          mid-stream for a more interactive experience.
        acceptance_criteria:
          - User can queue messages while agent is responding
          - Queued messages injected at appropriate breakpoints
          - UI indicates queued message count
