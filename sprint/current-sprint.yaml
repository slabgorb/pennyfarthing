  # ===========================================================================
  # MSSCI-11942: WheelHub Notification Consolidation
  # ===========================================================================
  - id: MSSCI-11942
    type: epic
    jira: MSSCI-11942
    title: "Epic: WheelHub Notification Consolidation"
    description: |
      Consolidate notification patterns across Cyclist. Replace polling with
      event-driven WebSocket channels, standardize reconnection behavior,
      and add cross-tab synchronization.
    points: 11
    completed_points: 9
    priority: P2
    status: in_progress
    stories:
      - id: MSSCI-11949
        jira: MSSCI-11949
        title: "Remove tool/skill log panels and consolidate to messages"
        description: |
          The tool-panel.js and skill-panel.js provide dedicated side panels for
          viewing tool executions and skill invocations. However, this information
          is already visible in the messages view with enriched tool descriptions
          (MSSCI-11929). The separate panels add complexity without unique value.
        points: 3
        priority: P2
        status: done
        completed: 2026-01-19
        repos: cyclist
        workflow: trivial
        acceptance_criteria:
          - tool-panel.js and its UI removed
          - skill-panel.js and its UI removed
          - Badge polling for these panels removed
          - Related localStorage keys cleaned up
          - Messages view remains the single source for tool/skill activity
      - id: MSSCI-11944
        jira: MSSCI-11944
        title: "Event-driven badge updates"
        description: |
          Replace 500ms setInterval badge polling with event-driven updates.
          PanelManager emits badge-changed event when counts change.
        points: 2
        priority: P2
        status: backlog
        repos: cyclist
        workflow: tdd
        acceptance_criteria:
          - PanelManager emits badge-changed event on count changes
          - tab-bar.js subscribes to event instead of polling
          - No 500ms setInterval in tab-bar.js
          - Badges update immediately on change
      - id: MSSCI-11945
        jira: MSSCI-11945
        title: "Livereload pattern alignment"
        description: |
          Migrate livereload from exponential backoff to 2s fixed reconnection
          to align with standard WheelHub pattern.
        points: 1
        priority: P3
        status: done
        completed: 2026-01-19
        repos: cyclist
        workflow: trivial
        acceptance_criteria:
          - livereload.js uses 2s fixed reconnection
          - Consistent with other WheelHub channels
      - id: MSSCI-11946
        jira: MSSCI-11946
        title: "LocalStorage cross-tab synchronization"
        description: |
          Create settings-sync.js module using BroadcastChannel API for
          cross-tab localStorage synchronization. Centralizes localStorage
          access across 16 files.
        points: 5
        priority: P2
        status: done
        completed: 2026-01-20
        repos: cyclist
        workflow: tdd
        acceptance_criteria:
          - settings-sync.js module created with BroadcastChannel API
          - Theme changes in Tab 1 reflect in Tab 2 immediately
          - All localStorage access goes through settings-sync.js
          - 16 existing files refactored to use new module

  # ===========================================================================
  # Stepped Workflow Support (BMAD-Inspired) - pending Jira
  # ===========================================================================
  - id: MSSCI-12022
    type: epic
    jira: MSSCI-12022
    title: "Epic: Stepped Workflow Support (BMAD-Inspired)"
    description: |
      Extend Pennyfarthing's workflow system to support BMAD-style stepped
      workflows natively. Adds progressive disclosure, step-based execution,
      user approval gates, tri-modal support, and cross-session resumability.

      ADR: docs/adr/0005-bmad-workflow-import.md
    points: 17
    completed_points: 0
    priority: P1
    status: backlog
    stories:
      - id: MSSCI-12023
        jira: MSSCI-12023
        title: Workflow YAML schema extension (type: stepped)
        description: |
          Update workflow YAML schema to support type: stepped with new fields:
          steps (path, pattern), modes, variables, gates, template.
          Workflow loader detects type and routes to appropriate executor.
        points: 2
        priority: P0
        status: backlog
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - Workflow YAML supports type: stepped field
          - New fields: steps.path, steps.pattern, modes, variables, gates, template
          - Workflow loader detects type and routes appropriately
          - Backward compatible with existing type: phased workflows
      - id: MSSCI-12025
        jira: MSSCI-12025
        title: Step file parser and variable resolution
        description: |
          Create step file parser that extracts <step-meta> block, resolves
          {variable} placeholders, and identifies gate markers. Variable
          resolver with priority chain: Workflow → Session → Config → Env → Defaults.
        points: 3
        priority: P0
        status: backlog
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - Step file parser extracts <step-meta> block
          - Variable placeholders {variable} resolved correctly
          - Gate markers detected (<!-- GATE --> or from meta)
          - Priority chain: Workflow → Session → Config → Env → Defaults
      - id: MSSCI-12024
        jira: MSSCI-12024
        title: Session file state tracking for stepped workflows
        description: |
          Extend session file format with ## Workflow State section tracking:
          workflow name, type, mode, current step, steps completed array,
          timestamps. Session reader/writer for stepped workflow state.
        points: 2
        priority: P0
        status: backlog
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - Session file has ## Workflow State section
          - Tracks: workflow, type, mode, current_step, steps_completed[]
          - Session reader/writer for stepped state
          - Compatible with existing session file format
      - id: MSSCI-12026
        jira: MSSCI-12026
        title: "/workflow command updates (list, start, resume, status)"
        description: |
          Update /workflow skill with: list (show phased + stepped),
          start <name> [--mode] (begin stepped workflow), resume [name]
          (continue from last step), status (show current progress).
        points: 3
        priority: P0
        status: backlog
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - /workflow list shows both phased and stepped workflows
          - /workflow start <name> [--mode] begins stepped workflow
          - /workflow resume [name] continues from last step
          - /workflow status shows current progress
      - id: MSSCI-12027
        jira: MSSCI-12027
        title: Gate detection and user approval flow
        description: |
          Gate detection from: gates.after_steps in workflow YAML, gate: true
          in step meta, <!-- GATE --> marker in content. Gate UI displays
          prompt, waits for user input, records decision in session.
        points: 2
        priority: P1
        status: backlog
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - Gates detected from workflow YAML gates.after_steps
          - Gates detected from step meta gate: true
          - Gates detected from <!-- GATE --> marker
          - Gate pauses execution, displays prompt, records decision
      - id: MSSCI-12028
        jira: MSSCI-12028
        title: Tri-modal support (create/validate/edit)
        description: |
          Mode selection at workflow start. Route to appropriate steps
          directory based on mode (steps/, steps-v/, steps-e/). Track
          mode in session state.
        points: 2
        priority: P1
        status: backlog
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - Mode selected at workflow start (create/validate/edit)
          - Routes to correct steps directory based on mode
          - Mode tracked in session state
          - Default mode configurable in workflow YAML
      - id: MSSCI-12029
        jira: MSSCI-12029
        title: BMAD workflow migration script
        description: |
          Create migrate-bmad-workflow.sh script to convert BMAD workflow
          format to Pennyfarthing stepped format. Handle step files,
          variable syntax, and mode directories.
        points: 1
        priority: P2
        status: backlog
        repos: pennyfarthing
        workflow: trivial
        acceptance_criteria:
          - migrate-bmad-workflow.sh script created
          - Converts BMAD workflow.md to Pennyfarthing workflow.yaml
          - Handles step file conversion
          - Converts variable syntax
      - id: MSSCI-12030
        jira: MSSCI-12030
        title: Example stepped workflows (architecture, prd)
        description: |
          Create example stepped workflows demonstrating the feature:
          architecture workflow with 8 steps and gates, prd workflow
          with tri-modal support. Include step files and templates.
        points: 2
        priority: P2
        status: backlog
        repos: pennyfarthing
        workflow: trivial
        acceptance_criteria:
          - architecture workflow with 8 steps and gates
          - prd workflow with tri-modal support
          - Step files and templates included
          - Documentation for each workflow

  # ===========================================================================
  # MSSCI-11705: Runtime Permission Management
  # ===========================================================================
  - id: MSSCI-11705
    type: epic
    jira: MSSCI-11705
    title: "Epic: Runtime Permission Management"
    description: |
      Allow agents to request and manage tool permissions at runtime. Currently
      permissions must be pre-configured; agents can't request spot permissions
      for tools like WebFetch when needed.
    points: 3
    completed_points: 3
    priority: P2
    status: done
    stories:
      - id: MSSCI-11710
        jira: MSSCI-11710
        title: "Permission presets by workflow"
        description: |
          Workflows can declare required permissions. Auto-prompt for missing
          permissions on workflow start.
        points: 3
        priority: P2
        status: done
        assigned_to: Keith Avery
        pr: "#365"
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - Workflow YAML supports permissions field declaring required permissions
          - On workflow start, system checks if required permissions are granted
          - Missing permissions trigger auto-prompt to user
          - Granted permissions recorded in session for workflow duration
          - Works with existing /permissions skill infrastructure

  # ===========================================================================
  # MSSCI-12015: Cyclist VS Code Extension
  # ===========================================================================
  - id: MSSCI-12015
    type: epic
    jira: MSSCI-12015
    title: "Epic: Cyclist VS Code Extension"
    description: |
      Port Cyclist visual terminal to a VS Code extension using hybrid architecture.
      Services (OTLP, ClaudeService, TokenStats) run in extension host.
      Frontend reused in webview via VSCodeAdapter.js (postMessage API).
      WheelHub and Reflector features fully supported.
    points: 15
    completed_points: 0
    priority: P2
    status: backlog
    stories:
      - id: MSSCI-12016
        jira: MSSCI-12016
        title: "Extension scaffold"
        description: |
          Create packages/cyclist-vscode/ with basic VS Code extension structure.
          Register cyclist.open command, create empty webview panel.
        points: 2
        priority: P2
        status: backlog
        repos: cyclist
        workflow: trivial
        acceptance_criteria:
          - packages/cyclist-vscode/package.json with extension manifest
          - cyclist.open command registered in contributes
          - extension.ts with activate/deactivate lifecycle
          - CyclistPanel.ts creates empty webview panel
          - Extension loads in VS Code dev mode

      - id: MSSCI-12017
        jira: MSSCI-12017
        title: "VSCodeAdapter.js"
        description: |
          Create webview adapter mirroring web-adapter.js using postMessage API.
          Implements window.electronAPI interface for seamless frontend reuse.
        points: 2
        priority: P2
        status: backlog
        repos: cyclist
        workflow: trivial
        acceptance_criteria:
          - media/js/vscode-adapter.js created
          - Implements window.electronAPI interface matching preload.ts
          - Claude channel with send, abort, onMessage, onComplete, onError
          - Data channels for stats, persona, tokenStats, story, git
          - Message listener infrastructure for extension→webview communication

      - id: MSSCI-12018
        jira: MSSCI-12018
        title: "OTLP server extraction"
        description: |
          Extract OTLP receiver from WheelHub into standalone service.
          Handle /v1/metrics and /v1/logs in extension host.
        points: 3
        priority: P2
        status: backlog
        repos: cyclist
        workflow: tdd
        acceptance_criteria:
          - src/services/OTLPServer.ts handles /v1/metrics and /v1/logs
          - Port file written to .cyclist-port for Claude Code discovery
          - Dynamic port allocation avoids conflicts
          - parseOTLPMetrics and parseOTLPLogs reused from cyclist
          - Unit tests for OTLP parsing

      - id: MSSCI-12019
        jira: MSSCI-12019
        title: "Service container"
        description: |
          Wire up ClaudeService, TokenStatsService, ToolEventService in extension host.
          Dependency injection container for service lifecycle.
        points: 2
        priority: P2
        status: backlog
        repos: cyclist
        workflow: trivial
        acceptance_criteria:
          - ServiceContainer.ts provides dependency injection
          - ClaudeService wrapper spawns claude CLI in stream-json mode
          - TokenStatsService aggregates metrics from OTLP
          - ToolEventService parses and stores tool events
          - Services emit events for webview broadcasting

      - id: MSSCI-12020
        jira: MSSCI-12020
        title: "Port frontend to webview"
        description: |
          Copy Cyclist frontend files to media/ and adapt for VS Code webview CSP.
          All resource URIs use webview.asWebviewUri().
        points: 3
        priority: P2
        status: backlog
        repos: cyclist
        workflow: trivial
        acceptance_criteria:
          - All public/js/ files copied to media/js/
          - styles.css copied to media/
          - index.html modified with CSP meta tag and nonce
          - Resource URIs use webview.asWebviewUri()
          - TipTap bundle loads correctly in webview

      - id: MSSCI-12021
        jira: MSSCI-12021
        title: "Message handler wiring"
        description: |
          Connect webview messages to extension host services.
          Complete integration with Reflector quick-actions support.
        points: 3
        priority: P2
        status: backlog
        repos: cyclist
        workflow: tdd
        acceptance_criteria:
          - claude:send routes to ClaudeService, streams responses back
          - tokenStats:get/update routes to TokenStatsService
          - persona:get/update routes to PersonaService (optional)
          - Reflector quick-actions work (HANDOFF, QUESTION, CHOICES)
          - CONTEXT_CLEAR routes to extension host for session reset
          - Integration test verifies full message flow
