      - id: 31-6
        title: Session file workflow tracking
        description: |
          Update session file format to track:
          - Active workflow name
          - Current phase in workflow
          - Phase history and transitions
        points: 2
        priority: P1
        status: done
        started: 2026-01-13
        completed: 2026-01-13
        assigned_to: Keith Avery
        repos: pennyfarthing
        jira: MSSCI-11610
