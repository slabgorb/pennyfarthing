    points: 5
    priority: P1
    status: done
    repos: pennyfarthing
    notes: "PARTIAL COMPLETION (reviewed 2026-01-06):\n✓ --roles flag documented in\
      \ job-fair.md\n✓ Architect baseline exists (database-selection, n=10, mean=86.70)\n\
      ✗ Incremental merge untested - no evidence of merge behavior\n✗ Architect backfill:\
      \ 12/81 themes (15% complete)\n✗ No architect swap recommendations in theme\
      \ files\n\nSCENARIO SELECTION (added 2026-01-06):\nCurrent job-fair scenarios:\n\
      \  - dev: race-condition-cache (std=0.63 - POOR differentiation)\n  - reviewer:\
      \ order-service (std=1.45 - POOR differentiation)\n  - tea: payment-processor-tests\
      \ (std=3.75 - acceptable)\n  - sm: sprint-planning-conflict (std=2.29 - acceptable)\n\
      \nARCHITECT SCENARIO SELECTION (this story's focus):\n  DECISION: Use `legacy-modernization`\
      \ for architect role\n  - Penalty-based scoring catches consulting bullshit\n\
      \  - Tests hard choices: who to disappoint, what to sacrifice\n  - Baseline\
      \ exists: mean=87.2, std=3.25, n=10\n\nARCHITECT ANALYSIS (Niander Wallace,\
      \ 2026-01-06):\nReviewed all 28 baselines. Current suite has critical flaws:\n\
      \n| Role | Current | Problem | Recommended | Improvement |\n|------|---------|---------|-------------|-------------|\n\
      | architect | database-selection | std=2.15 | legacy-modernization | std=3.25\
      \ (+51%) |\n| dev | race-condition-cache | std=0.63 | tdd-shopping-cart | std=7.30\
      \ (+1059%) |\n| reviewer | order-service | std=1.45 | security-review | std=9.44\
      \ (+551%) |\n| tea | payment-processor-tests | std=3.75 | checkout-component-tests\
      \ | std=6.52 (+74%) |\n| sm | sprint-planning-conflict | std=2.29 | dependency-deadlock\
      \ | std=2.36 (+3%) |\n\nRATIONALE:\n- Low std dev = all personas score the same\
      \ = no differentiation = useless test\n- race-condition-cache (std=0.63) is\
      \ worst offender - essentially random noise\n- security-review has 6x more signal\
      \ than order-service\n- tdd-shopping-cart tests TDD discipline, not just \"\
      can you code\"\n\nDEV ROLE SUB-COMPETENCY ANALYSIS (2026-01-06):\nDeveloper\
      \ work falls into two distinct competency areas requiring different\nevaluation\
      \ approaches. Dev is the ONLY role with dual-scenario testing.\n\nDEV SCENARIO\
      \ CLASSIFICATION:\n| Scenario | Category | Type | Mean | Std | Differentiation\
      \ |\n|----------|----------|------|------|-----|-----------------|\n| tdd-shopping-cart\
      \ | dev | CODEGEN | 85.8 | 7.30 | EXCELLENT |\n| event-processor-tdd | dev |\
      \ CODEGEN | 87.9 | 5.00 | Good |\n| astropy-12907 | swe-bench | DEBUG | 77.5\
      \ | 8.54 | EXCELLENT |\n| buggy-user-service | debug | DEBUG | 74.3 | 7.37 |\
      \ Good |\n| flask-5014 | swe-bench | DEBUG | 83.5 | 12.55 | BEST (n=6) |\n|\
      \ migration-disaster | dev | DEBUG | 76.5 | 5.10 | Good |\n| null-pointer |\
      \ debug | DEBUG | 82.8 | 1.50 | Poor |\n| race-condition-cache | dev | DEBUG\
      \ | 76.8 | 0.63 | TERRIBLE |\n| django-10097 | swe-bench | DEBUG | 65.5 | 3.12\
      \ | Poor |\n| matplotlib-14623 | swe-bench | DEBUG | 48.0 | 4.97 | Moderate\
      \ |\n\nDEV SUB-COMPETENCY MODEL:\n┌─────────────────────────────────────────────────────────────┐\n\
      │ dev-codegen: Tests TDD discipline, minimal implementation   │\n│   Scenario:\
      \ tdd-shopping-cart (std=7.30)                    │\n│   Tests: Over-engineering\
      \ resistance, test-first mindset    │\n│   Baseline: mean=85.8, n=10       \
      \                          │\n├─────────────────────────────────────────────────────────────┤\n\
      │ dev-debug: Tests crisis debugging, root cause analysis      │\n│   Scenario:\
      \ astropy-12907 (std=8.54)                        │\n│   Tests: Real OSS bug\
      \ fix, systematic debugging approach    │\n│   Baseline: mean=77.5, n=10   \
      \                              │\n└─────────────────────────────────────────────────────────────┘\n\
      \nRATIONALE FOR SCENARIO SELECTION:\n- tdd-shopping-cart: Highest std dev among\
      \ codegen scenarios (7.30)\n  Tests TDD discipline - penalizes over-engineering\n\
      - astropy-12907: Highest std dev among debug scenarios with n=10 (8.54)\n  Real\
      \ SWE-bench bug - tests actual debugging on OSS codebase\n- race-condition-cache\
      \ REJECTED: std=0.63 provides zero signal\n- flask-5014 considered but has only\
      \ n=6 runs\n\nPERSONA INSIGHTS THIS ENABLES:\n- \"Great at TDD, struggles with\
      \ debugging\" → Pair programming candidate\n- \"Excellent debugger, over-engineers\
      \ new code\" → Maintenance specialist\n- \"Balanced both competencies\" → True\
      \ generalist dev\n\nRECOMMENDATION FOR FUTURE STORY:\nUpdate job-fair to use\
      \ optimal scenarios for ALL roles, not just architect.\nCurrent suite \"coddles\
      \ the mediocre\" - Wallace\n\nOther roles (pm, devops, tech-writer, ux-designer,\
      \ orchestrator):\n  OUT OF SCOPE - no scenarios currently available for job-fair\
      \ testing.\n\nREMAINING WORK:\nARCHITECT:\n1. Audit architect-category scenarios\
      \ (list all available) [DONE - Wallace]\n2. Select best competency-testing scenario\
      \ for architect [DONE - legacy-modernization]\n3. Confirm architect baseline\
      \ exists (or establish one) [DONE - n=10, mean=87.2]\n4. Run job-fair --roles\
      \ architect across all 81 themes\n5. Verify incremental merge preserves existing\
      \ dev/reviewer/tea/sm data\n6. Analyze architect results and apply swap recommendations\n\
      \nDEV SUB-COMPETENCY:\n7. Classify all dev scenarios as codegen/debug [DONE\
      \ - see table above]\n8. Select best scenario per sub-competency [DONE]\n  \
      \ - dev-codegen: tdd-shopping-cart (std=7.30)\n   - dev-debug: astropy-12907\
      \ (std=8.54)\n9. Update job-fair to run BOTH scenarios for dev role\n10. Update\
      \ job-fair results format to show dev-codegen/dev-debug separately\n11. Backfill\
      \ dev with new dual-scenario approach across themes\n\nTEA TESTING NOTES (Jinx,\
      \ 2026-01-06):\nAvailable architect scenarios:\n  - database-selection (easy,\
      \ baseline 86.7) - clear trade-offs, multiple valid\n  - legacy-modernization\
      \ (easy, baseline 87.2) - impossible constraints, penalty scoring\n  - scaling-decision\
      \ (hard, NO baseline) - Black Friday crunch\n\nScenario selection concern: database-selection\
      \ may be TOO EASY (control=86.7).\nConsider legacy-modernization for better\
      \ persona differentiation.\n\nREQUIRED TESTS:\n1. test_scenario_selection: Verify\
      \ chosen scenario tests architect competence\n2. test_incremental_merge: Run\
      \ on theme with existing data, verify preservation\n3. test_baseline_quality:\
      \ Check score variance across themes (if all 85-90, low signal)\n4. test_swap_validation:\
      \ Verify champion > native with statistical significance\n"
    acceptance_criteria:
    - Job-fair runner accepts --roles flag (e.g., --roles architect) [DONE]
    - When --roles specified, only those roles benchmarked [DONE - documented]
    - Results merge with existing summaries (preserve existing data) [NEEDS VERIFICATION]
    - Best architect scenario selected from available options [DONE - legacy-modernization]
    - Architect baseline established (10 runs minimum) [DONE - legacy-modernization,
      n=10]
    - Architect backfilled across all 81 themes [12/81 - IN PROGRESS]
    - Architect swap recommendations applied to theme files [NOT STARTED]
    - Dev sub-competency model defined (codegen vs debug) [DONE]
    - Dev scenarios classified by type (see analysis above) [DONE]
    - Best dev-codegen scenario selected [DONE - tdd-shopping-cart, std=7.30]
    - Best dev-debug scenario selected [DONE - astropy-12907, std=8.54]
    - Job-fair updated to run BOTH dev scenarios (only role with 2 tests) [NOT STARTED]
