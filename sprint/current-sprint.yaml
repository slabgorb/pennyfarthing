      - id: MSSCI-12522
        jira: MSSCI-12522
        title: "Refactor turbo mode into independent relay toggle"
        description: |
          Currently 'turbo' mode conflates two behaviors:
          1. Auto-accept file edits (gearshift)
          2. Auto-handoff between agents (relay)

          Agents frequently misinterpret 'turbo' as meaning 'skip all safeguards'
          when it really just means 'auto-handoff'.

          Refactor into:
          - Gearshift modes (mutually exclusive): plan, manual, accept
          - Relay mode (independent toggle): on/off

          Current 'turbo' behavior = accept + relay:on

          Implementation:
          - Update CyclistSettings type in settings.ts
          - Add relay_mode: boolean to WorkflowSettings
          - Remove 'turbo' from PermissionMode type
          - Update UI gearshift controls
          - Add separate relay toggle in UI
          - Migrate existing turbo configs to accept + relay:on
          - Update all hooks to check relay_mode instead of turbo
        points: 5
        priority: P1
