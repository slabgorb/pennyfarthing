epics:
  # ===========================================================================
  # EPIC 48: WheelHub Notification Consolidation (continued)
  # ===========================================================================
  - id: MSSCI-11942
    type: epic
    jira: MSSCI-11942
    title: "Epic: WheelHub Notification Consolidation"
    description: |
      Consolidate notification patterns across Cyclist. Replace polling with
      event-driven WebSocket channels, standardize reconnection behavior,
      and add cross-tab synchronization.
    points: 11
    completed_points: 4
    priority: P2
    status: in_progress
    stories:
      - id: MSSCI-11949
        jira: MSSCI-11949
        title: "Remove tool/skill log panels and consolidate to messages"
        description: |
          The tool-panel.js and skill-panel.js provide dedicated side panels for
          viewing tool executions and skill invocations. However, this information
          is already visible in the messages view with enriched tool descriptions
          (MSSCI-11929). The separate panels add complexity without unique value.
        points: 3
        priority: P2
        status: done
        completed: 2026-01-19
        repos: cyclist
        workflow: trivial
        acceptance_criteria:
          - tool-panel.js and its UI removed
          - skill-panel.js and its UI removed
          - Badge polling for these panels removed
          - Related localStorage keys cleaned up
          - Messages view remains the single source for tool/skill activity
      - id: MSSCI-11944
        jira: MSSCI-11944
        title: "Event-driven badge updates"
        description: |
          Replace 500ms setInterval badge polling with event-driven updates.
          PanelManager emits badge-changed event when counts change.
        points: 2
        priority: P2
        status: backlog
        repos: cyclist
        workflow: tdd
        acceptance_criteria:
          - PanelManager emits badge-changed event on count changes
          - tab-bar.js subscribes to event instead of polling
          - No 500ms setInterval in tab-bar.js
          - Badges update immediately on change
      - id: MSSCI-11945
        jira: MSSCI-11945
        title: "Livereload pattern alignment"
        description: |
          Migrate livereload from exponential backoff to 2s fixed reconnection
          to align with standard WheelHub pattern.
        points: 1
        priority: P3
        status: done
        completed: 2026-01-19
        repos: cyclist
        workflow: trivial
        acceptance_criteria:
          - livereload.js uses 2s fixed reconnection
          - Consistent with other WheelHub channels
      - id: MSSCI-11946
        jira: MSSCI-11946
        title: "LocalStorage cross-tab synchronization"
        description: |
          Create settings-sync.js module using BroadcastChannel API for
          cross-tab localStorage synchronization. Centralizes localStorage
          access across 16 files.
        points: 5
        priority: P2
        status: in_progress
        assigned_to: Keith Avery
        repos: cyclist
        workflow: tdd
        acceptance_criteria:
          - settings-sync.js module created with BroadcastChannel API
          - Theme changes in Tab 1 reflect in Tab 2 immediately
          - All localStorage access goes through settings-sync.js
          - 16 existing files refactored to use new module
