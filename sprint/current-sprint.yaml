  - id: epic-25
    title: Smart Question Detection & Quick Actions
    jira_key: MSSCI-11530
    description: |
      Improve Cyclist's ability to detect when Claude is asking questions
      or prompting for action. Reduce false positives (enumerations mistaken
      for questions), catch handoff prompts, and add "yes, proceed" buttons.
      Two-pronged approach: better parsing AND easier-to-parse Claude output.
    points: 18
    completed_points: 8
    priority: P1
    marker: ux
    repos: cyclist, pennyfarthing
    status: in_progress
    stories:
      - id: 25-1
        title: Audit Current Quick Actions Detection
        jira_key: MSSCI-11531
        description: |
          Review and document current detection patterns in quick-actions.js.
          Identify false positive patterns (enumerations, lists that aren't choices).
          Catalog missed patterns (handoffs, confirmations, proceed prompts).
        points: 2
        priority: P1
        status: done
        started: 2026-01-11
        completed: 2026-01-11
        assigned_to: Keith Avery
        repos: cyclist
        pr: 169
        pr_link: https://github.com/1898andCo/pennyfarthing/pull/169
        acceptance_criteria:
          - Document all current detection patterns
          - List of false positive examples
          - List of missed pattern examples
          - Recommendations for fixes
      - id: 25-2
        title: Fix Enumeration False Positives
        jira_key: MSSCI-11532
        description: |
          Stop detecting numbered lists as choices when they're just enumerations.
          Heuristics:
          - Check if list items are actionable (verbs vs nouns)
          - Check for question context before list
          - Check list length (>5 items likely enumeration)
          - Check for "here are" / "the following" prefixes
        points: 3
        priority: P1
        status: done
        started: 2026-01-11
        completed: 2026-01-11
        assigned_to: Keith Avery
        repos: cyclist
        pr: 171
        pr_link: https://github.com/your-org/cyclist/pull/171
        acceptance_criteria:
          - Numbered lists without question context ignored
          - "Here are the files" type lists not shown as choices
          - Long lists (>5) treated as enumeration by default
          - Reduces false positive rate significantly
      - id: 25-3
        title: Detect Handoff & Action Prompts
        jira_key: MSSCI-11533
        description: |
          Detect agent handoff and action prompts like:
          - "invoke /reviewer to continue"
          - "run /dev to implement"
          - "use /sm to finish"
          - "shall I proceed with..."
          - "ready for review"
          Show appropriate action button for each.
        points: 3
        priority: P1
        status: done
        started: 2026-01-11
        completed: 2026-01-11
        assigned_to: Keith Avery
        repos: cyclist
        pr: "#173"
        pr_link: https://github.com/1898andCo/pennyfarthing/pull/173
        acceptance_criteria:
          - Detects "invoke X" patterns
          - Detects "ready for X" patterns
          - Shows button to invoke the suggested command
          - Works for all Pennyfarthing agents
      - id: 25-4
        title: Universal 'Yes, Proceed' Button
        jira_key: MSSCI-11534
        description: |
          Add smart "Yes, proceed" detection for general confirmations:
          - "shall I..." / "should I..."
          - "would you like me to..."
          - "do you want me to..."
          - "ready to..." / "proceed with..."
          Always show "Yes" and "No" buttons for these.
        points: 2
        priority: P1
