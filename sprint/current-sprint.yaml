      - id: 31-8
        title: Eliminate redundant test runs in subagents
        description: |
          Multiple subagents independently run the full test suite during
          a single TDD cycle, wasting ~110 seconds per story:
          - reviewer-preflight runs tests (~36s)
          - dev-handoff runs tests again (~36s)
          - reviewer-handoff-approve runs tests again (~36s)

          Each subagent defensively re-verifies tests "just in case" but
          the result is redundant work. Solutions:
          - Cache test results in session file with timestamp
          - Skip test run if recent result exists (< 5 min old)
          - Or consolidate: only one subagent runs tests per phase
        points: 2
        priority: P1
        status: done
        started: 2026-01-13
        completed: 2026-01-13
        assigned_to: Keith Avery
        repos: pennyfarthing
        jira: MSSCI-11625
        pr: 235
        acceptance_criteria:
          - Test suite runs only once per TDD phase (not per subagent)
          - Session file caches last test result with timestamp
          - Subagents check cache before running tests
          - Cache invalidated on code changes (git diff check)
          - Total TDD cycle time reduced by ~70 seconds
      - id: 31-9
        title: Turn optimization - reduce API round-trips
        description: |
          Reduce the number of API turns (round-trips) during TDD workflow by:

          1. **Batching Bash commands**: Combine independent commands with &&
             - `git status && git branch` instead of separate calls
             - `git add . && git commit -m "msg" && git push` in one turn

          2. **Parallel tool calls**: Use more aggressive parallelization
             - Read multiple files in single turn
             - Spawn independent subagents in parallel

          3. **Smarter file operations**:
             - Grep instead of Read+search (grep reads internally)
             - Glob with brace expansion `{pat1,pat2}` instead of multiple globs

          4. **Compound subagents**: Create subagents that do multiple steps
             - Combine status-check + file-read into single spawn
             - Merge preflight checks into handoff subagents

          Target: Reduce average turns per story from ~50 to ~30 (40% reduction)
        points: 3
        priority: P1
        status: done
        started: 2026-01-13
        completed: 2026-01-13
        assigned_to: Keith Avery
        repos: pennyfarthing
        pr: 236
        acceptance_criteria:
          - Document turn-efficient patterns in dev-patterns skill
          - Update subagent prompts to batch bash commands
          - Audit main agents for sequential-to-parallel opportunities
          - Add guidance for compound subagent creation
          - Measure before/after turn counts on sample story
