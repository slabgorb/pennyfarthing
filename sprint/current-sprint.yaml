      - id: MSSCI-12274
        jira: MSSCI-12274
        title: "Support images in queued messages via base64 encoding"
        description: |
          When a user pastes an image and submits while Claude is processing,
          the image data is lost because the message queue only stores text strings.
          Extend the queue to store message objects with both text and images array,
          preserving base64-encoded image data for deferred submission.
        points: 3
