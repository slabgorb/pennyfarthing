  - id: 17-8
    title: 'Fix story panel not loading in Electron (IPC vs HTTP mismatch)'
    description: 'The Story Panel shows "No active story" in Electron even when
      there IS an active session with story data. The same functionality works
      correctly in the web view.

      Root cause: Web view uses HTTP API (`/api/story`) via Express router, while
      Electron uses IPC (`story:get` handler). Both call `getStoryInfo()` but the
      IPC path may have different project directory resolution or timing issues.

      Investigation needed:
      1. Compare project directory resolution between HTTP and IPC paths
      2. Check if IPC handler is being called (add logging)
      3. Verify `detectPennyfarthingProject()` returns true for IPC path
      4. Check timing of initial story fetch vs window ready

