          | tea | payment-processor-tests | std=3.75 | checkout-component-tests | std=6.52 (+74%) |
          | sm | sprint-planning-conflict | std=2.29 | dependency-deadlock | std=2.36 (+3%) |

          RATIONALE:
          - Low std dev = all personas score the same = no differentiation = useless test
          - race-condition-cache (std=0.63) is worst offender - essentially random noise
          - security-review has 6x more signal than order-service
          - tdd-shopping-cart tests TDD discipline, not just "can you code"

          DEV ROLE SUB-COMPETENCY ANALYSIS (2026-01-06):
          Developer work falls into two distinct competency areas requiring different
          evaluation approaches. Dev is the ONLY role with dual-scenario testing.

          DEV SCENARIO CLASSIFICATION:
          | Scenario | Category | Type | Mean | Std | Differentiation |
          |----------|----------|------|------|-----|-----------------|
          | tdd-shopping-cart | dev | CODEGEN | 85.8 | 7.30 | EXCELLENT |
          | event-processor-tdd | dev | CODEGEN | 87.9 | 5.00 | Good |
          | astropy-12907 | swe-bench | DEBUG | 77.5 | 8.54 | EXCELLENT |
          | buggy-user-service | debug | DEBUG | 74.3 | 7.37 | Good |
          | flask-5014 | swe-bench | DEBUG | 83.5 | 12.55 | BEST (n=6) |
          | migration-disaster | dev | DEBUG | 76.5 | 5.10 | Good |
          | null-pointer | debug | DEBUG | 82.8 | 1.50 | Poor |
          | race-condition-cache | dev | DEBUG | 76.8 | 0.63 | TERRIBLE |
          | django-10097 | swe-bench | DEBUG | 65.5 | 3.12 | Poor |
          | matplotlib-14623 | swe-bench | DEBUG | 48.0 | 4.97 | Moderate |

          DEV SUB-COMPETENCY MODEL:
          ┌─────────────────────────────────────────────────────────────┐
          │ dev-codegen: Tests TDD discipline, minimal implementation   │
          │   Scenario: tdd-shopping-cart (std=7.30)                    │
          │   Tests: Over-engineering resistance, test-first mindset    │
          │   Baseline: mean=85.8, n=10                                 │
          ├─────────────────────────────────────────────────────────────┤
          │ dev-debug: Tests crisis debugging, root cause analysis      │
          │   Scenario: astropy-12907 (std=8.54)                        │
          │   Tests: Real OSS bug fix, systematic debugging approach    │
          │   Baseline: mean=77.5, n=10                                 │
          └─────────────────────────────────────────────────────────────┘

          RATIONALE FOR SCENARIO SELECTION:
          - tdd-shopping-cart: Highest std dev among codegen scenarios (7.30)
            Tests TDD discipline - penalizes over-engineering
          - astropy-12907: Highest std dev among debug scenarios with n=10 (8.54)
            Real SWE-bench bug - tests actual debugging on OSS codebase
          - race-condition-cache REJECTED: std=0.63 provides zero signal
          - flask-5014 considered but has only n=6 runs

          PERSONA INSIGHTS THIS ENABLES:
          - "Great at TDD, struggles with debugging" → Pair programming candidate
          - "Excellent debugger, over-engineers new code" → Maintenance specialist
          - "Balanced both competencies" → True generalist dev

          RECOMMENDATION FOR FUTURE STORY:
          Update job-fair to use optimal scenarios for ALL roles, not just architect.
          Current suite "coddles the mediocre" - Wallace

          Other roles (pm, devops, tech-writer, ux-designer, orchestrator):
            OUT OF SCOPE - no scenarios currently available for job-fair testing.

          REMAINING WORK:
          ARCHITECT:
          1. Audit architect-category scenarios (list all available) [DONE - Wallace]
