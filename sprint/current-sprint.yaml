sprint:
  name: "TO Sprint 2604"
  jira_id: 276
  goal: WheelHub notification consolidation, skill frontmatter enhancement, and continued polish
  start_date: 2026-01-20
  end_date: 2026-02-02
  status: active

# Completed stories archived to: sprint/archive/sprint-2604-completed.yaml

epics:
  # ===========================================================================
  # EPIC 48: WheelHub Notification Consolidation
  # ===========================================================================
  - id: MSSCI-11942
    type: epic
    title: "Epic: WheelHub Notification Consolidation"
    priority: P2
    status: in_progress
    stories:
      - id: MSSCI-11945
        title: "Livereload pattern alignment"
        description: |
          Migrate livereload from exponential backoff to 2s fixed reconnection
          to align with standard WheelHub pattern.
        points: 1
        priority: P3
        status: backlog
        repos: cyclist
        workflow: trivial
        acceptance_criteria:
          - livereload.js uses 2s fixed reconnection
          - Consistent with other WheelHub channels
      - id: MSSCI-11946
        title: "LocalStorage cross-tab synchronization"
        description: |
          Create settings-sync.js module using BroadcastChannel API for
          cross-tab localStorage synchronization. Centralizes localStorage
          access across 16 files.
        points: 5
        priority: P2
        status: backlog
        repos: cyclist
        workflow: tdd
        acceptance_criteria:
          - settings-sync.js module created with BroadcastChannel API
          - Theme changes in Tab 1 reflect in Tab 2 immediately
          - All localStorage access goes through settings-sync.js
          - 16 existing files refactored to use new module
      - id: MSSCI-11950
        jira: MSSCI-11950
        title: "Background tasks panel not showing background tasks"
        description: |
          The background tasks panel in Cyclist is not displaying background
          tasks when they are running. Need to investigate and fix the data
          flow from task creation to panel display.
        points: 2
        priority: P1
        status: done
        completed: 2026-01-20
        repos: cyclist
        workflow: tdd
        acceptance_criteria:
          - Background tasks appear in panel when spawned
          - Task status updates shown in real-time
          - Completed tasks remain visible until dismissed
      - id: MSSCI-11948
        title: "Remove redundant popup tool use notifications"
        description: |
          With WheelHub consolidation complete, the popup tool use notifications
          are redundant. The approval modal and WebSocket channels now handle
          all tool use visibility. Remove the popup system to reduce complexity.
        points: 2
        priority: P2
        status: backlog
        repos: cyclist
        workflow: trivial
        acceptance_criteria:
          - Popup tool use notification code removed
          - No visual regression in tool use visibility
          - Approval modal remains the single source for tool interactions

