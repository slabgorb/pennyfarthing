      - packages/cyclist/src/main.ts (IPC handler at line ~649)
      - packages/cyclist/src/api/story.ts (HTTP router)
      - packages/cyclist/src/public/js/story.js (client-side refresh)
      - packages/cyclist/src/story-parser.ts (shared parsing logic)
      '
