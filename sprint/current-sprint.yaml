      - id: 24-3
        title: Enhanced diff viewer with history navigation
        description: |
          Improve the diff panel to handle multiple edits to the same file
          during a session. Currently only the last diff is visible.

          Views:
          1. Partial diffs - Navigate between individual edit operations
          2. Combined diff - Show cumulative changes (original → current)
          3. Original file - View file as it was before any edits
          4. Changed file - View current file state

          UI:
          - Navigation arrows (< >) to step through partial diffs
          - Indicator showing "Edit 2 of 5" or similar
          - Toggle buttons or tabs for view modes
          - Keyboard shortcuts for navigation (j/k or arrows)

          Data model:
          - Store array of diffs per file instead of single diff
          - Track original file content at session start
          - Compute combined diff on demand
        points: 5
        priority: P2
        status: done
        started: 2026-01-12
        completed: 2026-01-12
        assigned_to: Keith Avery
        repos: cyclist
        pr: "#194"
        acceptance_criteria:
          - Navigate between partial diffs with < > arrows
          - Shows "Edit N of M" indicator
          - Combined diff view shows all changes merged
          - Original file view shows pre-edit content
          - Changed file view shows current content
          - Keyboard navigation works (arrows or j/k)
  - id: epic-30
    title: Developer Workflow Documentation
    description: |
      Document advanced developer workflows, environment setup, and tooling
      configurations that improve productivity with Claude Code and Pennyfarthing.
      These are opt-in patterns for power users.
    points: 5
    completed_points: 3
    priority: P3
    marker: docs
    repos: pennyfarthing
    status: in_progress
    stories:
      - id: 30-1
        title: Multi-account Claude Code setup guide
        description: |
          Document the symlink-based multi-account setup for developers who have
          multiple Claude Max Pro accounts (e.g., personal + work, or multiple clients).

          Cover:
          - Problem: Claude Code stores all data in ~/.claude regardless of account
          - Solution: Separate directories with symlink switching
          - Setup: Directory structure, shell functions, startup notification
          - Usage: Daily workflow, switching accounts, checking stats per account
          - ccusage: How to run usage reports per account

          Include the shell functions for ~/.zshrc and explain the conditional
          startup message that only shows for configured users.
        points: 2
        priority: P3
        status: planned
        repos: pennyfarthing
        acceptance_criteria:
          - Guide covers problem and solution clearly
          - Shell setup code provided and explained
          - Daily workflow documented step-by-step
          - ccusage per-account usage documented
          - Conditional startup logic explained
      - id: 30-2
        title: Quick commit commands (/chore, /ux, /doc)
        description: |
          Create slash commands for quickly committing dirty changes without
          full git-cleanup ceremony. For small artifacts, docs updates, and
          minor fixes that don't need story tracking.

          Commands:
          - /chore - Creates chore/* branch, commits, merges to develop
          - /ux - Creates ux/* branch for UI/styling tweaks
          - /doc - Creates docs/* branch for documentation updates

          Workflow:
          1. Detect dirty files in working directory
          2. Create appropriately-named branch from develop
          3. Stage all changes (or prompt for selective staging)
          4. Generate commit message from file analysis
          5. Commit with conventional commit format
          6. Merge to develop (local)
          7. Push develop
          8. Log to sprint tracking under "Chores" section

          Features:
          - Auto-generate commit message from changed files
          - Optional message override via argument: /chore "custom message"
          - Track in current-sprint.yaml under new "chores" section
          - Support multi-repo via repos.yaml
        points: 3
        priority: P2
        status: done
        completed: 2026-01-12
        started: 2026-01-12
        assigned_to: Keith Avery
        repos: pennyfarthing
        pr: "#195"
        acceptance_criteria:
          - /chore, /ux, /doc commands implemented
          - Creates branch, commits, merges, pushes in one command
          - Auto-generates appropriate commit message
          - Optional custom message via argument
          - Logs to sprint chores section
          - Works across configured repos
