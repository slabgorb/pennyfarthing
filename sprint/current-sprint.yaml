  # =========================================================================
  # EPIC 3 - Context Management & Circuit Breaker (5 pts remaining of 13)
  # =========================================================================
  - id: epic-3
    title: "Automatic Context Management & Circuit Breaker"
    description: |
      Implement automatic context monitoring that detects when agents
      approach 70% threshold and triggers handoffs or session continuation.
      Add circuit breaker pattern to prevent runaway context usage.
    points: 13
    completed_points: 8  # 3-1, 3-2, 3-5 done in prior sprints
    priority: P1
    marker: "high-priority"
    repos: pennyfarthing
    stories:
      # PREVIOUSLY COMPLETED (8 pts - not in this sprint, for reference only)
      # - 3-1: Context usage tracking hook (3 pts) - done
      # - 3-2: Automatic warning at 70% threshold (3 pts) - done
      # - 3-5: Context usage in statusline (2 pts) - done

      # SPRINT 7 STORIES (5 pts)
      - id: "3-3"
        title: "Implement circuit breaker at 85% threshold"
        description: |
          Hard stop at 85% to prevent context overflow.
          - Force handoff or session end at 85%
          - Save checkpoint before circuit break
          - Provide recovery path for user
        points: 3
        priority: P1
        status: done
        completed: 2026-01-06
        pr: "https://github.com/1898andCo/pennyfarthing/pull/82"
        repos: pennyfarthing
        acceptance_criteria:
          - Circuit breaker triggers at 85%
          - Checkpoint saved before break
          - Clear instructions for resumption

      - id: "3-4"
        title: "Add session continuation workflow"
        description: |
          Enable seamless session continuation after break.
          - /continue-session command
          - Load checkpoint and context summary
          - Resume from last known good state
        points: 2
        priority: P2
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - /continue-session loads previous checkpoint
          - Context summary provided for new session
          - Workflow continues without lost work

