      - id: 35-13
        title: Window state persistence
        description: |
          Remember and restore Electron window state across sessions:
          - Window size (width, height)
          - Window position (x, y coordinates)
          - Screen/monitor placement (for multi-monitor setups)
          - Panel layout (collapsed/expanded states, sizes)
          - Maximized/fullscreen state

          Implementation:
          - Use electron-window-state or custom persistence to localStorage/file
          - Save state on window resize, move, and before close
          - Restore state on app launch
          - Handle edge cases: monitor disconnected, resolution changed
          - Validate restored bounds are within visible screen area
          - Default to centered on primary display if invalid

          This improves UX by remembering user's preferred layout instead of
          resetting to defaults on every launch.
        points: 2
