  # =========================================================================
  # EPIC 13 - Cyclist UX Improvements
  # =========================================================================
  - id: epic-13
    title: "Cyclist UX Improvements"
    description: |
      Enhance Cyclist's user experience with quality-of-life improvements
      that reduce friction during agent interactions.
    points: 8
    completed_points: 0
    priority: P2
    marker: "ux"
    repos: cyclist
    status: backlog
    stories:
      - id: "13-1"
        title: "Implement message input buffer for non-blocking input"
        description: |
          Currently, users cannot type or queue messages while Claude is
          processing a response - input is blocked until the response completes.

          Implement a message buffer that:
          - Allows users to type and submit messages while Claude is working
          - Queues messages for delivery when Claude is ready
          - Shows visual indicator of queued messages
          - Delivers queued messages in order once current response completes

          This enables a more fluid conversation flow where users can
          capture thoughts immediately rather than waiting.
        points: 5
        priority: P2
        status: backlog
        repos: cyclist
        acceptance_criteria:
          - Input field remains active while Claude is processing
          - Messages submitted during processing are queued (not lost)
          - Visual indicator shows number of queued messages
          - Queued messages delivered in FIFO order after response
          - Queue persists if user navigates away and returns
          - Clear queue option available if user changes mind

      - id: "13-2"
        title: "Fix tab panel layout - expanded state hides main content"
        description: |
          The tab panel (Files, Diffs) has layout issues:

          1. When expanded, the tab panel takes over the entire main content area,
             hiding the Claude conversation view completely
          2. The panel should share space with the main content, not replace it
          3. Need proper flexbox/grid layout so both are visible simultaneously

          Current behavior:
          - Panel starts collapsed (fixed in 3bd1dc11)
          - Expanding panel makes conversation view disappear
          - Only Files tab content visible when expanded

          Expected behavior:
          - Panel expands to ~30-40% of main content height (configurable)
          - Conversation view remains visible above panel
          - Drag handle to resize panel (nice to have)
        points: 3
        priority: P1
        status: in-progress
        started: 2026-01-08
        repos: cyclist
        acceptance_criteria:
          - Tab panel expansion does not hide conversation view
          - Both conversation and tab content visible simultaneously
          - Panel has sensible default height (max 40% of viewport)
          - Panel can be collapsed to minimize
