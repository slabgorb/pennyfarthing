        repos: pennyfarthing
        completed: "2026-01-22"
      - id: MSSCI-12346
        jira: MSSCI-12346
        title: "Improve init/update/doctor for legacy install cleanup"
        description: |
          When installing Pennyfarthing over a legacy install (or updating), stale
          files can remain that conflict with or shadow Pennyfarthing's proper files.

          Discovered in ~/Projects/conductor:
          - `.claude/scripts/statusline.sh` (legacy, simplified) shadows
            `.pennyfarthing/scripts/misc/statusline.sh` (proper, feature-rich)
          - `settings.local.json` may point to wrong statusline path
          - `.claude/persona-config.yaml` may conflict with `.pennyfarthing/config.local.yaml`

          Implementation:
          - `init`: Detect legacy `.claude/scripts/` files, offer to remove or migrate
          - `update`: Check for stale files that shadow pennyfarthing-dist symlinks
          - `doctor`: Add check for conflicting statusline scripts, fix path in settings
          - All: Validate statusline path in settings.local.json points to correct location

          Acceptance Criteria:
          - [ ] doctor --fix removes stale `.claude/scripts/statusline.sh` if pennyfarthing one exists
          - [ ] doctor --fix updates settings.local.json statusline path if wrong
