          - Session file tracks active background task IDs
          - Agents can check background task status via TaskOutput
          - Dev-patterns skill documents when to use background execution
          - At least one subagent (testing-runner) updated to support background mode
          - Main agents can spawn tests in background while continuing work
      - id: 31-15
        title: Background task completion notifications in Cyclist
        description: |
          Add UI notifications when background subagents complete in Cyclist.
          Currently, background tasks run silently - the agent must poll with
          TaskOutput to check results. Users have no visibility into completion.

          **Implementation:**
          1. Track background task IDs in main process when spawned
          2. Emit IPC event when background task completes
          3. Add notification/toast component to Cyclist UI
          4. Show "Background task X completed" with result summary
          5. Optional: Badge indicator for pending background results

          **UI Options:**
          - Toast notification (auto-dismiss after N seconds)
          - Badge on Tool Log panel tab
          - Extend Tool Activity Bar with background task section
        points: 3
        priority: P2
        status: backlog
        repos: cyclist
        acceptance_criteria:
          - Cyclist tracks background task IDs from Task tool
          - UI notification appears when background task completes
          - Notification shows task type and success/failure status
