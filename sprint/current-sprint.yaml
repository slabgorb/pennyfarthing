    marker: quick-win
    repos: cyclist
    status: done
    completed: 2026-01-11
    notes: |
      Epic premise was flawed. All stories wontfix:
      - 29-1, 29-2: Can't intercept tool execution (architectural limitation)
      - 29-3: Already implemented differently (dead code)
      - 29-4: Not worth pursuing alone
    stories:
      - id: 29-1
        title: Integrate approval-gate.ts
        description: |
          Wire up the Bash approval gate module (from Story 22-3).
          - Import into message handler
          - Call interceptBashToolUse() before executing Bash tools
          - Surface approval UI in renderer
          - Module: src/approval-gate.ts (142 lines, tested)
        points: 2
        priority: P1
        status: wontfix
        repos: cyclist
        wontfix_reason: |
          Architectural limitation: Claude Code CLI executes tools internally.
          By the time Cyclist sees tool_use messages via --print-json stream,
          the command has already executed. Cannot intercept/pause execution.
          Module tests pass in isolation but integration is not feasible.
        acceptance_criteria:
          - approval-gate.ts imported and called
          - Bash commands trigger approval flow
          - UI shows approval prompt
          - Existing tests pass
      - id: 29-2
        title: Integrate dangerous-path.ts
        description: |
          Wire up the dangerous path detection module (from Story 22-4).
          - Import into message handler
          - Call interceptDangerousPath() for file operations
