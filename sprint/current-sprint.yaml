      to VS Code users. The extension provides:
      - Terminal integration for Claude Code sessions
      - Sidebar panel showing agent status and personas
      - Webview panel adapting Cyclist's UI components
      - Command palette integration for skills and workflows

      Architecture approach:
      - WheelHub server runs as extension-hosted process
      - Reflector HTML comments parsed by extension, rendered in VS Code UI
      - TirePump integrates with VS Code's workspace state API
      - Reuse Cyclist's public/js components in webview context
    priority: P2
    status: done
    completed: 2026-01-21
    completed_points: 29
