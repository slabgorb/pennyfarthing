sprint:
  number: 8
  goal: Eliminate state drift and enhance skill discovery for production resilience
  planned_start: 2026-01-12
  status: active
  velocity_target: 30
summary:
  total_points: 27
  completed_points: 14
  remaining_points: 13
  notes: |
    Sprint 8 focus: State reconciliation, skill discovery, Cyclist web mode parity.

    EPICS:
    - Epic 8 (State Reconciliation) - 8 pts - P1
    - Epic 9 (Skill Discovery) - 13 pts - P2
    - Epic 20 (Cyclist Web Mode) - 8 pts - P2
    - Epic 22 carryover (22-6) - 1 pt - P3
epics:
  - id: epic-8
    title: Automatic State Reconciliation
    description: |
      Eliminate drift between git state and sprint YAML by automating
      state synchronization. Work happens across multiple sessions and
      PRs get merged outside the workflow - the framework should detect
      and reconcile this automatically.
    points: 8
    completed_points: 8
    priority: P1
    marker: high-priority
    repos: pennyfarthing
    status: done
    stories:
      - id: 8-1
        title: Git hook for PR merge detection
        description: |
          Post-merge hook that detects when PRs merge to develop/main.
          - Parse PR title/branch for story ID (e.g., feat/5-2-*)
          - Auto-update sprint YAML status to 'done'
          - Add completed date
          - Works even when merge happens outside workflow
        points: 3
        priority: P1
        status: done
        started: 2026-01-11
        completed: 2026-01-11
        assigned_to: Keith Avery
        repos: pennyfarthing
        acceptance_criteria:
          - Hook installed via pennyfarthing setup
          - Detects story ID from branch name pattern
          - Updates sprint YAML automatically
          - Logs reconciliation to .session/
      - id: 8-2
        title: Startup drift detection
        description: |
          On agent activation, detect drift between git and YAML state.
          - Compare merged PRs vs sprint YAML status
          - Identify stories marked in-progress but already merged
          - Auto-fix or warn user before proceeding
        points: 3
        priority: P1
        status: done
        started: 2026-01-11
        completed: 2026-01-11
        assigned_to: Keith Avery
        repos: pennyfarthing
        acceptance_criteria:
          - workflow-status-check detects merged-but-not-closed
          - Clear report of drifted stories
          - Option to auto-reconcile
      - id: 8-3
        title: Session boundary breadcrumbs
        description: |
          Better markers for cross-session continuity.
          - Write checkpoint on session end
          - Include last agent, story, phase, git SHA
          - Next session loads and validates checkpoint
        points: 2
        priority: P2
        status: done
        started: 2026-01-11
        completed: 2026-01-11
        assigned_to: Keith Avery
        repos: pennyfarthing
        acceptance_criteria:
          - Session checkpoint written to .session/checkpoints.log on exit
          - New session validates against current git state
          - Warns if state changed between sessions
