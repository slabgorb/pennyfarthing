# ============================================================================
# SPRINT 3 PLANNING
# ============================================================================

sprint_3:
  number: 3
  goal: "Interactive theme creation and remaining permissions framework"
  planned_start: 2026-01-08
  planned_end: 2026-01-21
  status: planning

  epics:
    - id: epic-6
      title: "Interactive Theme Wizard"
      description: |
        Interactive slash command for creating custom persona themes without
        manual YAML editing. Supports three creation modes (AI-driven, guided,
        manual) with version tracking to warn users when themes may be stale.
      points: 13
      priority: P2
      repos: pennyfarthing
      jira: https://1898andco.atlassian.net/browse/MSSCI-11196
      stories:
        - id: "6-1"
          title: "Create /theme-maker command skeleton with mode selection"
          description: |
            Create the base slash command with mode selection and theme naming.

            Usage: /theme-maker

            Flow:
            1. Ask: Theme name? (validates unique, valid filename)
            2. Ask: Creation mode?
               - AI-Driven: "I'll generate everything from a concept"
               - Guided: "I'll suggest options, you pick"
               - Manual: "You specify everything"
            3. Dispatch to mode handler
            4. Write skeleton theme to .claude/pennyfarthing/themes/{name}.yaml

            Files:
            - pennyfarthing-dist/commands/theme-maker.md
            - Create .claude/pennyfarthing/themes/ directory on first use
          points: 3
          priority: P1
          status: done
          started: 2025-12-28
          completed: 2025-12-28
          repos: pennyfarthing
          jira: https://1898andco.atlassian.net/browse/MSSCI-11197
          acceptance_criteria:
            - /theme-maker launches interactive wizard
            - Mode selection works with AskUserQuestion
            - Creates theme directory if missing
            - Writes skeleton YAML with pennyfarthing_version field
            - Validates theme name (no spaces, no conflicts)

        - id: "6-2"
          title: "Implement AI-Driven mode"
          description: |
            User provides a universe/concept, AI generates all 10 agent personas.

            Flow:
            1. Ask: "Describe your theme universe" (text input)
               Examples: "noir detective", "pirates", "ancient Rome", "cyberpunk"
            2. AI generates all 10 agents with appropriate characters
            3. Show preview of generated theme
            4. Ask: Confirm, regenerate, or edit?
            5. Write complete theme file
          points: 3
          priority: P1
          status: done
          started: 2025-12-29
          completed: 2025-12-29
          repos: pennyfarthing
          jira: https://1898andco.atlassian.net/browse/MSSCI-11198
          acceptance_criteria:
            - Accepts free-text universe description
            - Generates coherent characters across all 10 agents
            - Characters fit their agent roles (SM=leader, TEA=analyst, etc.)
            - Preview shows all agents before confirming
            - Regenerate option creates fresh set

        - id: "6-3"
          title: "Implement Guided mode"
          description: |
            AI suggests 3-4 character options per agent, user picks.

            Flow:
            1. Ask: "Describe your theme universe"
            2. For each agent (SM, TEA, Dev, Reviewer, ...):
               - AI suggests 3-4 fitting characters
               - User picks one (or "Other" for custom)
            3. AI fills in style/trait/quote for selected characters
            4. Preview and confirm
          points: 3
          priority: P1
          status: done
          started: 2025-12-29
          completed: 2025-12-30
          branch: feat/6-3-guided-mode
          repos: pennyfarthing
          jira: https://1898andco.atlassian.net/browse/MSSCI-11199
          pr_link: https://github.com/1898andCo/pennyfarthing/pull/24
          acceptance_criteria:
            - Presents 3-4 character options per agent
            - Options fit the agent role and universe
            - Other option allows custom character name
            - Generates style/trait/quote for selections
            - Can go back and change previous selections

        - id: "6-4"
          title: "Implement Manual mode"
          description: |
            User specifies everything - character, style, trait, quote per agent.

            Flow:
            1. Ask: Theme description (metadata)
            2. For each agent:
               - Ask: Character name
               - Ask: Style description
               - Ask: Signature quote
            3. AI fills in remaining fields (role, expertise, helper)
            4. Preview and confirm
          points: 2
          priority: P2
          status: done
          started: 2025-12-30
          completed: 2025-12-30
          branch: feat/6-4-manual-mode
          pr: https://github.com/1898andCo/pennyfarthing/pull/26
          repos: pennyfarthing
          jira: https://1898andco.atlassian.net/browse/MSSCI-11200
          acceptance_criteria:
            - Collects character, style, quote for each agent
            - AI completes remaining fields intelligently
            - Preview shows complete theme
            - Can skip agents to use defaults
          completion_summary: "Added Manual Mode section to theme-maker.md (~150 lines). Users specify character, style, quote per agent directly with skip option for defaults. AI fills remaining fields. PR #26 merged."

        - id: "6-5"
          title: "Add version tracking and compatibility warnings"
          description: |
            Warn users when custom themes may be outdated.

            Theme file includes:
              pennyfarthing_version: "3.5.3"
              created: 2025-12-28
              last_updated: 2025-12-28

            agent-session.sh changes:
            - Detect custom theme (path contains .claude/pennyfarthing/themes/)
            - Compare pennyfarthing_version with current VERSION
            - If major/minor version differs, show warning

            Warning format:
              ⚠️ Theme 'my-theme' was created with Pennyfarthing 3.2.0
                 Current version: 3.5.3 - agent roles may have changed.
                 Run '/theme-maker --update my-theme' to review.
          points: 2
          priority: P1
          status: done
          started: 2025-12-30
          completed: 2025-12-30
          branch: feat/6-5-version-tracking
          pr: https://github.com/1898andCo/pennyfarthing/pull/25
          repos: pennyfarthing
          jira: https://1898andco.atlassian.net/browse/MSSCI-11201
          acceptance_criteria:
            - Custom themes include version metadata
            - agent-session.sh detects version mismatch
            - Warning displayed but doesn't block usage
