  - id: epic-33
    title: Runtime Permission Management
    description: |
      Allow agents to request and manage tool permissions at runtime.
      Currently permissions must be pre-configured; agents can't request
      spot permissions for tools like WebFetch when needed.
    points: 12
    completed_points: 0
    priority: P1
    marker: ux
    repos: pennyfarthing, cyclist
    status: backlog
    stories:
      - id: 33-1
        title: Permission request protocol
        description: |
          Define how agents request permissions:
          - Structured permission request format
          - User prompt/approval flow
          - Temporary vs persistent grants
        points: 3
        priority: P0
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - Permission request schema defined
          - Protocol documented in guides/
          - Supports tool name, reason, scope
          - Defines grant types (once, session, always)
      - id: 33-2
        title: /permissions skill
        description: |
          Skill to view and manage permissions:
          - List current permissions
          - Grant/revoke tool access
          - Show permission history
        points: 2
        priority: P0
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - /permissions lists active grants
          - /permissions grant <tool> adds permission
          - /permissions revoke <tool> removes
          - Shows grant type and expiry
      - id: 33-3
        title: Cyclist permission UI
        description: |
          Visual permission management in Cyclist:
          - Permission request modal
          - Quick approve/deny buttons
          - Permission status indicator
        points: 3
        priority: P1
        status: backlog
        repos: cyclist
        acceptance_criteria:
          - Modal displays on permission request
          - One-click approve/deny
          - Shows tool and reason
          - Status indicator in UI
      - id: 33-4
        title: Spot permission grants
        description: |
          Allow one-time permission grants:
          - "Allow once" option
          - "Allow for this session"
          - "Always allow"
        points: 2
        priority: P1
        status: backlog
        repos: pennyfarthing, cyclist
        acceptance_criteria:
          - Three grant scopes implemented
          - UI reflects scope selection
          - Session grants clear on exit
          - Persistent grants survive restart
      - id: 33-5
        title: Permission presets by workflow
        description: |
          Workflows can declare required permissions.
          Auto-prompt for missing permissions on workflow start.
        points: 2
        priority: P2
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - Workflow schema supports permissions field
          - Workflow start checks required permissions
          - Prompts for missing permissions
          - Cached grants skip prompts

