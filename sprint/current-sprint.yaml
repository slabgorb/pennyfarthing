epics:
  - id: epic-31
    title: Customizable Workflow Engine
    description: |
      Infrastructure for user-defined workflows. Replace hardcoded TDD flow
      (SM → TEA → Dev → Reviewer) with configurable YAML-based workflows.
      Users can define custom agent sequences, routing rules, and gates.
    points: 37
    completed_points: 30
    priority: P1
    marker: strategic
    repos: pennyfarthing
    status: in_progress
    jira: MSSCI-11599
    stories:
      - id: 31-15
        title: Background task completion notifications in Cyclist
        description: |
          Add UI notifications when background subagents complete in Cyclist.
          Currently, background tasks run silently - the agent must poll with
          TaskOutput to check results. Users have no visibility into completion.

          Implementation:
          1. Track background task IDs in main process when spawned
          2. Emit IPC event when background task completes
          3. Add notification/toast component to Cyclist UI
          4. Show "Background task X completed" with result summary
          5. Optional: Badge indicator for pending background results

          UI Options:
          - Toast notification (auto-dismiss after N seconds)
          - Badge on Tool Log panel tab
          - Extend Tool Activity Bar with background task section
        points: 3
        priority: P2
        status: backlog
        repos: cyclist
        acceptance_criteria:
          - Cyclist tracks background task IDs from Task tool
          - UI notification appears when background task completes
          - Notification shows task type and success/failure status
          - User can click notification to see full result
          - Works with testing-runner and other background subagents
      - id: 31-17
        title: "Bug: Trivial workflow phase naming inconsistency"
        description: |
          The trivial workflow uses phase names that don't match the agent
          it routes to. Phase is "implement" but agent is "dev". This causes
          confusion in session file tracking and workflow visualization.

          Fix: Rename trivial workflow phases to match agent names, or
          add phase-to-agent mapping in workflow definition.
        points: 1
        priority: P2
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - Trivial workflow phase names match agent names
          - Session file shows correct phase/agent correlation
          - Workflow visualization displays correct agent names
  - id: epic-33
    title: Runtime Permission Management
    description: |
      Allow agents to request and manage tool permissions at runtime.
      Currently permissions must be pre-configured; agents can't request
      spot permissions for tools like WebFetch when needed.
    points: 12
    completed_points: 7
    priority: P1
    marker: ux
    repos: pennyfarthing, cyclist
    status: in_progress
    jira: MSSCI-11705
    stories:
      - id: 33-5
        title: Permission presets by workflow
        description: |
          Workflows can declare required permissions.
          Auto-prompt for missing permissions on workflow start.
        points: 2
        priority: P2
        status: backlog
        repos: pennyfarthing
        jira: MSSCI-11710
        acceptance_criteria:
          - Workflow schema supports permissions field
          - Workflow start checks required permissions
          - Prompts for missing permissions
          - Cached grants skip prompts
  - id: epic-35
    title: Cyclist UI/UX Improvements
    description: |
      Surface settings and controls where they're used instead of burying
      them in popup dialogs. Reduce friction by putting options in context.
      Fix existing UI bugs and add user-requested customization features.
    points: 29
    completed_points: 13
    priority: P2
    marker: ux
    repos: cyclist
    status: in_progress
    jira: MSSCI-11715
    stories:
      - id: 35-6
        title: Font face selector
        description: |
          Let users choose terminal and UI font faces. Currently no
          font customization exists - fonts are hardcoded in CSS.

          Implementation:
          - Add font selector to settings panel
          - Separate options for terminal font and UI font
          - List of monospace fonts for terminal (system + web fonts)
          - Preview font before applying
          - Save preference and apply on startup
        points: 2
        priority: P2
        status: done
        started: 2026-01-15
        completed: 2026-01-15
        assigned_to: Keith Avery
        repos: cyclist
        jira: MSSCI-11721
        acceptance_criteria:
          - Font selector in settings panel
          - Separate terminal and UI font options
          - Dropdown with available monospace fonts
          - Font preview in settings before applying
          - Font preference saved and restored on startup
          - Terminal (xterm.js) respects font setting
      - id: 35-8
        title: Fix theme switcher
        description: |
          ThemePicker (persona theme, not color theme) has multiple bugs
          making it difficult to use:

          Bugs to fix:
          - Recent themes not persisted between sessions
          - Async loading issues cause empty state
          - Persona click handler conflicts (popup vs picker)
          - loadThemeMetadata() fails silently if IPC unavailable
          - Event handler removal assumes listeners exist

          This is the persona/character theme switcher (alice-in-wonderland,
          discworld, etc), not the color theme (dark/light).
        points: 2
        priority: P1
        status: backlog
        repos: cyclist
        jira: MSSCI-11723
        acceptance_criteria:
          - Recent themes persisted in localStorage
          - Async loading shows loading state, handles errors
          - Click handler consistently opens picker (no conflicts)
          - Graceful fallback when IPC unavailable
          - No console errors during normal operation
          - Theme switch actually updates persona display
      - id: 35-9
        title: Settings panel fixes and expansion
        description: |
          Fix existing bugs and expand settings functionality:

          Bugs to fix:
          - Settings store lazy-loading can fail silently
          - Theme browser async issues during initial load
          - localStorage vs IPC sync conflicts
          - Form state management issues (selectedThemeData unused)
          - window.close() fails in non-Electron context

          Expansion:
          - Add validation for all settings values
          - Show confirmation before discarding unsaved changes
          - Group settings into logical tabs/sections
          - Add reset to defaults option
        points: 3
        priority: P1
        status: backlog
        repos: cyclist
        jira: MSSCI-11724
        acceptance_criteria:
          - Settings store initialization errors handled gracefully
          - Theme browser shows loading state during async load
          - No sync conflicts between localStorage and IPC
          - Unsaved changes warning before close
          - Settings validation with error messages
          - Reset to defaults button works
          - Settings organized into logical sections
      - id: 35-11
        title: Clickable file paths in diff view
        description: |
          File paths in diff panel should be clickable to open the
          file in the OS default editor/viewer. Reduces friction
          when user wants to edit a file shown in diff.

          Implementation:
          - Make file path header clickable
          - Use Electron shell.openPath() to open in default app
          - Visual indication that path is clickable (underline, cursor)
          - Handle missing files gracefully (show error toast)
        points: 1
        priority: P2
        status: backlog
        repos: cyclist
        jira: MSSCI-11726
        acceptance_criteria:
          - File path in diff header is clickable
          - Click opens file in OS default application
          - Cursor changes to pointer on hover
          - Path underlined or styled to indicate clickable
          - Error toast if file no longer exists
          - Works on macOS (shell.openPath)
      - id: 35-12
        title: Skill invocations panel
        description: |
          Add a vertical panel showing skill invocations during the session.
          Skills (/commit, /review-pr, /workflow, etc.) are invoked frequently
          but currently there's no dedicated UI to see which skills were called.

          Implementation:
          - New collapsible panel (similar to file/diff/tool panels)
          - List skill invocations chronologically
          - Show: skill name, timestamp, status (running/complete/error)
          - Expandable to show skill arguments and output summary
          - Clear button to reset list
          - Filter/search within invocations
        points: 3
        priority: P2
        status: backlog
        repos: cyclist
        jira: MSSCI-11727
        acceptance_criteria:
          - Dedicated panel for skill invocations
          - Shows skill name and invocation time
          - Status indicator (running spinner, checkmark, error icon)
          - Expandable rows to show arguments and result summary
          - Panel is collapsible and resizable
          - Persists collapse state in localStorage
          - Clear button to reset invocation history
          - Works with all skill types (built-in and custom)
      - id: 35-13
        title: Window state persistence
        description: |
          Remember and restore Electron window state across sessions:
          - Window size (width, height)
          - Window position (x, y coordinates)
          - Screen/monitor placement (for multi-monitor setups)
          - Panel layout (collapsed/expanded states, sizes)
          - Maximized/fullscreen state

          Implementation:
          - Use electron-window-state or custom persistence to localStorage/file
          - Save state on window resize, move, and before close
          - Restore state on app launch
          - Handle edge cases: monitor disconnected, resolution changed
          - Validate restored bounds are within visible screen area
          - Default to centered on primary display if invalid

          This improves UX by remembering user's preferred layout instead of
          resetting to defaults on every launch.
        points: 2
        priority: P2
        status: backlog
        repos: cyclist
        acceptance_criteria:
          - Window size restored on launch
          - Window position restored on launch
          - Panel collapse states restored (portrait, diff, tool panels)
          - Panel sizes/widths restored
          - Maximized state restored correctly
          - Handles missing monitor gracefully (falls back to primary)
          - Handles out-of-bounds position (recenters if off-screen)
          - Works on macOS (primary target)
  - id: epic-36
    title: OTEL Tool Call Enrichment
    description: |
      Enrich OpenTelemetry data with contextual information from Claude tool calls.
      OTEL spans from Claude Code contain basic timing info, but we have much richer
      data available: file paths for Read/Edit, command output for Bash, search
      results for Grep/Glob, etc. Correlate and enrich spans in real-time.
    points: 15
    completed_points: 9
    priority: P2
    marker: observability
    repos: cyclist, pennyfarthing
    status: in_progress
    jira: MSSCI-11728
    stories:
      - id: 36-3
        title: Bash tool enrichment
        description: |
          Enrich Bash tool spans with command execution context:
          - Command executed (sanitized for secrets)
          - Exit code
          - Output summary (first/last N lines, truncation indicator)
          - Duration breakdown (queue time vs execution time)
          - Working directory
        points: 2
        priority: P1
        status: backlog
        repos: cyclist
        jira: MSSCI-11735
        acceptance_criteria:
          - Command included in span (secrets redacted)
          - Exit code captured
          - Output summary (first 5 lines, last 5 lines if truncated)
          - Execution duration accurate
          - Working directory included
      - id: 36-5
        title: Task/subagent enrichment
        description: |
          Enrich Task tool spans with subagent context:
          - Subagent type spawned
          - Prompt summary (first N chars)
          - Result summary
          - Turn count within subagent
          - Background vs foreground execution
        points: 2
        priority: P2
        status: backlog
        repos: cyclist
        jira: MSSCI-11733
        acceptance_criteria:
          - Subagent type in span attributes
          - Prompt summary (first 200 chars)
          - Result summary when complete
          - Turn count tracked
          - Background flag included
      - id: 36-6
        title: Enriched span export and visualization
        description: |
          Export enriched spans and visualize in Cyclist UI:
          - Custom OTEL exporter that adds enrichments
          - Timeline view showing enriched tool calls
          - Expandable details for each span
          - Filter by tool type, status, duration
          - Export to JSON for external analysis
        points: 4
        priority: P2
        status: backlog
        repos: cyclist
        jira: MSSCI-11734
        acceptance_criteria:
          - Custom exporter adds enrichment attributes
          - Timeline visualization in Cyclist UI
          - Expandable span details show all enrichments
          - Filter controls for tool type and status
          - JSON export includes all enriched data
          - Works with existing OTEL collectors (optional forwarding)
