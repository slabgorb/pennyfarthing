# Pennyfarthing Sprint 2
# Goal: Polish sprint operations and establish permissions framework

sprint:
  number: 2
  goal: "Improve developer experience with automated workflows and proper permissions"
  start_date: 2025-12-24
  end_date: 2025-01-07

epics:
  - id: epic-2
    title: "Sprint Operations Polish"
    description: |
      Housekeeping improvements from Sprint 1 retrospective.
      Automates manual workflows and improves developer experience.
    points: 11
    priority: P1
    source: "Sprint 1 Retro"
    repos: pennyfarthing
    jira: https://1898andco.atlassian.net/browse/MSSCI-11142
    stories:
      - id: "2-1"
        title: "Automate Jira sync in SM finish workflow"
        description: |
          Integrate automatic Jira status transition when SM finishes a story.
          Currently requires manual /sync-epic-to-jira invocation.
          - Add Jira transition call to sm-finish-execution.md
          - Use existing jira-lib.sh utilities
          - Handle errors gracefully (Jira down shouldn't block finish)
        points: 3
        priority: P1
        status: done
        started: 2025-12-23
        completed: 2025-12-23
        branch: feat/2-1-jira-sync-finish
        pr: https://github.com/1898andCo/pennyfarthing/pull/9
        jira: https://1898andco.atlassian.net/browse/MSSCI-11143
        repos: pennyfarthing
        acceptance_criteria:
          - SM finish workflow automatically transitions Jira to Done
          - Jira errors are logged but don't block story completion
          - Works with or without Jira configured

      - id: "2-2"
        title: "Create sprint metrics script"
        description: |
          Script to calculate and display sprint metrics:
          - Points burned vs remaining
          - Velocity trends (if historical data exists)
          - Story completion rates
          - Days remaining in sprint
        points: 2
        priority: P2
        status: backlog
        jira: https://1898andco.atlassian.net/browse/MSSCI-11144
        repos: pennyfarthing
        acceptance_criteria:
          - scripts/utils/sprint-metrics.sh displays current sprint stats
          - Shows points completed/remaining/percentage
          - Readable output suitable for status reports

      - id: "2-3"
        title: "Add --auto-pr flag to finish-story flow"
        description: |
          Streamline PR creation by adding optional --auto-pr flag
          that automatically runs gh pr create after review approval.
          - Add flag to sm-finish-execution.md workflow
          - Use existing gh CLI patterns
          - Default to manual (opt-in automation)
        points: 2
        priority: P2
        status: backlog
        jira: https://1898andco.atlassian.net/browse/MSSCI-11145
        repos: pennyfarthing
        acceptance_criteria:
          - --auto-pr flag triggers automatic PR creation
          - PR uses standard template with story context
          - Works for both single-repo and multi-repo stories

      - id: "2-4"
        title: "Prune stale sidecar entries"
        description: |
          Review and clean up agent sidecar files (gotchas, patterns, decisions).
          Keep 5-15 entries per file, archive old entries.
          - Review all 10 agent sidecars
          - Move outdated entries to archive
          - Ensure remaining entries are current and valuable
        points: 1
        priority: P2
        status: done
        started: 2025-12-24
        completed: 2025-12-25
        branch: feat/2-4-prune-stale-sidecars
        pr: https://github.com/1898andCo/pennyfarthing/pull/11
        jira: https://1898andco.atlassian.net/browse/MSSCI-11146
        repos: pennyfarthing
        acceptance_criteria:
          - Each sidecar has 5-15 relevant entries
          - Outdated entries archived to sprint/archive/
          - All remaining entries verified as current
        completion_summary: "Pruned 82% of sidecar content (4,157 → 755 lines). Standardized all 10 agent sidecars to patterns/gotchas/decisions format. Original content archived to sprint/archive/sidecar-archive/."

      - id: "2-5"
        title: "Migrate subagents to official YAML frontmatter format"
        description: |
          Convert all 13 subagents from current markdown-with-embedded-YAML format
          to Claude Code's official YAML frontmatter format.

          Current format:
            # Subagent Name
            ```yaml
            subagent_type: "general-purpose"
            model: "haiku"
            ```

          Official format:
            ---
            name: subagent-name
            description: What it does
            tools: Bash, Read, Glob, Grep
            model: haiku
            ---
            [system prompt]

          Files to convert (13 total):
          - workflow-status-check.md
          - sm-work-research.md, sm-file-summary.md, sm-story-setup.md
          - sm-handoff.md, sm-finish-bookkeeping.md, sm-finish-execution.md
          - tea-handoff.md, dev-handoff.md
          - reviewer-preflight.md, reviewer-handoff-approve.md, reviewer-handoff-reject.md
          - testing-runner.md
        points: 3
        priority: P1
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - All 13 subagents use YAML frontmatter format (--- delimited)
          - Each has name, description, tools, model fields
          - Subagents auto-discovered by Claude Code from .claude/agents/
          - Agent invocation patterns updated if needed
          - Documentation reflects new format

      - id: "2-6"
        title: "Create sidecar templates for dist folder"
        description: |
          Add sidecar template files to pennyfarthing-dist/templates/ so the CLI
          installs lean starter content instead of empty files.

          Currently `pennyfarthing init` creates empty sidecars with just headers:
            # dev patterns

          Should instead install templates with:
            - Standard 3-file structure (patterns.md, gotchas.md, decisions.md)
            - Section headers and placeholder prompts
            - Example format for each entry type

          Files to create:
          - pennyfarthing-dist/templates/sidecar/patterns.md.template
          - pennyfarthing-dist/templates/sidecar/gotchas.md.template
          - pennyfarthing-dist/templates/sidecar/decisions.md.template

          Update CLI:
          - src/cli/commands/init.ts to use templates instead of empty files
        points: 2
        priority: P2
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - Sidecar templates exist in pennyfarthing-dist/templates/sidecar/
          - Templates have section headers and placeholder prompts
          - pennyfarthing init installs templated content
          - Agent name substituted into template headers

  - id: epic-4
    title: "Configuration & Permissions Framework"
    description: |
      Add missing permissions, hooks, and context_budget sections to
      settings.local.json. Implement three-tier permission model
      (read, write, admin) for tool access control.
    points: 8
    priority: P1
    marker: "quick-win"
    repos: pennyfarthing
    jira: https://1898andco.atlassian.net/browse/MSSCI-11147
    stories:
      - id: "4-1"
        title: "Document current permissions in settings.local.json"
        description: |
          Audit and document the current allowlist in settings.local.json.
          Create a permissions reference showing what each entry enables.
          - Catalog all current allowlist entries
          - Document purpose of each permission
          - Identify gaps or overly-broad permissions
        points: 2
        priority: P1
        status: done
        started: 2025-12-24
        completed: 2025-12-24
        branch: feat/4-1-document-permissions
        pr: https://github.com/1898andCo/pennyfarthing/pull/10
        jira: https://1898andco.atlassian.net/browse/MSSCI-11148
        repos: pennyfarthing
        acceptance_criteria:
          - PERMISSIONS.md documents all current permissions
          - Each permission has clear purpose documented
          - Recommendations for tightening if needed

      - id: "4-2"
        title: "Add context_budget configuration"
        description: |
          Implement context budget settings that agents can reference.
          - Add context_budget section to settings template
          - Define thresholds (warning at 70%, critical at 85%)
          - Update check-context.sh to use config values
        points: 2
        priority: P1
        status: backlog
        jira: https://1898andco.atlassian.net/browse/MSSCI-11149
        repos: pennyfarthing
        acceptance_criteria:
          - context_budget settings in settings.local.json template
          - check-context.sh reads from config
          - Configurable warning/critical thresholds

      - id: "4-3"
        title: "Create hooks configuration section"
        description: |
          Document and organize the hooks configuration pattern.
          - Audit existing hooks (session-start, pre-edit-check)
          - Create hooks configuration section in settings
          - Document how to add custom hooks
        points: 2
        priority: P2
        status: backlog
        jira: https://1898andco.atlassian.net/browse/MSSCI-11150
        repos: pennyfarthing
        acceptance_criteria:
          - Hooks section documented in settings template
          - Existing hooks properly configured
          - HOOKS.md guide for custom hook creation

      - id: "4-4"
        title: "Add agent-specific permission scopes"
        description: |
          Define permission scopes per agent type.
          - Strategic agents: broader permissions
          - Tactical agents: focused permissions
          - Helpers (Haiku): minimal permissions
        points: 2
        priority: P2
        status: backlog
        jira: https://1898andco.atlassian.net/browse/MSSCI-11151
        repos: pennyfarthing
        acceptance_criteria:
          - agent-scopes.yaml defines permissions per agent
          - Documentation explains scope differences
          - Template includes agent scope examples

summary:
  total_points: 19
  completed_points: 6
  in_progress_points: 0
  backlog_points: 13
  velocity_target: 20
  status: active

