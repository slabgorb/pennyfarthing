epics:
  - id: epic-31
    title: Customizable Workflow Engine
    description: |
      Infrastructure for user-defined workflows. Replace hardcoded TDD flow
      (SM → TEA → Dev → Reviewer) with configurable YAML-based workflows.
      Users can define custom agent sequences, routing rules, and gates.
    points: 37
    completed_points: 30
    priority: P1
    marker: strategic
    repos: pennyfarthing
    status: in_progress
    jira: MSSCI-11599
    stories:
      - id: 31-15
        title: Background task completion notifications in Cyclist
        description: |
          Add UI notifications when background subagents complete in Cyclist.
          Currently, background tasks run silently - the agent must poll with
          TaskOutput to check results. Users have no visibility into completion.

          Implementation:
          1. Track background task IDs in main process when spawned
          2. Emit IPC event when background task completes
          3. Add notification/toast component to Cyclist UI
          4. Show "Background task X completed" with result summary
          5. Optional: Badge indicator for pending background results

          UI Options:
          - Toast notification (auto-dismiss after N seconds)
          - Badge on Tool Log panel tab
          - Extend Tool Activity Bar with background task section
        points: 3
        priority: P2
        status: backlog
        repos: cyclist
        acceptance_criteria:
          - Cyclist tracks background task IDs from Task tool
          - UI notification appears when background task completes
          - Notification shows task type and success/failure status
          - User can click notification to see full result
          - Works with testing-runner and other background subagents
      - id: 31-17
        title: "Bug: Trivial workflow phase naming inconsistency"
        description: |
          The trivial workflow uses phase names that don't match the agent
          it routes to. Phase is "implement" but agent is "dev". This causes
          confusion in session file tracking and workflow visualization.

          Fix: Rename trivial workflow phases to match agent names, or
          add phase-to-agent mapping in workflow definition.
        points: 1
        priority: P2
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - Trivial workflow phase names match agent names
          - Session file shows correct phase/agent correlation
          - Workflow visualization displays correct agent names
