          carried_from: sprint-2

  sprint_3_summary:
    planned_points: 19
    from_epic_6: 13
    carried_from_sprint_2: 6
    velocity_target: 20
    notes: |
      - Epic 6 is new feature work (theme wizard)
      - Epic 4 stories carried over from Sprint 2 backlog
      - Total fits within velocity target
