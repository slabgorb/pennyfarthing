  - id: epic-26
    title: Dogfooding Audit & Installation Parity
    description: |
      Comprehensive audit ensuring Pennyfarthing's own development setup
      (dogfooding) matches what users get from `pennyfarthing init`. Fix
      symlink permission issues and any other discrepancies between the
      dev experience and user experience.
    points: 5
    completed_points: 5
    priority: P1
    marker: quality
    repos: pennyfarthing
    status: done
    stories:
      - id: 26-1
        title: Dogfooding & Installation Parity Audit
        description: |
          Comprehensive audit of Pennyfarthing installation to ensure:
          1. What we use (dogfooding) matches what users get (pennyfarthing init)
          2. All paths work with Claude Code's permission system
          3. No manual workarounds needed for daily development

          Known issues:
          - Symlink permission problem: Claude Code doesn't follow symlinks
          - .claude/commands symlinks to pennyfarthing-dist/commands
          - Permission grants on symlink paths fail

          Audit scope:
          - Compare .claude/ structure: dogfood vs fresh init
          - Test all agent activations work without permission errors
          - Test all skill invocations work
          - Test all command paths resolve correctly
          - Verify init/update commands produce working setup
          - Document any intentional differences (dev-only features)

          Resolution options:
          1. Replace symlinks with copies during init
          2. Restructure to avoid symlinks entirely
          3. Use pennyfarthing-dist/ paths directly in agent definitions
          4. Hybrid: symlinks for read-only, copies for writable

          Deliverables:
          - Parity checklist document
          - Fix for symlink permission issue
          - Updated init/update commands if needed
          - Test coverage for installation scenarios
        points: 5
        priority: P1
        status: done
        started: 2026-01-11
        completed: 2026-01-11
        assigned_to: Keith Avery
        repos: pennyfarthing
        pr: "#183"
        acceptance_criteria:
          - Audit checklist comparing dogfood vs init setup
          - Permission prompts work for all .claude/ paths
          - All agents activate without permission errors
          - All skills invoke without permission errors
          - Init/update produce identical working setup
          - No manual workarounds needed
          - Differences documented if intentional
