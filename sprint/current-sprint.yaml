          - Permission mode toggle (requires PTY control)
          - Native file dialogs
        points: 2
        priority: P2
        status: done
        started: 2026-01-11
        completed: 2026-01-11
        assigned_to: Keith Avery
        repos: pennyfarthing
        acceptance_criteria:
