          - Works with testing-runner and other background subagents
      - id: 31-16
        title: Enforce handoff subagent spawning for all agents
        description: |
          Bug discovered during 31-14: Agents write assessments to session file
          but skip spawning the generic-handoff subagent. This has happened
          multiple times - both Reviewer and Dev missed handoffs.

          **Problem:** Handoff is documented but not enforced. Agents complete
          their work, write to session, and stop - forgetting the handoff step.

          **Solution:** Make handoff impossible to skip by:

          1. **Modify agent-session.sh stop** to check for handoff:
             - Before stopping, verify session file has handoff entry for current phase
             - If missing, warn and prompt agent to spawn handoff first
             - Or: auto-spawn handoff if assessment section exists

          2. **Add pre-stop gate in each agent .md file:**
             - Checklist item: "Spawned generic-handoff subagent"
             - Make it a MUST before agent-session.sh stop

          3. **Alternative: Combine assessment + handoff:**
             - Single subagent that writes assessment AND does handoff
             - Eliminates the gap where agent forgets step 2

          This affects ALL agents (SM, TEA, Dev, Reviewer), not just Reviewer.
        points: 2
        priority: P1
        status: done
        completed: 2026-01-14
        repos: pennyfarthing
        acceptance_criteria:
          - agent-session.sh stop validates handoff was spawned
          - Clear error message if handoff missing
          - All agent .md files have explicit handoff checklist
          - Cannot complete phase without handoff (enforced, not just documented)
          - Works for approve, reject, and pass-through handoffs
