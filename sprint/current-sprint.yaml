# Pennyfarthing Sprint 1
# Goal: Implement agentic best practices for robust agent coordination

sprint:
  number: 1
  goal: "Complete agentic best practices implementation for production-ready agent workflows"
  start_date: 2025-12-22
  end_date: 2025-01-05

epics:
  - id: epic-1
    title: "Agentic Best Practices Implementation"
    jira: MSSCI-11116
    description: |
      Implement Anthropic's agentic best practices patterns into Pennyfarthing.
      Phase 1 complete (sidecars, permissions, hooks). Remaining: documentation,
      resilience, and optimization.
    points: 23
    priority: P0
    repos: pennyfarthing
    stories:
      - id: "1-1"
        title: "Expand agent command files with workflow context"
        jira: MSSCI-11117
        description: |
          Expand 10 agent command files from 3-line stubs to full workflow
          documentation. Use new-work.md (95 lines) as template. Commands:
          dev.md, tea.md, reviewer.md, sm.md, pm.md, architect.md,
          orchestrator.md, devops.md, tech-writer.md, ux-designer.md
        points: 5
        priority: P1
        status: done
        started: 2025-12-22
        completed: 2025-12-22
        repos: pennyfarthing
        acceptance_criteria:
          - Each command file has workflow context similar to new-work.md
          - Files include activation steps, responsibilities, handoff patterns
          - Consistent structure across all 10 files

      - id: "1-2"
        title: "Complete strategic agent behavior guide"
        jira: MSSCI-11118
        description: |
          Expand .claude/guides/strategic-agent-behavior.md with:
          - PM to Architect coordination patterns
          - Approval gates and escalation rules
          - Sprint planning workflows
          - Cross-agent communication protocols
        points: 3
        priority: P1
        status: done
        started: 2025-12-22
        completed: 2025-12-22
        repos: pennyfarthing
        acceptance_criteria:
          - PM/Architect coordination documented
          - Clear approval gates defined
          - Sprint planning workflow documented

      - id: "1-3"
        title: "Add resilience utilities (retry, checkpointing)"
        jira: MSSCI-11119
        description: |
          Create resilience infrastructure:
          - scripts/utils/retry.sh with exponential backoff
          - Checkpoint mechanism in .session/checkpoints.log
          - Context usage warnings at >70% capacity
        points: 5
        priority: P1
        status: done
        started: 2025-12-22
        completed: 2025-12-22
        repos: pennyfarthing
        acceptance_criteria:
          - retry.sh script works with configurable attempts
          - Checkpointing saves/restores session state
          - Context warning mechanism implemented

      - id: "1-4a"
        title: "Split workflow-status-check.md subagent"
        jira: MSSCI-11120
        description: |
          Extract repo scanning utilities from workflow-status-check.md (255 lines)
          into reusable scripts. This subagent is used by all tactical agents.
        points: 2
        priority: P2
        status: done
        started: 2025-12-22
        completed: 2025-12-22
        repos: pennyfarthing
        acceptance_criteria:
          - Repo scanning logic extracted to scripts/utils/repo-scan.sh
          - workflow-status-check.md reduced to <200 lines
          - All agents still function correctly after refactor

      - id: "1-4b"
        title: "Split testing-runner.md subagent"
        jira: MSSCI-11125
        description: |
          Extract test container setup from testing-runner.md (361 lines)
          into reusable utilities. Focus on DRY and maintainability.
        points: 2
        priority: P2
        status: in-progress
        started: 2025-12-23
        repos: pennyfarthing
        acceptance_criteria:
          - Test container setup extracted to scripts/utils/test-setup.sh
          - testing-runner.md reduced to <250 lines
          - Test workflows still function correctly

      - id: "1-4c"
        title: "Add structured logging utility"
        jira: MSSCI-11126
        description: |
          Create scripts/utils/logging.sh with structured JSON logging
          for session tracking and debugging agent workflows.
        points: 2
        priority: P2
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - logging.sh provides log_info, log_warn, log_error functions
          - JSON output format with timestamp, level, agent, message
          - Integrates with existing session file workflow

      - id: "1-4d"
        title: "Add session file locking"
        jira: MSSCI-11127
        description: |
          Add file locking mechanism to prevent concurrent session conflicts
          when multiple agents or terminals access .session files.
        points: 2
        priority: P2
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - Lock mechanism prevents concurrent writes to session files
          - Graceful handling when lock cannot be acquired
          - Lock timeout and cleanup on stale locks

      - id: "1-5"
        title: "Add guardrail to ensure epic tech context exists before /new-work"
        jira: MSSCI-11121
        description: |
          Create a guardrail that validates epic technical context has been
          generated (via /start-epic) before allowing /new-work to proceed.
          This prevents starting work without proper technical analysis.
          - Check for .session/epic-{N}-context.md before story selection
          - Prompt user to run /start-epic if context missing
          - Add validation to workflow-status-check subagent
        points: 2
        priority: P1
        status: done
        started: 2025-12-22
        completed: 2025-12-22
        repos: pennyfarthing
        acceptance_criteria:
          - /new-work checks for epic context file before proceeding
          - Clear error message directs user to run /start-epic
          - Guardrail integrated into workflow-status-check subagent

summary:
  total_points: 23
  completed_points: 17
  in_progress_points: 0
  backlog_points: 6
  velocity_target: 25
