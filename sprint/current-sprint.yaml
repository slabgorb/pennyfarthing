    title: Wire Up Orphaned Code
    description: |
      Integrate existing but orphaned modules that were written for previous
      stories but never connected to the main application. These modules have
      tests and are feature-complete, just need wiring into the message handler
      and UI components. Discovered during dead code audit.
    points: 8
    completed_points: 0
