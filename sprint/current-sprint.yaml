      Rather than replacing our TEA (who writes tests), extend our quality
      gates with test quality scoring, risk-based prioritization, coverage
      traceability, NFR assessment, and release gate decisions.

      Design Decision: Extend Reviewer rather than create new agent.
      Rationale: Reviewer already has adversarial mindset, issue categorization,
      and gate decisions. Adding test review is natural extension.

      Inspired by BMAD 6.0 gap analysis - their TEA (Murat) is a Quality
      Architect providing oversight, not a Test Engineer writing tests.
