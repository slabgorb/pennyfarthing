      - id: 38-13
        title: Auto-mode context clear and agent reload on handoff
        description: |
          In auto mode, when context usage is too high (>60%) at handoff time,
          the agent currently tells the user to "start fresh with /agent".
          This breaks the automated flow.

          Implement automated context clearing:
          1. Agent detects high context on handoff (existing check)
          2. Agent emits a CYCLIST:CONTEXT_CLEAR marker or IPC signal
          3. Cyclist intercepts this signal
          4. Cyclist clears the Claude Code session (/clear or restart)
          5. Cyclist automatically loads the next agent (e.g., /tea, /dev)
          6. Work continues seamlessly in auto mode

          This requires coordination between:
          - Agent handoff logic (emit signal with next agent info)
          - Cyclist main process (intercept signal, execute clear)
          - Cyclist session management (reload agent after clear)

          The marker format could be:
          ```
          <!-- CYCLIST:CONTEXT_CLEAR:NEXT_AGENT:/tea -->
          ```

          Or an IPC event from the agent output parser.

          Files affected:
          - pennyfarthing-dist/agents/*.md (handoff logic updates)
          - packages/cyclist/src/public/js/output-parser.js (detect marker)
          - packages/cyclist/src/main/ipc/ (new handler for context clear)
          - packages/cyclist/src/main/terminal.ts (execute clear + reload)
        points: 5
        priority: P1
        status: backlog
        repos: pennyfarthing, cyclist
        workflow: tdd
