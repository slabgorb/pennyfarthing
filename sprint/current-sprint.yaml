  - id: epic-26
    title: Symlink Permission Fix for Claude Code
    description: |
      Claude Code's permission system doesn't follow symlinks. When
      .claude/commands symlinks to pennyfarthing-dist/commands, granting
      permission on the symlink path fails. Need to either restructure
      or work around this limitation.
    points: 2
    completed_points: 0
    priority: P1
    marker: bug
    repos: pennyfarthing
    status: in_progress
    stories:
      - id: 26-1
        title: Fix symlink permission issue for .claude directory
        description: |
          Problem: Claude Code permission prompts use symlink paths like
          .claude/commands/close-epic.md but permission grants don't resolve
          through symlinks. User can't grant permission.

          Options to explore:
          1. Replace symlinks with copies during init
          2. Use pennyfarthing-dist/ paths in permission prompts
          3. Add .claude/commands to .claudeignore and use direct paths
          4. Restructure to avoid symlinks for editable content

          Current workaround: Write to pennyfarthing-dist/ directly
        points: 2
        priority: P1
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - Permission prompts work for all .claude/ paths
          - Init/update commands handle the fix
          - No manual workarounds needed
