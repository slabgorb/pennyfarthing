        Research basis: HELM uses reference implementations for
        calibration; MLPerf provides gold standards for comparison.
      points: 8
      priority: P2
      marker: "benchmark"
      repos: pennyfarthing
      status: backlog
      stories:
        - id: "45-1"
          title: "Add gold_standard schema to scenarios"
          description: |
            New scenario field:
            ```yaml
            gold_standard:
              exemplar_response: |
                [Human-curated ideal response]
              edge_case_guidance:
                - situation: "Agent mentions deprecated API"
                  ruling: "Acceptable if notes deprecation status"
            ```
          points: 2
          priority: P0
          status: backlog
          repos: pennyfarthing
        - id: "45-2"
          title: "Update judge to use gold standard as calibration"
          description: |
            When gold_standard is present, judge prompt includes:
            "Reference the exemplar response for calibration.
            A response matching this quality = 90+ score."
          points: 2
          priority: P0
          status: backlog
          repos: pennyfarthing
        - id: "45-3"
          title: "Create gold standards for 5 high-variance scenarios"
          description: |
            Write exemplar responses for scenarios with highest
            historical variance. Prioritize TEA scenarios where
            CV was 25-65%.
          points: 3
          priority: P1
          status: backlog
          repos: pennyfarthing
        - id: "45-4"
          title: "Variance comparison: with/without gold standard"
          description: |
            A/B test: run same scenarios with and without gold standard.
            Measure variance reduction. Target: 50% CV decrease.
          points: 1
          priority: P1
          status: backlog
          repos: pennyfarthing

