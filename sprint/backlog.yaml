        Add circuit breaker pattern to prevent runaway context usage.
      points: 13
      priority: P1
      marker: "high-priority"
      repos: pennyfarthing
      status: complete
      notes: |
        All stories completed across Sprints 3, 6, and 7.
        - 3-1: Context usage tracking (done Sprint 3)
        - 3-2: 70% threshold warning (done Sprint 3)
        - 3-3: 85% circuit breaker (done Sprint 6)
        - 3-4: Session continuation workflow (done Sprint 6)
        - 3-5: Context in statusline (done Sprint 7)

    - id: epic-7
