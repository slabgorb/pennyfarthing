    - id: epic-25
      title: "Smart Question Detection & Quick Actions"
      description: |
        Improve Cyclist's ability to detect when Claude is asking questions
        or prompting for action. Reduce false positives (enumerations mistaken
        for questions), catch handoff prompts, and add "yes, proceed" buttons.
        Two-pronged approach: better parsing AND easier-to-parse Claude output.
      points: 18
      priority: P1
      marker: "ux"
      repos: cyclist, pennyfarthing
      status: planned
      stories:
        - id: "25-1"
          title: "Audit Current Quick Actions Detection"
          description: |
            Review and document current detection patterns in quick-actions.js.
            Identify false positive patterns (enumerations, lists that aren't choices).
            Catalog missed patterns (handoffs, confirmations, proceed prompts).
          points: 2
          priority: P1
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Document all current detection patterns
            - List of false positive examples
            - List of missed pattern examples
            - Recommendations for fixes

        - id: "25-2"
          title: "Fix Enumeration False Positives"
          description: |
            Stop detecting numbered lists as choices when they're just enumerations.
            Heuristics:
            - Check if list items are actionable (verbs vs nouns)
            - Check for question context before list
            - Check list length (>5 items likely enumeration)
            - Check for "here are" / "the following" prefixes
          points: 3
          priority: P1
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Numbered lists without question context ignored
            - "Here are the files" type lists not shown as choices
            - Long lists (>5) treated as enumeration by default
            - Reduces false positive rate significantly

        - id: "25-3"
          title: "Detect Handoff & Action Prompts"
          description: |
            Detect agent handoff and action prompts like:
            - "invoke /reviewer to continue"
            - "run /dev to implement"
            - "use /sm to finish"
            - "shall I proceed with..."
            - "ready for review"
            Show appropriate action button for each.
          points: 3
          priority: P1
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Detects "invoke X" patterns
            - Detects "ready for X" patterns
            - Shows button to invoke the suggested command
            - Works for all Pennyfarthing agents

        - id: "25-4"
          title: "Universal 'Yes, Proceed' Button"
          description: |
            Add smart "Yes, proceed" detection for general confirmations:
            - "shall I..." / "should I..."
            - "would you like me to..."
            - "do you want me to..."
            - "ready to..." / "proceed with..."
            Always show "Yes" and "No" buttons for these.
          points: 2
          priority: P1
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Detects confirmation question patterns
            - Shows Yes/No buttons
            - "Yes" sends affirmative response
            - Works even without numbered options

        - id: "25-5"
          title: "Structured Output Markers (Claude-side)"
          description: |
            Add optional markers in Pennyfarthing agent output to make
            parsing easier. Agents can emit structured hints:
            - <!-- QUESTION: yes/no --> for confirmations
            - <!-- CHOICES: 1,2,3 --> for numbered choices
            - <!-- HANDOFF: /reviewer --> for handoffs
            Cyclist detects these for guaranteed accurate parsing.
          points: 3
          priority: P2
          status: backlog
          repos: pennyfarthing, cyclist
          acceptance_criteria:
            - Marker format defined and documented
            - Key agents emit markers for questions
            - Cyclist parses markers with 100% accuracy
            - Markers hidden from user display

        - id: "25-6"
          title: "Confidence Scoring for Detection"
          description: |
            Add confidence scores to quick action detection:
            - High confidence: show buttons prominently
            - Medium confidence: show buttons subtly
            - Low confidence: don't show buttons
            Tunable thresholds in settings.
          points: 2
          priority: P2
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Detection returns confidence score
            - UI varies by confidence level
            - Threshold configurable in settings
            - Reduces noise from uncertain detections

        - id: "25-7"
          title: "Quick Action Analytics"
          description: |
            Track quick action usage to improve detection:
            - Log when buttons shown vs clicked
            - Track false positive dismissals
            - Identify patterns that need tuning
            Report in diagnostics panel.
          points: 3
          priority: P3
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Usage logged to session
            - False positive tracking
            - Analytics viewable in diagnostics
            - Data informs future improvements

    - id: epic-26
      title: "Image Paste & Screenshot Support"
      description: |
        Enable users to share images with Claude through Cyclist via clipboard
        paste. Supports pasting screenshots (Cmd+Shift+4, etc.), copied images,
        and files copied from Finder/Explorer. Images are properly encoded for
        Claude's multimodal vision capabilities.
      points: 14
      priority: P2
      marker: "strategic"
      repos: cyclist
      status: planned
      stories:
        - id: "26-1"
          title: "Clipboard image paste"
          description: |
            Cmd+V pastes images from clipboard into input area.
            - Screenshots from OS tools (Cmd+Shift+4, Snipping Tool)
            - Images copied from browsers or other apps
            - Detect image data in clipboard on paste event
            - Show visual feedback when image detected
          points: 3
          priority: P1
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Cmd+V pastes clipboard images
            - Works with OS screenshot tools
            - Works with images copied from browser
            - Visual feedback on successful paste

        - id: "26-2"
          title: "Clipboard file paste"
          description: |
            Cmd+V pastes image files copied from Finder/Explorer.
            - Detect file references in clipboard
            - Read file contents and convert to image data
            - Support common formats: PNG, JPG, GIF, WebP
          points: 2
          priority: P1
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Paste files copied from Finder/Explorer
            - Supports PNG, JPG, GIF, WebP
            - Graceful error for unsupported formats

        - id: "26-3"
          title: "Image preview before send"
          description: |
            Show thumbnail preview of attached images before sending.
            - Thumbnail appears above/beside input field
            - Click X to remove image
            - Shows filename or "Screenshot" label
            - Preview scales to reasonable size
          points: 2
          priority: P1
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Thumbnail preview displayed
            - Remove button (X) works
            - Appropriate label shown
            - Preview doesn't obstruct input

        - id: "26-4"
          title: "Base64 encoding for Claude API"
          description: |
            Properly encode images for Claude's vision API.
            - Convert image to base64 data URL
            - Include correct MIME type
            - Inject into Claude Code message format
            - Handle PTY integration for image data
          points: 3
          priority: P1
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Images encoded as base64 with MIME type
            - Claude receives and processes image
            - Image appears in conversation context
            - Works in both Electron and web modes

        - id: "26-5"
          title: "Image size validation & resize"
          description: |
            Validate image size and optionally resize large images.
            - Warn if image exceeds recommended size (5MB)
            - Block if image exceeds max size (20MB)
            - Option to auto-resize large images
            - Show file size in preview
          points: 2
          priority: P2
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Warning for images > 5MB
            - Block images > 20MB with clear message
            - Optional auto-resize to fit limits
            - File size shown in preview tooltip

        - id: "26-6"
          title: "Multiple image support"
          description: |
            Allow attaching multiple images to a single message.
            - Paste additional images to add to queue
            - Show all thumbnails in preview area
            - Remove individual images
            - Clear all button
          points: 2
          priority: P2
          status: backlog
          repos: cyclist
          acceptance_criteria:
            - Multiple images can be attached
            - All thumbnails visible
            - Individual remove works
            - Clear all option available

