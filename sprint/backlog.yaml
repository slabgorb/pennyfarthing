    - id: epic-8
      title: "Automatic State Reconciliation"
      description: |
        Eliminate drift between git state and sprint YAML by automating
        state synchronization. Work happens across multiple sessions and
        PRs get merged outside the workflow - the framework should detect
        and reconcile this automatically, not rely on users running commands.
      points: 8
      priority: P1
      marker: "high-priority"
      repos: pennyfarthing
      stories:
        - id: "8-1"
          title: "Git hook for PR merge detection"
          description: |
            Post-merge hook that detects when PRs merge to develop/main.
            - Parse PR title/branch for story ID (e.g., feat/5-2-*)
            - Auto-update sprint YAML status to 'done'
            - Add completed date
            - Works even when merge happens outside workflow
          points: 3
          priority: P1
          repos: pennyfarthing
          acceptance_criteria:
            - Hook installed via pennyfarthing setup
            - Detects story ID from branch name pattern
            - Updates sprint YAML automatically
            - Logs reconciliation to .session/

        - id: "8-2"
          title: "Startup drift detection"
          description: |
            On agent activation, detect drift between git and YAML state.
            - Compare merged PRs vs sprint YAML status
            - Identify stories marked in-progress but already merged
            - Auto-fix or warn user before proceeding
          points: 3
          priority: P1
          repos: pennyfarthing
          acceptance_criteria:
            - workflow-status-check detects merged-but-not-closed
            - Clear report of drifted stories
            - Option to auto-reconcile

        - id: "8-3"
          title: "Session boundary breadcrumbs"
          description: |
            Better markers for cross-session continuity.
            - Write checkpoint on session end
            - Include last agent, story, phase, git SHA
            - Next session loads and validates checkpoint
          points: 2
          priority: P2
          repos: pennyfarthing
          acceptance_criteria:
            - .session/checkpoint.yaml written on exit
            - New session validates against current git state
            - Warns if state changed between sessions

    - id: epic-20
      title: "Cyclist Web Mode Improvements"
      description: |
        Improve Cyclist web mode UX to match Electron mode capabilities.
        Currently, web mode requires manual OTEL configuration to get
        token stats, and some features only work in Electron.
      points: 8
      priority: P2
      marker: "quick-win"
      repos: cyclist
      stories:
        - id: "20-1"
          title: "Auto-configure OTEL for web mode"
          description: |
            Make token stats work automatically in web mode without
            requiring manual OTEL environment variables.

            Options to explore:
            - Port file: Cyclist writes port to .cyclist-port, hooks read it
            - Browser launch: Cyclist spawns Claude Code subprocess like Electron
            - Documentation: Clear setup instructions in UI when stats unavailable

            Current workaround: `just claude-with-cyclist` launcher script
          points: 3
          priority: P1
          repos: cyclist
          acceptance_criteria:
            - Token stats appear in web mode without manual OTEL config
            - Clear error message if OTEL not configured
            - Documentation for manual setup as fallback

        - id: "20-2"
          title: "Web mode feature parity audit"
          description: |
            Audit all Electron-only features and create plan to support
            them in web mode or document limitations.

            Known gaps:
            - Agent menu (Electron menu bar)
            - Permission mode toggle (requires PTY control)
            - Native file dialogs
          points: 2
          priority: P2
          repos: cyclist
          acceptance_criteria:
            - Feature parity matrix documented
            - Web alternatives identified for key features
            - Limitations clearly documented

        - id: "20-3"
          title: "Cyclist launcher with integrated Claude Code"
          description: |
            Create a launcher mode where Cyclist web spawns Claude Code
            as a subprocess (like Electron mode), giving full control
            over OTEL config and permission modes.

            Would enable web mode to have same capabilities as Electron.
          points: 3
          priority: P2
          repos: cyclist
          acceptance_criteria:
            - Web server can spawn Claude Code subprocess
            - OTEL automatically configured
            - WebSocket bridges subprocess I/O to browser

