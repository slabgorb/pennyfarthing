[project]
name = "pennyfarthing-scripts"
version = "8.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "ruamel.yaml>=0.18", "httpx>=0.28", "click>=8.0", "pydriller>=2.6"]

[project.optional-dependencies]
tui = ["textual>=1.0", "websockets>=12.0", "textual-image>=0.7.0"]

[project.scripts]
pf = "pf.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pf*"]
