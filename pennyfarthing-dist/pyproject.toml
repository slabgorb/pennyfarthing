[project]
name = "pennyfarthing-scripts"
dynamic = ["version"]
# Floor is 3.11.4, not 3.11.0: portrait_cdn extracts with tarfile's
# `filter="data"` (CWE-22 guard), which only landed in 3.12 / 3.11.4. On
# 3.11.0-3.11.3 it raises TypeError (not TarError), escaping the handler and
# silently skipping extraction. See story 154-2 (finding C5).
requires-python = ">=3.11.4"
dependencies = ["pyyaml>=6.0", "ruamel.yaml>=0.18", "httpx>=0.28", "click>=8.0", "pydriller>=2.6", "textual>=1.0", "websockets>=12.0", "textual-image>=0.7.0,<0.13", "watchfiles>=1.0", "fastapi>=0.115", "uvicorn[standard]>=0.34"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-mock>=3.14", "pytest-asyncio>=1.0", "build>=1.0", "httpx>=0.28"]

[project.scripts]
pf = "pf_launcher:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pf_launcher"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pf*"]
exclude = ["pf.tests", "pf.tests.*"]

[tool.setuptools.package-data]
"pf._dist" = [
    "agents/**/*",
    "commands/**/*",
    "gates/**/*",
    "guides/**/*",
    "output-styles/**/*",
    # NOTE: portraits are intentionally NOT bundled — they ship via the R2 CDN
    # (pf.package.portrait_cdn) + git-LFS. See MANIFEST.in recursive-exclude.
    "personas/themes/**/*",
    "personas/attributes.yaml",
    "personas/*.md",
    "personas/*.yaml",
    "scripts/**/*",
    "skills/**/*",
    "templates/**/*",
    "workflows/**/*",
    "schemas/**/*",
    "server/**/*",
]

[tool.setuptools.exclude-package-data]
"pf._dist" = [
    "**/__pycache__/**",
    "personas/portraits/*",
    "personas/portraits/**/*",
]

[tool.setuptools.dynamic]
version = {attr = "pf.__version__"}
