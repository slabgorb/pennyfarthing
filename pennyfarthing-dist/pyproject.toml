[project]
name = "pennyfarthing-scripts"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "ruamel.yaml>=0.18", "httpx>=0.28", "click>=8.0", "pydriller>=2.6", "textual>=1.0", "websockets>=12.0", "textual-image>=0.7.0,<0.13", "watchfiles>=1.0", "fastapi>=0.115", "uvicorn[standard]>=0.34"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-mock>=3.14", "pytest-asyncio>=1.0", "build>=1.0", "httpx>=0.28"]

[project.scripts]
pf = "pf_launcher:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pf_launcher"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pf*"]
exclude = ["pf.tests", "pf.tests.*"]

[tool.setuptools.package-data]
"pf._dist" = [
    "agents/**/*",
    "commands/**/*",
    "gates/**/*",
    "guides/**/*",
    "output-styles/**/*",
    "personas/portraits/**/*",
    "personas/themes/**/*",
    "personas/attributes.yaml",
    "personas/*.md",
    "personas/*.yaml",
    "scripts/**/*",
    "skills/**/*",
    "templates/**/*",
    "workflows/**/*",
    "schemas/**/*",
    "server/**/*",
]

[tool.setuptools.exclude-package-data]
"pf._dist" = [
    "**/__pycache__/**",
]

[tool.setuptools.dynamic]
version = {attr = "pf.__version__"}
