  <!-- Right Eyebrow -->
  <line x1="119.25" y1="77.07166618243677"
        x2="135.75" y2="71.42833381756323"
    stroke="black" stroke-width="3.375" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 84.5 115.75 Q 100 123.75 115.5 115.75"
