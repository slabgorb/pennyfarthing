<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#D5E8D5" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="35" ry="60"
    fill="none" stroke="black" stroke-width="2.125" />

  <!-- Left Eye -->
  <circle cx="82.5" cy="91" r="13"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="82.5" cy="91" r="6"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="117.5" cy="91" r="13"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="117.5" cy="91" r="6"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="72.75" y1="70"
        x2="92.25" y2="70"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="107.75" y1="70"
        x2="127.25" y2="70"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 84.5 121 Q 100 129 115.5 121"
    fill="none" stroke="black" stroke-width="2.125" stroke-linecap="round" />
</svg>