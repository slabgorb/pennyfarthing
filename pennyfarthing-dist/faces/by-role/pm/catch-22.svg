    stroke="black" stroke-width="3.375" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="114.25" y1="71.69240253424782"
        x2="130.75" y2="74.55759746575218"
    stroke="black" stroke-width="3.375" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 94 118.375 Q 100 113.375 106 118.375"
