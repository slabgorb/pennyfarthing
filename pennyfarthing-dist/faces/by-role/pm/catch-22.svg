<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8DDD5" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="45" ry="52.5"
    fill="none" stroke="black" stroke-width="3.375" />

  <!-- Left Eye -->
  <circle cx="77.5" cy="92.125" r="11"
    fill="none" stroke="black" stroke-width="3.375" />
  <circle cx="77.5" cy="92.125" r="4"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="122.5" cy="92.125" r="11"
