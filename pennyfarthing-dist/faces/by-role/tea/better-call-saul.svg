<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#D5E0E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="35" ry="60"
    fill="none" stroke="black" stroke-width="3.375" />

  <!-- Left Eye -->
  <circle cx="82.5" cy="91" r="11"
    fill="none" stroke="black" stroke-width="3.375" />
  <circle cx="82.5" cy="91" r="4"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="117.5" cy="91" r="11"
    fill="none" stroke="black" stroke-width="3.375" />
  <circle cx="117.5" cy="91" r="4"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="74.25" y1="69.17833381756323"
        x2="90.75" y2="74.82166618243677"
    stroke="black" stroke-width="3.375" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="109.25" y1="74.82166618243677"
        x2="125.75" y2="69.17833381756323"
    stroke="black" stroke-width="3.375" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 89 121 Q 100 122 111 121"
    fill="none" stroke="black" stroke-width="3.375" stroke-linecap="round" />
</svg>