<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#DDE8D5" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="35" ry="60"
    fill="none" stroke="black" stroke-width="2.125" />

  <!-- Left Eye -->
  <circle cx="82.5" cy="91" r="8"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="82.5" cy="91" r="3"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="117.5" cy="91" r="8"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="117.5" cy="91" r="3"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="76.5" y1="72.94787914004598"
        x2="88.5" y2="77.05212085995402"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="111.5" y1="77.05212085995402"
        x2="123.5" y2="72.94787914004598"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 89 121 Q 100 122 111 121"
    fill="none" stroke="black" stroke-width="2.125" stroke-linecap="round" />
</svg>