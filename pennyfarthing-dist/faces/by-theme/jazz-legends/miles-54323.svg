<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8E8D5" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="45" ry="52.5"
    fill="none" stroke="black" stroke-width="4" />

  <!-- Left Eye -->
  <circle cx="77.5" cy="92.125" r="18"
    fill="none" stroke="black" stroke-width="4" />
  <circle cx="77.5" cy="92.125" r="8"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="122.5" cy="92.125" r="18"
    fill="none" stroke="black" stroke-width="4" />
  <circle cx="122.5" cy="92.125" r="8"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="64" y1="66.125"
        x2="91" y2="66.125"
    stroke="black" stroke-width="4" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="109" y1="66.125"
        x2="136" y2="66.125"
    stroke="black" stroke-width="4" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 79.5 118.375 Q 100 132.375 120.5 118.375"
    fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />
</svg>