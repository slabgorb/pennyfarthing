<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8D8E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="50" ry="49"
    fill="none" stroke="black" stroke-width="2.75" />

  <!-- Left Eye -->
  <circle cx="75" cy="92.65" r="16"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="75" cy="92.65" r="7"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="125" cy="92.65" r="16"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="125" cy="92.65" r="7"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="63" y1="70.73377813200317"
        x2="87" y2="66.56622186799684"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="113" y1="66.56622186799684"
        x2="137" y2="70.73377813200317"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 75 117.15 Q 100 137.15 125 117.15"
    fill="none" stroke="black" stroke-width="2.75" stroke-linecap="round" />
</svg>