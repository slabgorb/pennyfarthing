<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8DDD5" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="55" ry="45"
    fill="none" stroke="black" stroke-width="2.75" />

  <!-- Left Eye -->
  <circle cx="72.5" cy="93.25" r="16"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="72.5" cy="93.25" r="7"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="127.5" cy="93.25" r="16"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="127.5" cy="93.25" r="7"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="60.5" y1="73.35424171990803"
        x2="84.5" y2="65.14575828009197"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="115.5" y1="65.14575828009197"
        x2="139.5" y2="73.35424171990803"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 75 115.75 Q 100 135.75 125 115.75"
    fill="none" stroke="black" stroke-width="2.75" stroke-linecap="round" />
</svg>