<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8D5E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="45" ry="52.5"
    fill="none" stroke="black" stroke-width="2.125" />

  <!-- Left Eye -->
  <circle cx="77.5" cy="92.125" r="16"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="77.5" cy="92.125" r="7"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="122.5" cy="92.125" r="16"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="122.5" cy="92.125" r="7"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="65.5" y1="68.125"
        x2="89.5" y2="68.125"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="110.5" y1="68.125"
        x2="134.5" y2="68.125"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 89 118.375 Q 100 119.375 111 118.375"
    fill="none" stroke="black" stroke-width="2.125" stroke-linecap="round" />
</svg>