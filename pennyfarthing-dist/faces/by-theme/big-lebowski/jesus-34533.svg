<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#D5E0E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="40" ry="56.5"
    fill="none" stroke="black" stroke-width="2.75" />

  <!-- Left Eye -->
  <circle cx="80" cy="91.525" r="13"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="80" cy="91.525" r="6"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="120" cy="91.525" r="13"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="120" cy="91.525" r="6"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="70.25" y1="70.525"
        x2="89.75" y2="70.525"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="110.25" y1="70.525"
        x2="129.75" y2="70.525"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 75 119.775 Q 100 139.775 125 119.775"
    fill="none" stroke="black" stroke-width="2.75" stroke-linecap="round" />
</svg>