<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#D5E0E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="55" ry="45"
    fill="none" stroke="black" stroke-width="2.125" />

  <!-- Left Eye -->
  <circle cx="72.5" cy="93.25" r="18"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="72.5" cy="93.25" r="8"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="127.5" cy="93.25" r="18"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="127.5" cy="93.25" r="8"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="59" y1="69.59425039850356"
        x2="86" y2="64.90574960149644"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="114" y1="64.90574960149644"
        x2="141" y2="69.59425039850356"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 75 115.75 Q 100 135.75 125 115.75"
    fill="none" stroke="black" stroke-width="2.125" stroke-linecap="round" />
</svg>