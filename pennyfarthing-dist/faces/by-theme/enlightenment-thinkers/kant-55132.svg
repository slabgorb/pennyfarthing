<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8D5D5" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="35" ry="60"
    fill="none" stroke="black" stroke-width="2.125" />

  <!-- Left Eye -->
  <circle cx="82.5" cy="91" r="18"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="82.5" cy="91" r="8"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="117.5" cy="91" r="18"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="117.5" cy="91" r="8"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="69" y1="65"
        x2="96" y2="65"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="104" y1="65"
        x2="131" y2="65"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 94 121 Q 100 116 106 121"
    fill="none" stroke="black" stroke-width="2.125" stroke-linecap="round" />
</svg>