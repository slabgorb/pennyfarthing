    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="107.75" y1="68.30693026774743"
        x2="127.25" y2="71.69306973225257"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 79.5 121 Q 100 135 120.5 121"
    fill="none" stroke="black" stroke-width="2.75" stroke-linecap="round" />
