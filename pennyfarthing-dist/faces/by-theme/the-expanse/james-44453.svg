<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#D5E8E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="35" ry="60"
    fill="none" stroke="black" stroke-width="2.75" />

  <!-- Left Eye -->
  <circle cx="82.5" cy="91" r="13"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="82.5" cy="91" r="6"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="117.5" cy="91" r="13"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="117.5" cy="91" r="6"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="72.75" y1="71.69306973225257"
