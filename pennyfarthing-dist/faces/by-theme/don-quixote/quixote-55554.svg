<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8D5E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="35" ry="60"
    fill="none" stroke="black" stroke-width="3.375" />

  <!-- Left Eye -->
  <circle cx="82.5" cy="91" r="18"
    fill="none" stroke="black" stroke-width="3.375" />
  <circle cx="82.5" cy="91" r="8"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="117.5" cy="91" r="18"
    fill="none" stroke="black" stroke-width="3.375" />
  <circle cx="117.5" cy="91" r="8"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="69" y1="69.61727193489652"
        x2="96" y2="60.38272806510347"
    stroke="black" stroke-width="3.375" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="104" y1="60.38272806510347"
        x2="131" y2="69.61727193489652"
    stroke="black" stroke-width="3.375" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 75 121 Q 100 141 125 121"
    fill="none" stroke="black" stroke-width="3.375" stroke-linecap="round" />
</svg>