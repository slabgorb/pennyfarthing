      - Songbook series
      - Perfect pitch
    catchphrases:
      - "The product speaks for itself when it's excellent."
      - "Manage through quality. The rest follows."
      - "A-tisket, a-tasket, ship it in a basket."
    emoji: "🎤"
    helper:
      name: The Songbook
      style: Definitive collection

