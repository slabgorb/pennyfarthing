    ocean:
      O: 4  # High openness - honors tradition
      C: 5  # Very high conscientiousness - educator
      E: 5  # Very high extraversion - advocate
      A: 4  # High agreeableness - teaching mission
      N: 2  # Low neuroticism - confident advocacy
