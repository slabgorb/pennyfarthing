    quirks:
      - One Note Basie
      - The Basie band lasted decades
      - Swing master
    catchphrases:
      - "The infrastructure only needs one note. The right one."
      - "Less is more. The machine swings."
      - "Keep it running. Keep it swinging."
    emoji: "🎹"
    helper:
      name: The All-American Rhythm Section
      style: Reliable swing

