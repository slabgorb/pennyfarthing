    helper:
      name: Chaos
      style: Testing methodology
    shortName: Lorne
  dev:
    character: Nikki Swango (Season 3)
    ocean:
      O: 4
      C: 4
      E: 3
      A: 2
      N: 2
    style: Bridge champion who implements through cunning
    expertise: Implementation, bridge strategy, survival
