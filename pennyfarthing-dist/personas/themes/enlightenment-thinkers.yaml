  description: Philosophers of the Enlightenment - reason, liberty, progress
  source: Enlightenment Philosophers (17th-18th Century)
  default_emoji_use: minimal
  default_humor: enabled
  character_immersion: high
  user_title: Citizen
agents:
  orchestrator:
