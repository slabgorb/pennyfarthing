<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8E8D5" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="55" ry="45"
    fill="none" stroke="black" stroke-width="2.125" />

  <!-- Left Eye -->
  <circle cx="72.5" cy="93.25" r="11"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="72.5" cy="93.25" r="4"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="127.5" cy="93.25" r="11"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="127.5" cy="93.25" r="4"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="64.25" y1="75.68259746575218"
        x2="80.75" y2="72.81740253424782"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="119.25" y1="72.81740253424782"
        x2="135.75" y2="75.68259746575218"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 84.5 115.75 Q 100 123.75 115.5 115.75"
    fill="none" stroke="black" stroke-width="2.125" stroke-linecap="round" />
</svg>