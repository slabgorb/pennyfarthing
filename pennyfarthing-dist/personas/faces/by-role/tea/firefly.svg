<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#D5E0E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="50" ry="49"
    fill="none" stroke="black" stroke-width="4" />

  <!-- Left Eye -->
  <circle cx="75" cy="92.65" r="18"
    fill="none" stroke="black" stroke-width="4" />
  <circle cx="75" cy="92.65" r="8"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="125" cy="92.65" r="18"
    fill="none" stroke="black" stroke-width="4" />
  <circle cx="125" cy="92.65" r="8"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="61.5" y1="66.65"
        x2="88.5" y2="66.65"
    stroke="black" stroke-width="4" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="111.5" y1="66.65"
        x2="138.5" y2="66.65"
    stroke="black" stroke-width="4" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 89 117.15 Q 100 118.15 111 117.15"
    fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />
</svg>