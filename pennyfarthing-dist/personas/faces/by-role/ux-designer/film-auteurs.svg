<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8D8E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="35" ry="60"
    fill="none" stroke="black" stroke-width="2.75" />

  <!-- Left Eye -->
  <circle cx="82.5" cy="91" r="18"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="82.5" cy="91" r="8"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="117.5" cy="91" r="18"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="117.5" cy="91" r="8"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="69" y1="67.34425039850356"
        x2="96" y2="62.65574960149644"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="104" y1="62.65574960149644"
        x2="131" y2="67.34425039850356"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 84.5 121 Q 100 129 115.5 121"
    fill="none" stroke="black" stroke-width="2.75" stroke-linecap="round" />
