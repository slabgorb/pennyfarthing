<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8D5D5" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="40" ry="56.5"
    fill="none" stroke="black" stroke-width="2.75" />

  <!-- Left Eye -->
  <circle cx="80" cy="91.525" r="11"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="80" cy="91.525" r="4"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="120" cy="91.525" r="11"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="120" cy="91.525" r="4"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="71.75" y1="69.70333381756323"
