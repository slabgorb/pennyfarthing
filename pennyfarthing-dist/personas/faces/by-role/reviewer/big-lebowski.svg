    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="111.75" y1="75.34666618243678"
        x2="128.25" y2="69.70333381756323"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 84.5 119.775 Q 100 127.775 115.5 119.775"
    fill="none" stroke="black" stroke-width="2.75" stroke-linecap="round" />
</svg>