<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8D5D5" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="45" ry="52.5"
    fill="none" stroke="black" stroke-width="2.75" />

  <!-- Left Eye -->
  <circle cx="77.5" cy="92.125" r="13"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="77.5" cy="92.125" r="6"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="122.5" cy="92.125" r="13"
    fill="none" stroke="black" stroke-width="2.75" />
  <circle cx="122.5" cy="92.125" r="6"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="67.75" y1="71.125"
        x2="87.25" y2="71.125"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="112.75" y1="71.125"
        x2="132.25" y2="71.125"
    stroke="black" stroke-width="2.75" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 84.5 118.375 Q 100 126.375 115.5 118.375"
    fill="none" stroke="black" stroke-width="2.75" stroke-linecap="round" />
</svg>