<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#D5E8E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="40" ry="56.5"
