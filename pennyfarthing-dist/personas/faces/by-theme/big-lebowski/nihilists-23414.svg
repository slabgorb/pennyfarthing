  <!-- Right Eyebrow -->
  <line x1="114.25" y1="75.94666618243677"
        x2="130.75" y2="70.30333381756323"
    stroke="black" stroke-width="3.375" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 79.5 118.375 Q 100 132.375 120.5 118.375"
