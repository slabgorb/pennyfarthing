<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8D5E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="35" ry="60"
    fill="none" stroke="black" stroke-width="2.125" />

  <!-- Left Eye -->
  <circle cx="82.5" cy="91" r="16"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="82.5" cy="91" r="7"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="117.5" cy="91" r="16"
    fill="none" stroke="black" stroke-width="2.125" />
  <circle cx="117.5" cy="91" r="7"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="70.5" y1="62.895758280091975"
        x2="94.5" y2="71.10424171990803"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="105.5" y1="71.10424171990803"
        x2="129.5" y2="62.895758280091975"
    stroke="black" stroke-width="2.125" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 89 121 Q 100 122 111 121"
    fill="none" stroke="black" stroke-width="2.125" stroke-linecap="round" />
</svg>