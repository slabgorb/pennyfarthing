<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#E8D8E8" />

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="40" ry="56.5"
    fill="none" stroke="black" stroke-width="1.5" />

  <!-- Left Eye -->
  <circle cx="80" cy="91.525" r="8"
    fill="none" stroke="black" stroke-width="1.5" />
  <circle cx="80" cy="91.525" r="3"
    fill="black" stroke="none" />

  <!-- Right Eye -->
  <circle cx="120" cy="91.525" r="8"
    fill="none" stroke="black" stroke-width="1.5" />
  <circle cx="120" cy="91.525" r="3"
    fill="black" stroke="none" />

  <!-- Left Eyebrow -->
  <line x1="74" y1="76.5668890660016"
