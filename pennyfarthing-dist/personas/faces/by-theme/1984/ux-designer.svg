    stroke="black" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <line x1="114" y1="74.48311093399842"
        x2="126" y2="76.5668890660016"
    stroke="black" stroke-width="1.5" stroke-linecap="round" />

  <!-- Mouth -->
  <path d="M 75 119.775 Q 100 139.775 125 119.775"
