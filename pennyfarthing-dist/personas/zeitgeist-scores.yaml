# Zeitgeist Score Assignments
# Measuring persona articulation depth (NOT quality or preference)
#
# Scale (recalibrated for better spread):
#   exceptional (90-100): Maximum articulation - speech patterns, authentic quotes, named helpers
#   rich (70-89): Strong characterization - mostly authentic, good distinctiveness
#   moderate (50-69): Adequate characterization - functional but some generic elements
#   thin (30-49): Shallow characterization - concept helpers, object agents, adaptations over quotes
#   minimal (0-29): Insufficient articulation - baseline or incoherent source
#
# Rubric dimensions:
#   - Behavioral Specificity (25%): specific vs generic quirks
#   - Speech Pattern Signal (25%): accent, case rules, verbal tics, vocabulary
#   - Catchphrase Authenticity (20%): actual quotes vs adaptations
#   - Helper Characterization (15%): named characters vs concepts
#   - Agent Distinctiveness (15%): voice differentiation
#
# Purpose: Correlate with OCEAN profiles and benchmark performance
# Reference: ZEITGEIST-ANALYSIS.md

# Calibrated samples (manually scored with rubric):
calibrated:
  discworld:
    composite: 98.0
    rating: exceptional
    breakdown:
      behavioral: 100
      speech: 100  # 4/4
      catchphrases: 90
      helpers: 100
      distinctiveness: 100  # 5/5
    notes: "DEATH's CAPITALS, Igor's lisp, all named helpers with personality"

  star-trek-tos:
    composite: 84.75
    rating: rich
    breakdown:
      behavioral: 100
      speech: 75  # 3/4 - no case rules
      catchphrases: 100
      helpers: 60  # named but minimal personality
      distinctiveness: 80  # 4/5
    notes: "Strong authentic quotes, weak helper characterization"

  gilligans-island:
    composite: 49.5
    rating: thin  # 30-49 range; concept helpers (0%) and object agents
    breakdown:
      behavioral: 72
      speech: 50  # 2/4
      catchphrases: 50  # adaptations not quotes
      helpers: 0  # all concepts
      distinctiveness: 60  # 3/5
    notes: "Object agents, concept helpers, limited source material"

  control:
    composite: 3.0
    rating: minimal
    breakdown:
      behavioral: 0
      speech: 0
      catchphrases: 0
      helpers: 0
      distinctiveness: 20  # 1/5 floor
    notes: "Intentional baseline - zero persona elements"

