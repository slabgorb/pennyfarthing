# ─── Zeitgeist ───────────────────────────────────────────────────────────────

zeitgeist_section:
  score:
    required: true
    type: float
    min: 0.0
    max: 100.0
    description: Cultural recognition score (0-100)

  rating:
    required: true
    type: enum
    values: [minimal, moderate, rich, exceptional]
    description: Cultural recognition tier derived from score

# ─── Agent Entry ─────────────────────────────────────────────────────────────

required_agents:
  - orchestrator
  - sm
  - tea
  - dev
  - reviewer
  - architect
  - pm
  - tech-writer
  - ux-designer
  - devops
  - ba

agent_fields:
  character:
    required: true
    type: string
    description: Character name from source material

  style:
    required: true
    type: string
    description: Character personality and archetype description

  visual:
    required: true
    type: string
    description: Visual description for portrait generation

  ocean:
    required: true
    type: dict
    description: OCEAN Big Five personality profile
    fields:
      O:
        type: integer
        min: 1
        max: 5
        description: Openness to experience
      C:
        type: integer
        min: 1
        max: 5
        description: Conscientiousness
      E:
        type: integer
        min: 1
        max: 5
        description: Extraversion
      A:
        type: integer
        min: 1
        max: 5
        description: Agreeableness
      N:
        type: integer
        min: 1
        max: 5
        description: Neuroticism

  role:
    required: true
    type: string
    description: Character-specific role description (narrative)

  trait:
    required: true
    type: string
    description: Core defining characteristic

  expertise:
    required: true
    type: list
    item_type: string
    description: Areas of domain expertise

  emoji:
    required: true
    type: string
    description: Single unicode emoji representing the character

  helper:
    required: true
    type: dict
    description: Helper entity for the agent
    fields:
      name:
        required: true
        type: string
        description: Helper entity name
      style:
        required: true
        type: string
        description: How the helper functions or appears
      plural:
        required: false
        type: boolean
        description: Whether the helper is plural (e.g., "The Witches")
      shortName:
        required: false
        type: string
        description: Abbreviated helper reference

  quirks:
    required: false
    type: list
    item_type: string
    description: Character behavioral quirks (present in 99% of agents)

  catchphrases:
    required: false
    type: list
    item_type: string
    description: Characteristic verbal tics and quotes (present in 99% of agents)

  shortName:
    required: false
    type: string
    description: Abbreviated character name for compact display

  # Rare fields — present in ≤21 agents
  ocean_profile:
    required: false
    type: string
    pattern: "^[1-5]-[1-5]-[1-5]-[1-5]-[1-5]$"
    description: Explicit OCEAN profile override (O-C-E-A-N format)

  gap_filled:
    required: false
    type: string
    description: Gap-filling role for team composition

  benchmark_score:
    required: false
    type: float
    description: Job-fair benchmark score

# ─── Additional Characters ───────────────────────────────────────────────────

additional_character_fields:
  character:
    required: true
    type: string

  style:
    required: true
    type: string

  expertise:
    required: true
    type: list
    item_type: string

  role:
    required: true
    type: string

  ocean_profile:
    required: false
    type: string
    pattern: "^[1-5]-[1-5]-[1-5]-[1-5]-[1-5]$"

  best_role:
    required: false
    type: string
    description: Suggested agent role for this character

  gap_filled:
    required: false
    type: string

  visual:
    required: false
    type: string

  shortName:
    required: false
    type: string

  warning:
    required: false
    type: string
    description: Caution about using this character

  note:
    required: false
    type: string
