# BDD Workflow - Behavior-Driven Development
# UI-first workflow for features that need UX design before implementation
#
# Flow: SM → UX-Designer → TEA → Dev → Reviewer → SM
# Use for UI components, user-facing features, and behavior-centric stories

workflow:
  name: bdd
  description: Behavior-driven development with UX design phase
  version: "1.0.0"

  phases:
    - name: setup
      agent: sm
      output: [session_file, branches, story_context]

    - name: design
      agent: ux-designer
      input: [session_file, story_context]
      output: [design_spec, user_flows, wireframes, behavior_scenarios]
      gate:
        type: design_review
        condition: UX spec defines user flows and acceptance behaviors

    - name: red
      agent: tea
      input: [design_spec, behavior_scenarios, story_context]
      output: [failing_tests]
      gate:
        file: gates/tests-fail
        type: tests_fail
        condition: Behavior scenarios have test coverage

    - name: green
      agent: dev
      input: [failing_tests, design_spec, story_context]
      output: [implementation, passing_tests]
      gate:
        type: tests_pass
        condition: All tests passing, UX spec implemented

    - name: review
      agent: reviewer
      input: [implementation, passing_tests, design_spec]
      output: [approval]
      gate:
        file: gates/approval
        type: approval
        condition: Code review approved, UX requirements met

    - name: finish
      agent: sm
      input: [approval]
      output: [archived_session, story_summary]

  triggers:
    # Note: 'feature' type intentionally omitted - TDD is default for features
    # Use 'bdd' or 'ux-first' tag to explicitly request BDD workflow
    types: [ui, ux, behavior, component, settings]
    tags: [bdd, ux-first]
    points:
      min: 2
