# quick-spec Workflow - Migrated from BMAD format
# Generated by migrate-bmad-workflow.mjs

workflow:
  name: quick-spec
  description: Conversational spec engineering - ask questions, investigate code, produce implementation-ready tech-spec.
  version: "1.0.0"
  type: stepped

  # Step configuration
  steps:
    path: ./steps/
    pattern: step-*.md

  # Variables available in step files
  variables:
    project_root: .
    planning_artifacts: ./artifacts
    output_file: artifacts/quick-spec.md

  # Agent assignment (customize as needed)
  agent: architect

  # Triggers - when to suggest this workflow
  triggers:
    types: [quick-spec]
    tags: [quick-spec, stepped]
