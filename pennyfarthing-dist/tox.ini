[tox]
envlist = lint, test, build
isolated_build = True

[testenv]
deps =
    pytest
    pyyaml>=6.0
    ruamel.yaml>=0.18
    httpx>=0.28
    click>=8.0
    pydriller>=2.6

[testenv:test]
description = Run tests
commands =
    pytest src/pf/tests/ -v -m "not slow" {posargs}

[testenv:lint]
description = Run linters
deps =
    ruff
commands =
    ruff check src/pf/

[testenv:build]
description = Build wheel and sdist
deps =
    build
commands =
    python -m build --sdist --wheel --outdir dist/

[testenv:release]
description = Upload to CloudSmith via twine
deps =
    twine
commands =
    twine upload --config-file .pypirc --skip-existing -r cloudsmith dist/*

[testenv:package]
description = Build source distribution
deps =
    build
commands =
    python -m build --sdist --outdir dist/

[testenv:smoke]
description = Smoke test installed wheel
deps =
    build
commands =
    python -m build --wheel --outdir {envtmpdir}/wheels
    pip install {envtmpdir}/wheels/pennyfarthing_scripts-*.whl
    pf --version
