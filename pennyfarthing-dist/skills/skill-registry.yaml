        invocation: /mermaid architecture
      - context: Sequence diagrams
        invocation: /mermaid sequence
    anti_patterns:
      - Don't create overly complex diagrams - split into multiple if needed
    related_skills: [pf-changelog]
    keywords: [flowchart, sequence, er-diagram, gantt, class-diagram]

  pf-otel:
    name: pf-otel
    description: Claude Code OTEL telemetry format documentation for span interception and enrichment
    category: tools
    tags: [telemetry, monitoring, otel]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Working with OTEL spans
        invocation: /otel
      - context: Enriching tool telemetry in Frame
        invocation: /otel enrichment
    anti_patterns:
      - Don't assume fields exist - verify against this documentation
    related_skills: []
    keywords: [opentelemetry, spans, traces, enrichment, correlation]

  pf-settings:
    name: settings
    description: View and manage .pennyfarthing/config.local.yaml settings
    category: tools
    tags: [configuration, settings, config]
    version: "1.0.0"
    command_group: settings
    examples:
      - context: View all settings
        invocation: /pf-settings show
      - context: Get a specific setting
        invocation: /pf-settings get workflow.relay_mode
    related_skills: [pf-theme, pf-bc]
    keywords: [theme, relay, bell, permission, display, config]

  pf-persona-benchmark:
    name: pf-persona-benchmark
    description: Run benchmarks to compare persona effectiveness
    category: benchmarking
    tags: [benchmark, personas, comparison]
    version: "1.0.0"
    prerequisites: [pf-judge]
    examples:
      - context: Testing persona on code review
        invocation: /persona-benchmark cr-001 discworld
      - context: Testing tech writer persona
        invocation: /persona-benchmark tw-001 literary-classics
    anti_patterns:
      - Don't compare results across different rubric versions
    related_skills: [pf-judge, pf-finalize-run, pf-theme]
    keywords: [benchmark, comparison, personas, testing]

  pf-sprint:
    name: pf-sprint
    description: Sprint status, backlog, story, and epic management for Pennyfarthing
    category: project-management
    tags: [sprint, status, backlog, stories, epics]
    version: "2.0.0"
    command_group: sprint
    prerequisites: []
    examples:
      - context: Checking sprint status
        invocation: /pf-sprint
      - context: Finding available stories
        invocation: /pf-sprint backlog
      - context: Adding a story
        invocation: /pf-sprint story add epic-76 "My story" 3
      - context: Sizing guidelines
        invocation: /pf-sprint story size
      - context: Adding an epic
        invocation: /pf-sprint epic add epic-85 "New epic"
    anti_patterns:
      - Don't manually edit sprint YAML - use scripts
    related_skills: [pf-jira]
    keywords: [sprint, backlog, velocity, kanban, stories, epics, sizing, templates]
    allowed_tools: [Read, Glob, Grep, Bash, Task]

  pf-systematic-debugging:
    name: pf-systematic-debugging
    description: Systematic debugging approach for isolating and fixing issues
    category: development
    tags: [debugging, troubleshooting, root-cause]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Debugging test failures
        invocation: /systematic-debugging
      - context: Investigating regressions
        invocation: /systematic-debugging bisect
    anti_patterns:
      - Don't jump to solutions without reproducing the issue first
      - Don't fix symptoms instead of root causes
    related_skills: [pf-testing, pf-agentic-patterns]
    keywords: [debugging, bisect, reproduce, isolate, root-cause, regression]

  pf-tmux:
    name: tmux
    description: Pane management for tmux sessions — read TUI content, run commands, discover panes, capture output
    category: tools
    tags: [tmux, panes, terminal, agents, tui, capture, read, screenshot]
    version: "1.1.0"
    command_group: tmux
    prerequisites: []
    examples:
      - context: Reading what the TUI pane shows right now
        invocation: pf tmux read tui
      - context: Finding which pane is the TUI for this session
        invocation: pf tmux tui
      - context: Seeing all panes in this window
        invocation: pf tmux window
      - context: Running a command in a worker pane
        invocation: /tmux run "npm test"
      - context: Listing all panes with role and status
        invocation: /tmux list
      - context: Capturing content from a specific pane
        invocation: pf tmux read %42
      - context: Creating a new worker pane
        invocation: /tmux create --title "Dev Agent"
      - context: Closing a worker pane
        invocation: /tmux close worker
    anti_patterns:
      - Never use raw tmux send-keys — use pf tmux run or pf tmux send
      - Never use raw tmux capture-pane — use pf tmux read
      - Never target claude or tui panes for send/close — they are protected
      - Never guess pane IDs — use pf tmux tui or pf tmux window to discover them
    related_skills: [pf-just]
    keywords: [tmux, panes, terminal, worker, split, send-keys, protected, idle, tui, read, capture, screenshot, look, see, view, display, content, output, pane-id, discover, find, window]

  pf-handoff:
    name: handoff
    description: Phase gate resolution, session transitions, and agent handoff markers — the exit protocol every agent runs
    category: workflow
    tags: [handoff, gate, phase, transition, exit, agent, marker, relay]
    version: "1.0.0"
    command_group: handoff
    prerequisites: []
    examples:
      - context: Running the exit protocol (resolve gate, complete phase, emit marker)
        invocation: pf handoff resolve-gate 105-1 tdd green
      - context: Completing a phase transition
        invocation: pf handoff complete-phase 105-1 tdd green review tests_pass
      - context: Emitting a handoff marker to the next agent
        invocation: pf handoff marker dev
      - context: Checking current handoff state
        invocation: pf handoff status --json
    anti_patterns:
      - Never skip resolve-gate — it validates the assessment exists
      - Never call marker without complete-phase first — session won't update
      - Always run in order: resolve-gate → complete-phase → marker
    related_skills: [pf-workflow]
    keywords: [handoff, gate, phase, transition, exit, agent, marker, relay, resolve, complete, session, assessment, next-agent, phase-check, exit-protocol, hand-off, hand off]

  pf-testing:
    name: pf-testing
    description: Test commands and TDD workflow patterns
    category: development
    tags: [tdd, testing, quality]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Running project tests
        invocation: /testing
      - context: Debugging test failures
        invocation: /testing troubleshoot
    anti_patterns:
      - Don't run tests directly - use testing-runner subagent
      - Don't skip RED phase in TDD workflow
    related_skills: [pf-code-review]
    keywords: [jest, vitest, pytest, unit-test, integration, tdd, red-green, watch, test-runner]

