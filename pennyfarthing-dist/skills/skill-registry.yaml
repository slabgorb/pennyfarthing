# Pennyfarthing Skill Registry
# Central metadata for all built-in skills
# Schema: skill-registry.schema.json

version: "1.0.0"

skills:
  pf-agentic-patterns:
    name: pf-agentic-patterns
    description: Core reasoning patterns for building effective LLM agents
    category: ai-llm
    tags: [reasoning, patterns, agents, llm]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Designing agent behavior
        invocation: /agentic-patterns
      - context: Debugging agent failures
        invocation: /agentic-patterns troubleshooting
    anti_patterns:
      - Don't apply patterns mechanically without understanding context
    related_skills: [pf-context-engineering]
    keywords: [react, reflection, planning, tool-use, chain-of-thought]
    allowed_tools: [Read, Glob, Grep, Task]  # Reference material - read-only

  pf-bc:
    name: pf-bc
    description: Panel focus management for Cyclist — set, clear, save, and load panel layouts
    category: tools
    tags: [cyclist, panels, layout, bikerack]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Focusing the Sprint panel
        invocation: /bc sprint
      - context: Saving current layout
        invocation: /bc save my-layout
      - context: Resetting panel focus
        invocation: /bc reset
    anti_patterns:
      - Don't manually edit config.local.yaml to set panel focus — use this skill
    related_skills: [pf-cyclist]
    keywords: [bikerack, cyclist, panel, focus, layout, dockview]

  pf-changelog:
    name: pf-changelog
    description: Maintain changelogs following Keep a Changelog format with conventional commits
    category: documentation
    tags: [changelog, releases, versioning]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Creating release notes
        invocation: /changelog
      - context: Auto-generating from commits
        invocation: /changelog generate
    anti_patterns:
      - Don't manually edit CHANGELOG.md entries after generation
    related_skills: []
    keywords: [keepachangelog, conventional-commits, semver, release-notes]

  pf-code-review:
    name: pf-code-review
    description: Code review checklists and patterns for quality assurance
    category: development
    tags: [review, quality, checklist]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Self-review before commit
        invocation: /code-review
      - context: Reviewing a PR
        invocation: /code-review pr-checklist
    anti_patterns:
      - Don't skip security considerations in review
      - Don't approve without running tests
    related_skills: [pf-testing]
    keywords: [pr, pull-request, quality, linting, security]

  pf-context-engineering:
    name: pf-context-engineering
    description: Strategies for managing context windows in long-running agent sessions
    category: ai-llm
    tags: [context, optimization, agents]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Approaching context limits
        invocation: /context-engineering
      - context: Designing subagent prompts
        invocation: /context-engineering subagent-design
    anti_patterns:
      - Don't load unnecessary context upfront
      - Don't repeat large code blocks in prompts
    related_skills: [pf-agentic-patterns]
    keywords: [context-window, tokens, summarization, lazy-loading]
    allowed_tools: [Read, Glob, Grep, Task]  # Reference material - read-only

  pf-cyclist:
    name: pf-cyclist
    description: Launch Cyclist visual terminal for Claude Code monitoring
    category: tools
    tags: [visual, monitoring, terminal]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Starting visual monitor
        invocation: /cyclist
      - context: Debugging sessions
        invocation: /cyclist debug
    anti_patterns:
      - Don't run Cyclist in headless environments
    related_skills: []
    keywords: [tui, terminal, visualization, dashboard]

  pf-finalize-run:
    name: pf-finalize-run
    description: Validate and save benchmark run results - single exit point for all runs
    category: benchmarking
    tags: [benchmark, validation, results]
    version: "1.0.0"
    prerequisites: [pf-judge]
    examples:
      - context: Completing a benchmark run
        invocation: /finalize-run
    anti_patterns:
      - Never save results without passing through this skill
    related_skills: [pf-judge, pf-persona-benchmark]
    keywords: [benchmark, save, validate, guardrail]

  pf-jira:
    name: pf-jira
    description: Jira CLI commands for sprint management
    category: project-management
    tags: [jira, issues, sprint]
    version: "1.0.0"
    command_group: jira
    prerequisites: []
    examples:
      - context: Viewing sprint issues
        invocation: /jira sprint
      - context: Assigning issues
        invocation: /jira assign ISSUE-123
    anti_patterns:
      - Don't bypass Jira for sprint tracking
    related_skills: [pf-sprint]
    keywords: [atlassian, issues, tickets, backlog]

  pf-judge:
    name: pf-judge
    description: Evaluate agent responses using standardized rubrics
    category: benchmarking
    tags: [evaluation, rubrics, scoring]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Evaluating agent response
        invocation: /judge evaluate
      - context: Running benchmark comparison
        invocation: /judge compare
    anti_patterns:
      - Don't modify rubrics during a benchmark run
    related_skills: [pf-finalize-run, pf-persona-benchmark]
    keywords: [evaluation, scoring, metrics, grading]

  pf-just:
    name: pf-just
    description: Run just recipes for project tasks like dev servers, tests, and databases
    category: tools
    tags: [tasks, runner, automation]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Starting dev servers
        invocation: /just dev
      - context: Running database tasks
        invocation: /just db-reset
    anti_patterns:
      - Don't create complex recipes - keep them simple and composable
    related_skills: [pf-testing]
    keywords: [justfile, make, tasks, automation, command-runner]

  pf-mermaid:
    name: pf-mermaid
    description: Generate diagrams using Mermaid syntax for documentation
    category: tools
    tags: [diagrams, visualization, documentation]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Creating architecture diagrams
        invocation: /mermaid architecture
      - context: Sequence diagrams
        invocation: /mermaid sequence
    anti_patterns:
      - Don't create overly complex diagrams - split into multiple if needed
    related_skills: [pf-changelog]
    keywords: [flowchart, sequence, er-diagram, gantt, class-diagram]

  pf-otel:
    name: pf-otel
    description: Claude Code OTEL telemetry format documentation for span interception and enrichment
    category: tools
    tags: [telemetry, monitoring, otel]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Working with OTEL spans
        invocation: /otel
      - context: Enriching tool telemetry in Cyclist
        invocation: /otel enrichment
    anti_patterns:
      - Don't assume fields exist - verify against this documentation
    related_skills: [pf-cyclist]
    keywords: [opentelemetry, spans, traces, enrichment, correlation]

  pf-permissions:
    name: pf-permissions
    description: Manage runtime permission grants - list, grant, and revoke tool access
    category: project-management
    tags: [permissions, security, tools]
    version: "1.0.0"
    command_group: permissions
    prerequisites: []
    examples:
      - context: Viewing active grants
        invocation: /permissions
      - context: Granting WebFetch access
        invocation: /permissions grant WebFetch "*.github.com"
      - context: Revoking tool access
        invocation: /permissions revoke Bash
    anti_patterns:
      - Don't manually edit settings.local.json permissions - use skill
      - Don't grant overly broad scope patterns
    related_skills: []
    keywords: [grants, scopes, tools, runtime, security]

  pf-settings:
    name: pf-settings
    description: View and manage .pennyfarthing/config.local.yaml settings
    category: tools
    tags: [configuration, settings, config]
    version: "1.0.0"
    command_group: settings
    examples:
      - context: View all settings
        invocation: /pf-settings show
      - context: Get a specific setting
        invocation: /pf-settings get workflow.relay_mode
    related_skills: [pf-theme, pf-bc]
    keywords: [theme, relay, bell, permission, display, config]

  pf-persona-benchmark:
    name: pf-persona-benchmark
    description: Run benchmarks to compare persona effectiveness
    category: benchmarking
    tags: [benchmark, personas, comparison]
    version: "1.0.0"
    prerequisites: [pf-judge]
    examples:
      - context: Testing persona on code review
        invocation: /persona-benchmark cr-001 discworld
      - context: Testing tech writer persona
        invocation: /persona-benchmark tw-001 literary-classics
    anti_patterns:
      - Don't compare results across different rubric versions
    related_skills: [pf-judge, pf-finalize-run, pf-theme]
    keywords: [benchmark, comparison, personas, testing]

  pf-sprint:
    name: pf-sprint
    description: Sprint status, backlog, story, and epic management for Pennyfarthing
    category: project-management
    tags: [sprint, status, backlog, stories, epics]
    version: "2.0.0"
    command_group: sprint
    prerequisites: []
    examples:
      - context: Checking sprint status
        invocation: /pf-sprint
      - context: Finding available stories
        invocation: /pf-sprint backlog
      - context: Adding a story
        invocation: /pf-sprint story add epic-76 "My story" 3
      - context: Sizing guidelines
        invocation: /pf-sprint story size
      - context: Adding an epic
        invocation: /pf-sprint epic add epic-85 "New epic"
    anti_patterns:
      - Don't manually edit sprint YAML - use scripts
    related_skills: [pf-jira]
    keywords: [sprint, backlog, velocity, kanban, stories, epics, sizing, templates]
    allowed_tools: [Read, Glob, Grep, Bash, Task]

  pf-systematic-debugging:
    name: pf-systematic-debugging
    description: Systematic debugging approach for isolating and fixing issues
    category: development
    tags: [debugging, troubleshooting, root-cause]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Debugging test failures
        invocation: /systematic-debugging
      - context: Investigating regressions
        invocation: /systematic-debugging bisect
    anti_patterns:
      - Don't jump to solutions without reproducing the issue first
      - Don't fix symptoms instead of root causes
    related_skills: [pf-testing, pf-agentic-patterns]
    keywords: [debugging, bisect, reproduce, isolate, root-cause, regression]

  pf-story:
    name: pf-story
    description: "DEPRECATED: Use /pf-sprint story instead. Story commands consolidated under /pf-sprint."
    category: project-management
    tags: [stories, sizing, workflow, deprecated]
    version: "2.0.0"
    deprecated: true
    redirect: pf-sprint
    prerequisites: []
    examples:
      - context: Creating new stories
        invocation: /pf-sprint story add
      - context: Sizing stories
        invocation: /pf-sprint story size
    anti_patterns:
      - Don't create stories without acceptance criteria
      - Don't use /story directly - use /pf-sprint story instead
    related_skills: [pf-sprint, pf-jira]
    keywords: [user-stories, estimation, points, acceptance-criteria]

  pf-testing:
    name: pf-testing
    description: Test commands and TDD workflow patterns
    category: development
    tags: [tdd, testing, quality]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Running project tests
        invocation: /testing
      - context: Debugging test failures
        invocation: /testing troubleshoot
    anti_patterns:
      - Don't run tests directly - use testing-runner subagent
      - Don't skip RED phase in TDD workflow
    related_skills: [pf-code-review]
    keywords: [jest, vitest, pytest, unit-test, integration, tdd, red-green]

  pf-theme:
    name: pf-theme
    description: Manage persona themes - list, show, set, create, and interactive maker wizard
    category: theming
    tags: [personas, themes, customization, creation]
    version: "2.0.0"
    command_group: theme
    prerequisites: []
    examples:
      - context: Listing available themes
        invocation: /pf-theme list
      - context: Showing current theme
        invocation: /pf-theme show
      - context: Setting active theme
        invocation: /pf-theme set discworld
      - context: Creating a new theme
        invocation: /pf-theme create my-theme --base discworld
      - context: Interactive AI-driven theme wizard
        invocation: /pf-theme maker
    anti_patterns:
      - Don't edit config.local.yaml directly - use skill
      - Don't use deprecated /set-theme, /show-theme, /list-themes, /create-theme, /theme-maker
    related_skills: []
    keywords: [personas, characters, discworld, literary-classics, custom, generation, wizard]

  pf-theme-creation:
    name: pf-theme-creation
    description: "DEPRECATED: Use /pf-theme maker instead"
    category: theming
    tags: [personas, themes, creation]
    version: "2.0.0"
    deprecated: true
    redirect: pf-theme
    prerequisites: []
    examples:
      - context: Interactive theme wizard
        invocation: /pf-theme maker
    anti_patterns: []
    related_skills: [pf-theme]
    keywords: [personas, custom, generation, wizard]

  pf-ux-tandem:
    name: pf-ux-tandem
    description: Live UX review tandem — spawn a UX designer to watch a tmux pane and suggest improvements in real time
    category: development
    tags: [ux, tandem, review, tmux, collaboration, team]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Watch a TUI for usability issues
        invocation: /pf-ux-tandem
      - context: Watch a running app in another pane
        invocation: /pf-ux-tandem
    anti_patterns:
      - Don't use for non-visual targets (use standard tandem-backseat for code review)
    related_skills: [pf-code-review, pf-party-mode]
    keywords: [ux, design, review, tandem, tmux, visual, usability, team]

  pf-workflow:
    name: pf-workflow
    description: Manage workflows - list, show, set, start, resume, and check status
    category: project-management
    tags: [workflow, phases, tdd]
    version: "1.0.0"
    command_group: workflow
    prerequisites: []
    examples:
      - context: Listing available workflows
        invocation: /pf-workflow
      - context: Showing current workflow
        invocation: /pf-workflow show
      - context: Starting stepped workflow
        invocation: /pf-workflow start architecture
    anti_patterns:
      - Don't switch workflows mid-story unless requirements fundamentally changed
    related_skills: [pf-sprint]
    keywords: [tdd, tdd-tandem, trivial, agent-docs, bdd, bdd-tandem, architecture, bikelane, stepped, phased]

  pf-yq:
    name: pf-yq
    description: YAML processor for reading, modifying, and querying YAML files
    category: tools
    tags: [yaml, processing, cli]
    version: "1.0.0"
    prerequisites: []
    examples:
      - context: Reading YAML values
        invocation: /yq read
      - context: Modifying YAML files
        invocation: /yq modify
    anti_patterns:
      - Don't use complex expressions without testing first
    related_skills: [pf-just]
    keywords: [yaml, jq, parsing, query, mikefarah]
