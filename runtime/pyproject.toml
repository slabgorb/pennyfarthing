[project]
name = "pf"
version = "1.0.0a1"
description = "Pennyfarthing agent orchestration runtime"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "httpx>=0.28",
  "click>=8.0",
  "pydriller>=2.6",
  "textual>=1.0",
  "websockets>=12.0",
  "textual-image>=0.7.0",
  "watchfiles>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-mock>=3.14",
  "pytest-asyncio>=1.0",
  "build>=1.0",
  "python-pptx>=1.0"
]

[project.scripts]
pf = "pf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pf"]

[tool.pytest.ini_options]
testpaths = ["src/pf/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
