[project]
name = "pennyfarthing-scripts"
dynamic = ["version"]
description = "Python utilities for Pennyfarthing agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "httpx>=0.28",
    "click>=8.0",
    "pydriller>=2.6",
    "textual>=1.0",
    "websockets>=12.0",
    "textual-image>=0.7.0",
    "watchfiles>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
portraits = [
    "torch>=2.0",
    "diffusers>=0.36",
    "transformers>=4.0",
    "accelerate>=1.0",
    "pillow>=12.0",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.0",
    "ruff>=0.8",
]

[project.scripts]
pf = "pf.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "pf.__version__"}

[tool.setuptools.packages.find]
where = ["pennyfarthing-dist/src"]
include = ["pf*"]

[tool.setuptools.package-data]
"pf._dist" = ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.json", "**/*.sh", "**/*.txt", "**/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["pennyfarthing-dist/src/pf/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
