# Baseline Summary Schema v1.0
# All summary.yaml files MUST conform to this structure
# Location: internal/results/baselines/{scenario}/{role}/summary.yaml

# =============================================================================
# REQUIRED FIELDS - Scripts depend on these exact paths
# =============================================================================

# Version for future migrations
schema_version: 1

# Agent identification (REQUIRED)
agent:
  theme: control          # Theme name (e.g., "control", "discworld")
  role: reviewer          # Role name (e.g., "reviewer", "dev", "sm", "tea")
  spec: control:reviewer  # Full spec string "{theme}:{role}"

# Scenario identification (REQUIRED)
scenario:
  name: order-service     # Scenario name (matches filename without .yaml)
  category: code-review   # Category (code-review, dev, sm, tea, architecture, debug)
  difficulty: hard        # Empirical difficulty (easy, medium, hard, extreme)

# Core statistics (REQUIRED) - flat structure for easy querying
statistics:
  n: 10                   # Sample size
  mean: 91.90             # Mean score (0-100)
  std_dev: 1.45           # Standard deviation
  min: 89                 # Minimum score
  max: 94                 # Maximum score
  ci_95_lower: 90.86      # 95% confidence interval lower bound
  ci_95_upper: 92.94      # 95% confidence interval upper bound
  scores: [93, 89, 92, 91, 93, 94, 91, 91, 92, 93]  # All individual scores

# =============================================================================
# OPTIONAL FIELDS - Nice to have but not required for queries
# =============================================================================

# Token efficiency metrics
efficiency:
  avg_input_tokens: 2500
  avg_output_tokens: 3200
  tokens_per_point: 34.82

# Dimension breakdowns (scoring rubric categories)
dimensions:
  correctness:
    weight: 25
    mean: 23.1
    std_dev: 0.74
  depth:
    weight: 25
    mean: 23.2
    std_dev: 0.63
  quality:
    weight: 25
    mean: 23.6
    std_dev: 0.52
  persona:
    weight: 25
    mean: 22.0
    std_dev: 0.0

# Metadata
metadata:
  created_at: "2026-01-01T00:00:00Z"
  updated_at: "2026-01-01T00:00:00Z"
  pennyfarthing_version: "7.6.1"  # Version when baseline was created
  model: sonnet
  notes: ""

# Run file references
runs:
  - run_1.json
  - run_2.json
  # ... etc
