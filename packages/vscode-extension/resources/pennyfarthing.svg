<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Penny-farthing bicycle -->

  <!-- Large front wheel - outer rim -->
  <circle cx="8" cy="11" r="7.5" stroke-width="1.5"/>

  <!-- Large wheel hub -->
  <circle cx="8" cy="11" r="0.8" fill="currentColor"/>

  <!-- Spokes for large wheel -->
  <line x1="8" y1="3.5" x2="8" y2="18.5"/>
  <line x1="0.5" y1="11" x2="15.5" y2="11"/>
  <line x1="2.7" y1="5.7" x2="13.3" y2="16.3"/>
  <line x1="2.7" y1="16.3" x2="13.3" y2="5.7"/>
  <line x1="4.2" y1="4.2" x2="11.8" y2="17.8"/>
  <line x1="4.2" y1="17.8" x2="11.8" y2="4.2"/>
  <line x1="1.5" y1="8" x2="14.5" y2="14"/>
  <line x1="1.5" y1="14" x2="14.5" y2="8"/>

  <!-- Small back wheel (no spokes) -->
  <circle cx="21" cy="17.5" r="2" stroke-width="1.2"/>
  <circle cx="21" cy="17.5" r="0.4" fill="currentColor"/>

  <!-- Frame - curves OUTSIDE the big wheel from rear axle to seat -->
  <!-- Control point at (18, 4) pulls the curve way out to the right -->
  <path d="M21 17.5 Q 18 4, 9.5 4" stroke-width="1.2"/>

  <!-- Seat post (vertical from hub to seat) -->
  <line x1="8" y1="11" x2="8" y2="4" stroke-width="1.2"/>

  <!-- Seat -->
  <path d="M6.5 4 L9.5 4" stroke-width="1.5"/>

  <!-- Handlebar stem -->
  <line x1="8" y1="4" x2="8" y2="2"/>

  <!-- Handlebars (curved like mustache) -->
  <path d="M5.5 2.5 Q 7 1.5, 8 2 Q 9 1.5, 10.5 2.5" stroke-width="1"/>

  <!-- Ground line hint -->
  <line x1="0" y1="19.5" x2="23" y2="19.5" stroke-width="0.5" stroke-dasharray="1,1"/>
</svg>
