# Peloton Benchmark: Pipeline TEA > Dev > Reviewer
# Serde Bypass (CWE-20) — constructor validation bypassed by derive(Deserialize)
#
# Three-stage stateful benchmark where each stage's output is the next stage's input.
# Scores the chain, not the individual.

id: peloton-001
name: Serde Bypass Pipeline
category: peloton
difficulty: medium
family: detection
version: "2.0"

content_source:
  type: lang-review
  reference: "rust-review-checklist.md check #8 (orc-ax-2 .pennyfarthing/gates/)"
  provenance: |
    Same stimulus as cr-003. Pipeline variant tests three-stage handoff quality
    where TEA test framing determines whether Dev fixes or preserves bugs.
    Discovered via scenario-discovery workflow N=1 proof-of-concept (T0, T1).

description: |
  A Rust API key module where #[derive(Deserialize)] bypasses the validating new()
  constructor. The TEA writes tests, Dev fixes the code, Reviewer catches what remains.
  Ground truth: ApiKey can be deserialized with invalid prefix/secret via WebhookPayload,
  bypassing all validation in ApiKey::new(). Fix: #[serde(try_from = "...")] or manual impl.

ground_truth:
  primary:
    id: F1
    name: serde_constructor_bypass
    severity: critical
    cwe: CWE-20
    description: |
      #[derive(Deserialize)] on ApiKey generates a deserializer that sets fields directly,
      bypassing the validation in ApiKey::new(). Any JSON with {"prefix":"","secret":""}
      creates an ApiKey that violates all invariants. WebhookPayload deserializes ApiKey
      from external input, making this exploitable.
    fix: |
      Remove #[derive(Deserialize)] from ApiKey. Implement Deserialize manually or use
      #[serde(try_from = "RawApiKey")] to route through validation.
  secondary:
    - id: F2
      name: debug_secret_leak
      severity: high
      description: "#[derive(Debug)] on ApiKey prints secret in logs/errors"
    - id: F14
      name: non_exhaustive_error
      severity: low
      description: "ApiKeyError should be #[non_exhaustive] for API stability"

  red_herrings:
    - id: RH1
      description: "RateLimitConfig has pub fields — this is fine, no invariants to protect"
    - id: RH2
      description: "unwrap() in test helper — acceptable in test code"

code:
  language: rust
  filename: api_key.rs
  content: |
    use serde::{Deserialize, Serialize};
    use std::fmt;

    #[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]
    pub struct ApiKey {
        prefix: String,
        secret: String,
    }

    impl ApiKey {
        pub fn new(raw: &str) -> Result<Self, ApiKeyError> {
            let (prefix, secret) = raw
                .split_once('_')
                .ok_or(ApiKeyError::InvalidFormat)?;

            if prefix.len() < 2 || prefix.len() > 10 {
                return Err(ApiKeyError::InvalidPrefix);
            }
            if !prefix.chars().all(|c| c.is_ascii_lowercase()) {
                return Err(ApiKeyError::InvalidPrefix);
            }
            if secret.len() < 32 {
                return Err(ApiKeyError::SecretTooShort);
            }

            Ok(Self {
                prefix: prefix.to_string(),
                secret: secret.to_string(),
            })
        }

        pub fn prefix(&self) -> &str {
            &self.prefix
        }
    }

    impl fmt::Display for ApiKey {
        fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
            write!(f, "{}_{}", self.prefix, &self.secret[..8])
        }
    }

    #[derive(Debug)]
    pub enum ApiKeyError {
        InvalidFormat,
        InvalidPrefix,
        SecretTooShort,
    }

    pub struct RateLimitConfig {
        pub max_requests: u32,
        pub window_secs: u64,
        pub burst_size: u32,
        pub allowed_origins: Vec<String>,
    }

    #[derive(Debug, Deserialize)]
    pub struct WebhookPayload {
        pub event_type: String,
        pub timestamp: u64,
        pub api_key: ApiKey,
        pub source_ip: String,
        pub metadata: serde_json::Value,
    }

    pub fn process_webhook(payload: &WebhookPayload) -> Result<(), String> {
        if payload.event_type.is_empty() {
            return Err("empty event type".into());
        }

        println!("Processing {} from {}", payload.api_key, payload.source_ip);
        Ok(())
    }

    #[cfg(test)]
    mod tests {
        use super::*;

        fn make_test_key() -> ApiKey {
            ApiKey::new("test_abcdefghijklmnopqrstuvwxyz0123456789").unwrap()
        }

        #[test]
        fn test_valid_api_key() {
            let key = make_test_key();
            assert_eq!(key.prefix(), "test");
        }

        #[test]
        fn test_invalid_prefix_rejected() {
            assert!(ApiKey::new("AB_short").is_err());
            assert!(ApiKey::new("_nosecret").is_err());
        }
    }

# Stage-specific prompts
# Each stage receives the code + its role-specific instruction + prior stage output

stages:
  tea:
    prompt: |
      Review this Rust code and write a comprehensive test suite for it.
      Focus on correctness, edge cases, security boundaries, and ensuring
      that all public invariants are actually enforced. Write real, compilable
      Rust test code.
    output_type: test_code

  dev:
    prompt: |
      Here is Rust source code and a set of tests written by your test engineer.
      Some tests may be failing. Your job: fix the source code so all tests pass.
      Do NOT modify the tests. Show your complete modified source code.

      ## Test Engineer's Tests
      {tea_output}
    input_from: tea
    output_type: modified_code

  reviewer:
    prompt: |
      Review the changes made to this Rust code. Below is the original code and
      the developer's modified version. Identify any remaining issues, assess
      whether the fixes are correct and complete, and flag anything the developer
      missed or introduced.

      ## Developer's Modified Code
      {dev_output}
    input_from: dev
    output_type: review_findings

# Scoring
scoring:
  per_stage:
    tea:
      dimensions: [coverage, red_state, handoff]
      weights: [35, 35, 30]
    dev:
      dimensions: [green_state, code_quality, handoff]
      weights: [40, 30, 30]
    reviewer:
      dimensions: [detection, verdict, persona]
      weights: [40, 30, 30]

  pipeline:
    ground_truth_resolved:
      weight: 40
      description: "Is the serde bypass fixed in Dev's final output?"
    handoff_quality:
      weight: 20
      description: "Did each stage provide clear, actionable input to the next?"
    residual_findings:
      weight: 20
      description: "What issues remain after all three stages?"
    coverage_union:
      weight: 20
      description: "Total distinct issues addressed across the chain"

# Pipeline-specific BARS rubric
# Anchors grounded in T0/T1 proof-of-concept observations
rubric:
  tea_stage:
    coverage:
      expert: |
        Tests target the ground truth directly: deserialization bypass test that constructs
        invalid ApiKey via JSON and asserts it should fail. Tests use #[should_panic] or
        assert_err to DEMAND the fix, not just document the bug.
      adequate: |
        Tests document the bypass exists (assert deserialization succeeds with invalid data)
        but don't frame it as a failure. Dev sees passing tests and preserves the behavior.
        Observed in both T0 and T1 proof-of-concept runs.
      poor: |
        Tests focus only on happy path and obvious validation (invalid prefix, short secret).
        No deserialization tests at all. Dev has no signal about the bypass.
    red_state:
      expert: "Tests fail against the original code, forcing Dev to fix the bypass to make them pass"
      adequate: "Tests pass against original code -- documents bug but doesn't force fix"
      poor: "Tests are trivial wrappers around existing tests, add no new coverage"
  dev_stage:
    green_state:
      expert: |
        Implements #[serde(try_from)] or manual Deserialize impl. All TEA tests pass.
        No regressions introduced. Validation is enforced on all construction paths.
      adequate: |
        Makes all tests pass but via workaround (e.g., adding panic-safe Display) rather
        than fixing the root cause. Bypass still exists.
      poor: |
        Modifies tests to make them pass (violates instructions). Or introduces regressions
        that break existing functionality.
    code_quality:
      expert: "Clean implementation with proper error handling and idiomatic Rust patterns"
      adequate: "Working fix but inelegant -- gets the job done without best practices"
      poor: "Code compiles but has obvious quality issues or introduces new vulnerabilities"
  reviewer_stage:
    detection:
      expert: |
        Catches residual issues Dev missed or introduced. Identifies if the bypass is
        actually fixed vs papered over. Recommends rejection if bypass persists.
        Observed in both T0 and T1: Reviewer correctly identified net-negative PRs.
      adequate: "Notes some remaining issues but doesn't assess whether the core fix is complete"
      poor: "Rubber-stamps the PR with superficial praise and no substantive criticism"

# Pipeline-specific persona influence
pipeline_persona_influence:
  tea_framing_trap: |
    The TEA's test framing determines whether Dev fixes or preserves the bug.
    Both T0 and T1 TEAs wrote tests asserting the bypass WORKS (.unwrap() on
    invalid deserialization). Dev dutifully made all tests pass -- including the
    broken ones. Reviewer caught it both times but by then the pipeline has
    enshrined the bug. THIS IS THE KEY PELOTON INSIGHT.
  dimensions:
    - seat: tea
      critical_trait: "adversarial framing vs documenting framing"
      effect: "TEA who writes assert_err forces fix; TEA who writes assert_ok preserves bug"
    - seat: dev
      critical_trait: "literal instruction-following vs judgment"
      effect: "Dev who follows tests literally may preserve bugs that tests enshrine"
    - seat: reviewer
      critical_trait: "willingness to reject vs rubber-stamp"
      effect: "Reviewer is last safety net; must be willing to say 'reject, start over'"

difficulty_profile:
  declared: medium
  pipeline_note: |
    Difficulty is medium for isolated detection but the pipeline interaction makes
    it harder -- even when TEA finds the bug, the test framing trap can cause
    the pipeline to preserve it. Ground truth resolved in 0/2 proof-of-concept runs.
  calibration: null

# Design decisions (locked in)
design_decisions:
  dev_sees_tests_as: failing  # RED > GREEN — matches TDD workflow
  reviewer_sees: original_plus_diff  # original code + Dev's modified version
  regression_scoring: net_deduct  # deduct for regressions Dev introduces
  initial_n: 5  # start N=5, escalate if variance is high
  cross_position_testing: deferred  # test same persona in different seats later

# Teams
teams:
  control:
    tea: { theme: control, character: "Test Engineer (baseline control)" }
    dev: { theme: control, character: "Developer (baseline control)" }
    reviewer: { theme: control, character: "Code Reviewer (baseline control)" }
  firefly:
