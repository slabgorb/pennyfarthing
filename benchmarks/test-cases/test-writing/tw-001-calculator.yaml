# Test Writing Benchmark: TW-001
# Calculator module requiring comprehensive tests

id: tw-001
name: Calculator Test Coverage
category: test-writing
difficulty: medium
agent: tea

description: |
  A calculator module with basic and advanced operations.
  Tests should cover normal cases, edge cases, and error conditions.

instructions: |
  Write comprehensive tests for this calculator module.
  Consider edge cases, boundary conditions, and error scenarios.

code:
  language: typescript
  filename: calculator.ts
  content: |
    export class Calculator {
      private precision: number;
      private memory: number = 0;

      constructor(precision: number = 10) {
        this.precision = precision;
      }

      add(a: number, b: number): number {
        return this.round(a + b);
      }

      subtract(a: number, b: number): number {
        return this.round(a - b);
      }

      multiply(a: number, b: number): number {
        return this.round(a * b);
      }

      divide(a: number, b: number): number {
        if (b === 0) {
          throw new Error("Division by zero");
        }
        return this.round(a / b);
      }

      power(base: number, exponent: number): number {
        return this.round(Math.pow(base, exponent));
      }

      sqrt(n: number): number {
        if (n < 0) {
          throw new Error("Cannot calculate square root of negative number");
        }
        return this.round(Math.sqrt(n));
      }

      percentage(value: number, percent: number): number {
        return this.round((value * percent) / 100);
      }

      // Memory operations
      memoryStore(value: number): void {
        this.memory = value;
      }

      memoryRecall(): number {
        return this.memory;
      }

      memoryAdd(value: number): void {
        this.memory += value;
      }

      memoryClear(): void {
        this.memory = 0;
      }

      private round(value: number): number {
        const factor = Math.pow(10, this.precision);
        return Math.round(value * factor) / factor;
      }
    }

# Known edge cases - for scoring
