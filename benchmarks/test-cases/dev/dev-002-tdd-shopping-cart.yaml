# SCORING: What we're measuring for TDD discipline

baseline_criteria:
  tests_passing:
    - id: BASIC_CART_OPS
      tests: 5
      description: "NewCart, AddItem single/multiple/same/different"

    - id: REMOVE_OPS
      tests: 5
      description: "RemoveItem decrease/all/more/nonexistent, Clear"

    - id: DISCOUNT_OPS
      tests: 7
      description: "ApplyDiscount percent/fixed/exceeds/replace/remove, dynamic application"

    - id: SUMMARY_OPS
      tests: 4
      description: "GetItems, Subtotal, DiscountAmount"

    - id: HAS_CONTAINS_OPS
      tests: 5
      description: "HasItem, GetQuantity"

  total_tests: 26

scoring_rubric:
  # Test Results (50% of score)
  tests_passing:
    description: "How many of the 26 tests pass"
    weight: 50
    scoring: |
      100%: All 26 tests pass
      90%: 24-25 tests pass
      80%: 21-23 tests pass
      60%: 16-20 tests pass
      40%: 11-15 tests pass
      20%: 6-10 tests pass
      0%: 0-5 tests pass

  # Minimal Implementation (20% of score)
  minimal_code:
    description: "Did they avoid over-engineering?"
    weight: 20
    penalties:
      - id: UNUSED_FIELDS
        description: "Added struct fields not needed by any test"
        deduction: 2
      - id: UNUSED_METHODS
        description: "Added methods not called by any test"
        deduction: 3
      - id: PREMATURE_VALIDATION
        description: "Added input validation not required by tests"
        deduction: 2
      - id: EXTRA_ERROR_HANDLING
        description: "Added error returns when tests expect none"
        deduction: 2
      - id: UNNECESSARY_ABSTRACTION
        description: "Created interfaces/helpers not needed"
        deduction: 3
      - id: FEATURE_CREEP
        description: "Added features like persistence, events, etc."
        deduction: 5
    max_penalties: 20

  # Code Quality (20% of score)
  code_quality:
    description: "Is the implementation clean and idiomatic?"
    weight: 20
    criteria:
      - id: IDIOMATIC_GO
        description: "Follows Go conventions (naming, error handling)"
        points: 5
      - id: CLEAR_LOGIC
        description: "Logic is straightforward and readable"
        points: 5
      - id: PROPER_TYPES
        description: "Appropriate use of types (int64 for money, etc.)"
        points: 5
      - id: NO_BUGS
        description: "No obvious bugs or edge case failures"
        points: 5
    max_points: 20

  # TDD Understanding (10% of score)
  tdd_discipline:
    description: "Did they demonstrate TDD understanding?"
    weight: 10
    criteria:
      - id: NO_TEST_MODIFICATION
        description: "Did not modify the test file"
        points: 5
      - id: MATCHES_TEST_CONTRACTS
        description: "Function signatures match exactly what tests expect"
        points: 5
    max_points: 10

# Bonus: Things that show exceptional TDD understanding
bonus_criteria:
  - id: ZERO_OVERHEAD
    description: "Implementation has no unused code at all"
    points: 2

  - id: ELEGANT_SOLUTION
    description: "Solution is particularly elegant/minimal"
    points: 3

  - id: CORRECT_EDGE_CASES
    description: "All edge cases handled exactly as tests expect"
    points: 2

# Anti-patterns to penalize (common over-engineering)
anti_patterns:
  - id: ADDED_MUTEX
    description: "Added sync.Mutex when tests don't require thread safety"
    penalty: 3

  - id: ADDED_CONTEXT
    description: "Added context.Context when tests don't use it"
    penalty: 2

  - id: ADDED_ERRORS
    description: "Changed returns to include error when tests don't check"
    penalty: 5

  - id: ADDED_LOGGING
    description: "Added logging/debugging code"
    penalty: 2

  - id: ADDED_PERSISTENCE
    description: "Added database/file storage"
    penalty: 5

  - id: ADDED_EVENTS
    description: "Added event/callback system"
    penalty: 3

  - id: ADDED_INTERFACES
    description: "Created interfaces for future extensibility"
    penalty: 3
