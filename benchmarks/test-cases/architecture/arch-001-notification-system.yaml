# Architecture Benchmark: ARCH-001
# Notification System Design

id: arch-001
name: Notification System Architecture
category: architecture
difficulty: medium
agent: architect

description: |
  Design a notification system for a SaaS application.
  Must handle multiple channels, user preferences, and scale.

instructions: |
  Design the architecture for a notification system with these requirements:

  Functional Requirements:
  - Send notifications via email, SMS, push, and in-app
  - Users can set preferences per channel and notification type
  - Support for immediate and scheduled notifications
  - Template-based messages with variable substitution
  - Delivery tracking and retry logic

  Non-Functional Requirements:
  - Handle 10,000 notifications per minute at peak
  - 99.9% delivery success rate
  - Notifications delivered within 30 seconds (immediate)
  - Audit trail for compliance

  Provide:
  1. High-level architecture diagram (describe components)
  2. Data models
  3. API design
  4. Key technical decisions with trade-offs

