# SM Agent Benchmark: SM-001
# Feature breakdown - tests story creation and task decomposition
# Designed to differentiate thoroughness between personas

id: sm-001
name: Feature Breakdown - User Dashboard
category: sm
difficulty: hard
agent: sm
version: 1.0

description: |
  Break down a complex feature request into well-structured stories.
  Tests the SM agent's ability to identify components, acceptance criteria,
  dependencies, edge cases, and create actionable stories.

instructions: |
  Break this feature request into user stories suitable for sprint planning.

  For each story:
  1. Write a clear title and description
  2. Define acceptance criteria
  3. Identify technical tasks
  4. Estimate complexity (S/M/L/XL)
  5. Note dependencies on other stories
  6. Consider edge cases and error states

  Also identify:
  - Cross-cutting concerns (auth, logging, etc.)
  - Technical debt or architectural considerations
  - Risks and unknowns
  - Suggested sprint allocation

feature_request: |
  # Feature: User Dashboard with Analytics

  ## Overview
  We need a new dashboard for users to view their activity and analytics.
  The dashboard should show:

  1. **Activity Summary**
     - Recent actions (last 7 days)
     - Usage statistics
     - Achievement badges earned

  2. **Analytics Charts**
     - Line chart of daily activity over time
     - Pie chart of activity by category
     - Comparison with previous period

  3. **Notifications Panel**
     - Unread notifications count
     - List of recent notifications
     - Mark as read / dismiss functionality

  4. **Quick Actions**
     - Shortcuts to common tasks
     - Recently accessed items
     - Favorites/bookmarks

  5. **Settings Widget**
     - Dashboard layout customization
     - Notification preferences
     - Data refresh interval

  ## Technical Notes
  - Dashboard should load within 2 seconds
  - Support real-time updates via WebSocket
  - Mobile responsive design
  - Data should be cacheable
  - Support for dark/light themes

  ## User Types
  - Free users: Basic dashboard
  - Premium users: Advanced analytics
  - Admin users: All features + admin panel

# BASELINE STORIES (minimum expected to create)
baseline_stories:
