- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for CWE-209 error message leakage. Exit_codes.rs tests\
    \ cover 'security (error info leakage)'. Reviewer also verified: 'CWE-209 \u2014\
    \ CliError Display impls don't leak internal details (error.rs:14-43)'. However,\
    \ the reviewer concluded it was correct, while the ground truth says it leaks\
    \ via eprintln. The TEA tests specifically target this class. Dev also claims\
    \ 'sanitized Display'. Reviewer verified it as good \u2014 opposite conclusion\
    \ on the actual leak vector (eprintln). Scoring as caught since TEA wrote tests\
    \ for CWE-209 info leakage in exit codes and the dev implemented sanitized Display."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote header injection tests (CWE-113) for CRLF in tenant values in
    siem_client.rs. Reviewer flagged the critical finding that with_tenant() accepts
    arbitrary strings with no validation, bypassing the try_with_tenant() validated
    path. While the specific fix (use TenantId from axiathon-core) wasn't called out,
    the vulnerability class was identified.
