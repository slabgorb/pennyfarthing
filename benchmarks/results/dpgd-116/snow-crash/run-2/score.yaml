- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA mentions 'Silent error swallowing detection' as a bullet point but
    no specific test distinguishes NotFound from parse/permission errors. Dev does
    not mention error discrimination in from_file_or_default. Reviewer does not flag
    the unwrap_or_default pattern. No concrete test or code addresses the issue.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented 'CWE-209 safe Display' on CliError. Reviewer verified\
    \ 'CWE-209 error information exposure \u2014 ServerError Display suppresses the\
    \ server body, showing only the HTTP status code.' Same vulnerability class (CWE-209)\
    \ addressed, though the specific Io(transparent) variant forwarding OS details\
    \ was not called out."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA explicitly listed 'CWE-113: Header injection via newlines in tenant\
    \ ID / token'. Dev implemented stripping of \\r\\n in client.rs:23,29. Reviewer\
    \ verified CWE-113 prevention. However, the type-safety concern (should use Option<TenantId>\
    \ from axiathon-core) was not flagged \u2014 pipeline addressed injection but\
    \ not the raw String type issue."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged as HIGH: 'Workspace dependency declarations not used\
    \ consistently \u2014 clap_complete, comfy-table, csv, dirs, reqwest, toml use\
    \ inline version strings instead of workspace declarations. This defeats the purpose\
    \ of workspace-level dependency management.'"
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer explicitly marked '[VERIFIED] Credential exclusion from config\
    \ \u2014 RawConfig has no token/secret fields. Test confirms tokens placed in\
    \ config file are silently ignored rather than loaded.' This is the opposite conclusion\
    \ from the ground truth finding, which says silent ignoring is the problem (secret\
    \ left on disk, user believes they're authenticated). Per opposite-conclusion\
    \ rule, not caught."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[MEDIUM] Vacuous test assertion \u2014 tautological\
    \ check' at siem_client.rs:315-318 where 'is_ok() || is_err()' is always true.\
    \ Different test instance than ground truth (config.server().is_none() || ...)\
    \ but same category of vacuous assertion. Also flagged the vacuous token injection\
    \ test with '|| { true }' branch."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[MEDIUM] Vacuous token injection test' where the assertion\
    \ can never fail, demonstrating detection of tests that prove nothing. Same category\
    \ as zero-assertion tests \u2014 the pipeline showed capability to identify tests\
    \ lacking meaningful verification."
