    \ the server body.' Same vulnerability class identified, though Io(transparent)\
    \ variant still leaks."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA lists 'CWE-113: Header injection via newlines in tenant ID / token'\
    \ as a security test in siem_client.rs. Dev implemented CRLF stripping in client.rs:23,29.\
    \ Reviewer verified CWE-113 prevention. However, the type-safety aspect (using\
    \ TenantId instead of raw String) was not flagged \u2014 only the injection vector\
    \ was addressed."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged as HIGH: 'Workspace dependency declarations not used\
    \ consistently \u2014 6 dependencies bypass workspace declarations: clap_complete,\
    \ comfy-table, csv, dirs, reqwest, toml. This defeats the purpose of workspace-level\
    \ dependency management.'"
