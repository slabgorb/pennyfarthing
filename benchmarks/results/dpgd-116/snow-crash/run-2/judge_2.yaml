- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA lists 'CWE-209: Server error display must not leak internal IPs/ports'\
    \ as a security test. Dev implemented CWE-209 safe Display on CliError. Reviewer\
