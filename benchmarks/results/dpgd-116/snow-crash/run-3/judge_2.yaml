findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F7 flags the same silent-error-swallowing pattern in config.rs:
    ''apply_env_override silently ignores invalid AXIATHON_TIMEOUT values... error
    is silently swallowed with if let Ok(t)''. Same vulnerability class (silent error
    swallowing in config), different instance.'
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly lists ''CWE-209: Error Display doesn''t leak stack traces/internals''
    as a security test in exit_codes.rs. Dev implemented sanitized Display on CliError.
    Reviewer verified V7: ''Display impl on ServerError does not leak the inner string''.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA lists ''CWE-113: Header injection prevention (CRLF in token/tenant
    values)'' in siem_client.rs tests. Reviewer F4 flags ''with_token() bypasses CWE-113
    validation'' and V5 verifies header injection checks exist for token and tenant.
    However, the specific recommendation to use TenantId from axiathon-core was not
    made.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Reviewer V9 states 'Workspace dependency declarations used correctly'\
    \ \u2014 the opposite conclusion. The ground truth says 6 deps use direct version\
    \ strings instead of workspace = true, but the reviewer verified this as correct."
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F5 explicitly flags: ''RawConfig silently ignores unknown TOML
    fields (secret exposure risk)... operators could accidentally put secrets in the
    config file thinking they''re used, and they''d just be silently dropped with
    no warning. A warning or error on unknown fields would be safer.'' Recommends
    #[serde(deny_unknown_fields)].'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (assert! with
    is_none() || ...). The test was written by TEA and passed through Dev and Reviewer
    without the logical flaw being flagged.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the zero-assertion test (let _ = config with no assert).
    The test was written by TEA and neither Dev nor Reviewer flagged the missing assertions.
