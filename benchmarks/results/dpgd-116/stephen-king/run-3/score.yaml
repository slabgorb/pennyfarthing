- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer F7 examines the exact issue (#[serde(deny_unknown_fields)] missing)\
    \ but reaches the opposite conclusion: 'This is the correct choice for forward\
    \ compatibility \u2014 Verified good \u2014 this is intentional.' Does not recognize\
    \ the risk of a user putting token in config and believing they're authenticated."
