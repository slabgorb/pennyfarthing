- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged the from_file_or_default swallowing all error types.
    The reviewer discussed RawConfig's unknown field handling but never addressed
    the unwrap_or_default() pattern that silently catches permission, parse, and I/O
    errors.
