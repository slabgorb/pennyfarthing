- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented CWE-209 safe Display on CliError: ServerError(String)\
    \ stores raw detail but #[error(\"server error\")] displays generic message. Reviewer\
    \ verified: 'Tests at security.rs:12-52 confirm internal paths, stack traces,\
    \ and SQL are never leaked via Display.' However, the ground truth is about stderr\
    \ printing via eprintln, and the pipeline did not flag that the main.rs dispatch\
    \ would print Display directly to stderr \u2014 they verified Display is safe\
    \ but missed that a user_message() sanitization layer is still needed."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged [LOW]: 'tenant flag is Option<String> \u2014 should\
    \ use TenantId newtype' citing rust.md rules. Also verified header injection prevention\
    \ via HeaderValue::from_str() rejecting CRLF, but noted the type-safety gap of\
    \ using raw String instead of TenantId from axiathon-core."
