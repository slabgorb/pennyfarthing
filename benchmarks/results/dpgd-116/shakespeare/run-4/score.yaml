- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Opposite conclusion. The reviewer explicitly marked '[VERIFIED] Error\
    \ message security (CWE-209) \u2014 error.rs:8-44 Error Display implementations\
    \ are concise and don't leak internal paths, stack traces, or permission details.'\
    \ TEA wrote CWE-209 tests focused on auth errors, but these passed without catching\
