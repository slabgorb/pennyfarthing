- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: dev
  evidence: Dev implemented CRLF sanitization in client.rs:39-42,47-51 and TEA wrote
    header injection tests. However, the type safety aspect (using raw String instead
    of TenantId from axiathon-core) was not flagged. The header injection vulnerability
    class was addressed via sanitization.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged as [HIGH]: ''these six dependencies are pinned directly
    in the crate Cargo.toml with hardcoded versions... The root Cargo.toml [workspace.dependencies]
    section is untouched. This violates the workspace dependency management architecture.'''
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: 'Reviewer noted RawConfig uses #[serde(flatten)] to silently swallow unknowns
    but did not flag the security implication of a token field being silently ignored
    with a secret left on disk. The reviewer''s fix suggestion (''assert the result
    is Ok and the known fields loaded correctly despite unknown keys'') validates
    the wrong behavior rather than recommending #[serde(deny_unknown_fields)] or a
    warning.'
