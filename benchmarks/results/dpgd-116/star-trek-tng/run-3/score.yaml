- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "No phase mentioned from_file_or_default swallowing all error types. The\
    \ reviewer flagged unknown TOML fields (I4) but that is a different issue \u2014\
    \ serde field handling vs file-loading error discrimination."
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA listed ''CWE-209: error messages must not leak internal paths/details''
    as a security test. Dev sanitized ServerError Display. However, the reviewer marked
    CWE-209 as ''[VERIFIED]'' based only on ServerError, missing the Io(#[error(transparent)])
    variant that still leaks. Credit given for TEA''s awareness of the vulnerability
    class per partial match rule 1.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote 'Header injection: CRLF in tenant ID and auth token rejected'\
    \ tests. Dev implemented CRLF checks in client.rs:56-72. Reviewer verified the\
    \ prevention. However, no phase flagged that tenant_id should use axiathon-core's\
    \ validated TenantId type instead of raw String \u2014 the runtime CRLF check\
    \ is a mitigation but not the type-safe fix. Credit given for same vulnerability\
    \ class (CWE-113)."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentioned that dependencies use direct version strings instead
    of workspace = true. The reviewer checked dependency isolation but not workspace
    dependency declaration style.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[MEDIUM] Unknown TOML fields silently ignored \u2014\
    \ at config.rs:15-22' and recommended #[serde(deny_unknown_fields)], explicitly\
    \ noting the risk of typos like 'sever_url' being silently discarded."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (is_none() ||
    ...) in any test. The reviewer did not examine test assertion quality for this
    pattern.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged the zero-assertion test that only checks for non-panic
    via 'let _ = config'. Despite SOUL.md principle 4 ('A vacuously true test is worse
    than no test'), this was not caught.
