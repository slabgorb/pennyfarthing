- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase addressed error discrimination in from_file_or_default. TEA config
    tests don't cover parse/permission error handling distinctly from NotFound. Dev
    presumably implemented unwrap_or_default(). Reviewer did not flag this pattern.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: Dev implemented InternalDetail wrapper type that suppresses sensitive
    info in Display (CWE-209). TEA wrote cli_security.rs with 9 tests covering 'CWE-209
    error exposure.' Reviewer verified 'CliError::Display does not leak InternalDetail
    strings to user-facing output' and also flagged ServerError variant leaking response
    body.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote header injection tests in cli_siem_client.rs and cli_security.rs
    covering CWE-113. Dev implemented CR/LF stripping in with_tenant and rejection
    in with_token. Same vulnerability class (CWE-113 header injection) addressed,
    though the type-safety fix (using TenantId from axiathon-core) was not adopted.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Reviewer explicitly verified 'All workspace dependencies properly declared'\
    \ \u2014 reaching the opposite conclusion from the ground truth. Six deps use\
