  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged vacuous tests: security.rs unknown fields test 'passes\
    \ regardless of whether unknown fields are rejected or accepted' and 'cli_error_is_not_copy\
    \ test is vacuous \u2014 function body is empty... it's a no-op.' Same category\
