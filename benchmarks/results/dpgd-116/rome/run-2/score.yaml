  evidence: "Reviewer flagged '[HIGH] Config silently accepts unknown fields' recommending\
    \ #[serde(deny_unknown_fields)], and '[MEDIUM] Config token field is parsed then\
    \ discarded \u2014 silent security hazard' noting the secret is loaded into memory\
    \ then discarded."
