- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that from_file_or_default uses unwrap_or_default() which
    swallows parse/permission errors. Config tests mention validation and env overrides
    but not error-type discrimination on file loading.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote security tests for ''CWE-209: Error messages don''t leak stack
    traces or internal paths''. Same vulnerability class (CWE-113 header injection
    was also tested). Reviewer verified ServerError Display sanitization but missed
    the Io(transparent) variant specifically.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for 'CWE-113: Header injection via CRLF in tenant ID,\
    \ token, and base URL'. Dev implemented sanitize_header_value() stripping CRLF.\
    \ Reviewer verified: 'CWE-113 \u2014 Header injection prevention is properly implemented.'\
    \ Same vulnerability class addressed via sanitization rather than type-safe TenantId."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
