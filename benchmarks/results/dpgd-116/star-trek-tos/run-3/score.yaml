- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote CWE-209 tests: ''Server error Display must not leak internal
    paths/stack traces'' in exit_codes.rs. Dev implemented Display impls described
    as ''fixed user-facing messages.'' Same vulnerability class (CWE-209) was identified
    and tested for, even if the Io(transparent) specific instance wasn''t fully prevented.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer explicitly flagged: ''The --tenant flag is Option<String> (raw,
    unvalidated) instead of using the TenantId newtype that axiathon-core provides
    with UUID validation. This contradicts the project''s Rust rules: Newtypes for
    IDs.'' TEA also wrote CWE-113 header injection tests for tenant ID with CRLF/null
    bytes.'
