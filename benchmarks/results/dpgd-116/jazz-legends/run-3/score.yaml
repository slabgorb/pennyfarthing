- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: true
  caught_by: tea
  evidence: 'TEA security tests explicitly cover ''Silent error swallowing: Config
    parse errors must not be silently ignored''. Dev then implemented config loading
    that passes this test, meaning the swallowing behavior was addressed.'
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented ''credential-sanitizing Display impl'' on CliError. TEA
    wrote CWE-209 security tests. Reviewer flagged finding #7 that NotFound and Config
    variants inconsistently skip sanitize_message(), demonstrating awareness of the
    leak class even if incomplete.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote security tests for ''Header injection: CRLF and null bytes
    in tenant IDs and tokens''. Dev implemented CR/LF/null sanitization in client.rs:16-19.
    Reviewer verified at finding #9. The CWE-113 vulnerability class was caught, though
    the type-safety fix (using TenantId) was not adopted.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged the use of direct version strings instead of workspace
    = true for the 6 dependencies. Reviewer noted version mismatches (dirs 5 vs 6,
    toml 0.8 vs 0.9) but not the workspace inheritance issue.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented ''#[serde(deny_unknown_fields)]'' on ClientConfig (config.rs:11).
    Reviewer verified this at finding #11: ''Unknown TOML keys cause parse errors
    rather than silent acceptance. Good defense against typo-based misconfig.'''
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (assert!(config.server().is_none()
    || ...)). TEA wrote config_loading tests but did not flag or prevent this logical
    flaw. The test likely originated from TEA's own stubs.
- finding_id: I6
