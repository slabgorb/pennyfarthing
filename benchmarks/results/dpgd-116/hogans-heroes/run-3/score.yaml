- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer verified CWE-209: 'ServerError Display is \"server returned\
    \ an error\" \u2014 the inner string is not exposed to users via Display.' TEA\
    \ also wrote cli_security.rs tests for CWE-209. However, the ground truth is about\
    \ CliError Display leaking via eprintln, not ServerError. The reviewer marked\
    \ CWE-209 as VERIFIED without catching that CliError's Io(transparent) variant\
    \ leaks OS details to stderr. They examined the area but reached a partial conclusion\
    \ \u2014 they caught the class but missed this specific instance."
