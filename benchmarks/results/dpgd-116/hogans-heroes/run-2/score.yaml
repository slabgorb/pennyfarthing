findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer F3 flags that explicitly-specified config paths silently fall
    back to defaults, which is adjacent but not the same issue. C1 is about from_file_or_default
    swallowing ALL errors (parse, permission, etc.) even for the default path. The
    reviewer only addresses the explicit-path case, not the general error-swallowing
    pattern. No test or code fix addresses distinguishing NotFound from other errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented CWE-209 safe Display on CliError with generic messages.
    Reviewer V2 verified: ''CliError Display impls use generic messages and do NOT
    echo inner String payloads for server-sourced errors. The SECURITY comment is
    present.'' TEA also wrote security tests at security.rs:17-33.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection prevention tests in security.rs. Dev implemented\
    \ validate_header_value() at client.rs:84-91 rejecting CRLF and null bytes in\
    \ tenant ID. Reviewer V1 verified. However, the specific issue of using raw String\
    \ instead of TenantId from axiathon-core was not flagged \u2014 the pipeline caught\
    \ the injection symptom but not the type-safety root cause. Still counts as same\
    \ vulnerability class (CWE-113)."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that dependencies use direct version strings instead
    of workspace = true. Reviewer V7 verified 'Workspace dependencies are declared
    centrally' but did not catch that 6 deps bypass this with direct versions.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F4 explicitly flags: ''ConfigFile derives Deserialize without
    #[serde(deny_unknown_fields)]. Writing token = "should-be-ignored" in the config
    file is silently accepted. Typos like servel_url instead of server_url are silently
    ignored.'''
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F7 flags vacuous test assertions including 'config_loading.rs:219-222:\
    \ assert!(config.is_ok() || config.is_err()) \u2014 always true, asserts nothing\
    \ meaningful'. Same category of vacuously true assertions."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F7 flags vacuous test assertions: 'exit_codes.rs:16-17: assert_eq!(0i32,\
