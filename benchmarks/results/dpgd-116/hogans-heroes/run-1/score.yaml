  evidence: 'Reviewer flagged ''[HIGH] RawConfig silently ignores unknown fields (including
    [auth] token = "...")'' noting that operators may believe their token is being
    used when it''s silently ignored, and recommending #[serde(deny_unknown_fields)]
    or warning on unknown sections.'
