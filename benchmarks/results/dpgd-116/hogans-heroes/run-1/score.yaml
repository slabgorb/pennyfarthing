    \ TenantId from axiathon-core was not called out."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[HIGH] Workspace dependency declarations missing for
    6 crates' noting that reqwest, comfy-table, clap_complete, dirs, csv, toml are
    declared directly instead of using workspace declarations, violating the workspace
    pattern and creating version drift risk.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
