- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[HIGH] with_tenant() and with_token() bypass header\
    \ validation \u2014 only try_with_* validates' noting header injection (CWE-113)\
    \ risk. TEA also wrote header injection prevention tests for CRLF/CR/LF/null bytes\
