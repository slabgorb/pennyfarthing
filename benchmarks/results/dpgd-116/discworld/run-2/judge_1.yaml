- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #9: 'Raw String for tenant ID instead of TenantId newtype\
    \ at cli.rs:35, client.rs:10 \u2014 Rust rules require newtypes for IDs. axiathon-core\
    \ exports TenantId. The CLI --tenant flag and SiemClient.tenant both use raw String,\
    \ losing type safety.'"
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #4: 'Workspace dependency declarations missing \u2014\
    \ The story explicitly says to add reqwest, comfy-table, keyring, clap_complete,\
