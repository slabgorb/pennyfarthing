- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F7: ''No #[serde(deny_unknown_fields)]. A config file with a
    typo like [sever] is silently ignored.'' Reviewer F11: ''token field is deserialized
    from TOML but intentionally not used... should emit a warning telling the user
    to move their token to the keychain.'' Together these cover the silent token ignore
    finding.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F8 flagged the same category: ''if let Ok(config) = result...
    if the function returns Err, the test silently passes. This is the correct behavior
    today but the assertion is a no-op.'' Same pattern of vacuously true test assertions,
    different instance.'
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F3 flagged same category: ''stub handler tests construct the
    error themselves and verify their own construction. This is a tautology. It would
    pass even if the status command segfaulted, because the test never invokes the
    command.'' Demonstrates detection of tests without meaningful assertions.'
