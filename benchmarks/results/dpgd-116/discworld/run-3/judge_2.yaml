- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase distinguished NotFound from other error types in from_file_or_default.
    The config_loading tests cover TOML parse failures but don't test that permission
    errors or parse errors propagate rather than falling back to defaults.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote security tests for 'CWE-209: Error messages must not leak internal\
    \ paths/details'. Dev implemented Display sanitization. Reviewer verified: 'CWE-209:\
    \ CliError::Display sanitizes output \u2014 ServerError Display doesn't expose\
    \ internal message at error.rs:50'. However, the ground truth notes stderr still\
    \ prints via eprintln!(\"error: {e}\") \u2014 the reviewer verified Display sanitization\
    \ but didn't flag the stderr propagation path specifically."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged as [MEDIUM]: ''tenant field is raw String, not TenantId
    newtype... axiathon-core exports TenantId. Both cli.rs:27 and client.rs:7 use
    raw strings. This defeats the type safety the project invested in building.'''
