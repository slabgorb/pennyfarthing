- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged the same config test as having 'zero assertions' that
    'would pass regardless of behavior.' Same category as I6's zero-assertion test
