- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default swallowing all error types. Reviewer
    flagged silent error swallowing in formatters (unwrap_or_default in JsonFormatter,
    CsvFormatter) but never mentioned the config loading fallback that collapses permission/parse
    errors into defaults.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly listed ''CWE-209: Error messages don''t leak file paths,
    connection strings, or stack traces'' in security_test.rs (11 tests). Same vulnerability
    class as the ground truth finding about CliError Display leaking internal details.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''CWE-113: Header injection prevention (newlines,
    null bytes in tokens/tenant IDs)'' in both security_test.rs and siem_client_test.rs.
    Same vulnerability class (CWE-113) as the ground truth, though the pipeline tested
    for injection characters rather than flagging the raw String vs TenantId type
    issue.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentioned workspace dependency consistency. The reviewer checked
