- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for 'Header injection: CRLF in tenant ID and auth tokens\
    \ must be rejected' (CWE-113). Dev implemented CRLF sanitization in client.rs.\
    \ However, the pipeline did not flag the use of raw String instead of TenantId\
    \ from axiathon-core \u2014 they caught the injection vector but not the type-safety\
    \ bypass. Same vulnerability class (CWE-113) per partial match rule 1."
  votes: 3/3
