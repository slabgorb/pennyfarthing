- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer MEDIUM finding: 'ClientConfig silently ignores unknown TOML\
    \ fields (no deny_unknown_fields)... An operator who adds token = \"secret\" to\
    \ their config file gets no error, no warning \u2014 it's silently dropped...\
    \ Should use #[serde(deny_unknown_fields)] to fail loudly.'"
  votes: 3/3
