- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote header injection tests: ''CRLF in tenant ID and auth tokens
    must be rejected.'' Dev implemented CRLF sanitization in client.rs:24-41. Reviewer
