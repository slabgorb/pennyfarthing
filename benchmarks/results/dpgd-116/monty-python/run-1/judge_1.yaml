- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly listed ''CWE-209: Error display must not leak server internals
    or token details'' as a security test. Reviewer F10 also flagged ConfigError Display
    leaking raw config content, same vulnerability class.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA included 'CWE-113: Header injection via CR/LF in tenant ID and auth\
    \ token'. Dev implemented CR/LF stripping in with_token and with_tenant. Reviewer\
    \ verified. However, the specific finding about using raw String instead of TenantId\
    \ from axiathon-core was not flagged \u2014 the pipeline mitigated the symptom\
    \ (injection) but not the root cause (type safety bypass)."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that 6 dependencies use direct version strings instead
    of workspace = true. The reviewer noted a toml version mismatch (F5) but never
    addressed the workspace inheritance pattern.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F7 flagged exactly this: ''RawConfig silently ignores unknown
    fields including token... a token = "secret" field in cli.toml is silently eaten
    by serde... giving users a false sense that it''s being used. A warning should
    be emitted, or unknown fields should be explicitly handled.'''
