- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA security.rs covers 'CWE-113 header injection' and siem_client.rs tests
    cover 'header injection via newline chars in tenant ID/token'. Same vulnerability
    class identified, though the type-safety fix (using TenantId) was not suggested.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Reviewer marked '[VERIFIED] Workspace dependencies correctly declared\
    \ in root Cargo.toml:52-58' but this only confirms the root declarations exist\
    \ \u2014 it does not check that the crate's Cargo.toml uses workspace = true.\
    \ The 6 direct version strings were not flagged."
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer explicitly flagged: 'RawConfig uses #[derive(Deserialize)] with\
    \ deny_unknown_fields absent \u2014 unknown fields silently ignored... A TOML\
    \ file with token = \"secret\" is silently accepted without error... Consider\
    \ #[serde(deny_unknown_fields)]'."
