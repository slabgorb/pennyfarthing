- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA's security.rs mentions 'silent error swallowing' but this likely refers
    to HTTP non-2xx responses per the SiemClient context. No phase specifically flagged
    from_file_or_default using unwrap_or_default() to swallow parse/permission errors.
    The reviewer's config finding was about unknown fields, not error-type discrimination.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA's security.rs includes 12 tests covering 'CWE-209 error exposure'\
    \ \u2014 same vulnerability class as the ground truth finding about CliError Display\
    \ leaking internal details."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA's security.rs and siem_client.rs cover 'CWE-113 header injection'
    and 'header injection via newline chars in tenant ID/token.' Same vulnerability
    class. Dev implemented CRLF validation. However, neither phase flagged the type-safety
    gap of using raw String instead of TenantId from axiathon-core.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Reviewer stated 'VERIFIED: Workspace dependencies correctly declared\
    \ in root Cargo.toml:52-58' \u2014 this checks root declarations exist but doesn't\
    \ flag that 6 crate-level deps use direct version strings instead of workspace\
    \ = true. The verification missed the actual issue."
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged [HIGH]: 'RawConfig uses #[derive(Deserialize)] with\
    \ deny_unknown_fields absent \u2014 unknown fields silently ignored... A TOML\
    \ file with token = \"secret\" is silently accepted without error... Consider\
    \ #[serde(deny_unknown_fields)]'"
- finding_id: I5
