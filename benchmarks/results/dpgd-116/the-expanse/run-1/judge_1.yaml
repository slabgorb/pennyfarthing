- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #7: 'with_tenant() and with_token() bypass validation\
    \ \u2014 validated variants are separate methods... Nothing prevents callers from\
    \ using the unvalidated path, making header injection prevention opt-in rather\
    \ than default-safe.' TEA also wrote header injection tests for CWE-113, and dev\
    \ implemented validation, but the reviewer correctly identified the design flaw\
    \ of raw String acceptance."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: dev
  evidence: "Reviewer verified: 'Workspace dependency declarations correct \u2014\
    \ all deps use { workspace = true }'. The dev implemented workspace dependencies\
    \ correctly, avoiding the version drift issue."
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #4: 'RawConfig silently ignores unknown fields \u2014\
    \ no #[serde(deny_unknown_fields)]... the config_does_not_store_tokens test actually\
    \ proves this \u2014 a token field is silently ignored rather than rejected. The\
    \ real security posture should warn the user that they're putting secrets in a\
    \ config file, not silently eat them.'"
