- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev explicitly implemented CWE-209 sanitization: 'CliError::Display sanitizes\
    \ internal details (CWE-209) - generic messages for Internal, ServerError, NotFound'.\
    \ TEA wrote security tests for CWE-209. Reviewer verified: 'Internal(String) displays\
