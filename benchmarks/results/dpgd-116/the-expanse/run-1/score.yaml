- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase identified that from_file_or_default swallows all errors including
    parse/permission failures. The reviewer flagged silent env var handling (finding
    5) but not the from_file fallback. The TEA security tests mention 'silent errors'
    generically but no specific test for distinguishing NotFound from parse/permission
    errors was described.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented CWE-209 mitigation: 'CliError::Display sanitizes internal\
    \ details (CWE-209) - generic messages for Internal, ServerError, NotFound'. TEA\
    \ wrote security tests for CWE-209. Reviewer verified it. However, the Io(#[error(transparent)])\
    \ variant was not specifically called out as still leaking \u2014 partial mitigation\
    \ of the same vulnerability class."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding 7: 'with_tenant() and with_token() bypass validation\
    \ \u2014 validated variants are separate methods. Nothing prevents callers from\
    \ using the unvalidated path, making header injection prevention opt-in rather\
    \ than default-safe.' TEA also wrote header injection tests (CWE-113) in siem_client_test.rs\
    \ and security_test.rs."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: dev
  evidence: "Reviewer finding 12: 'VERIFIED: Workspace dependency declarations correct\
    \ \u2014 all deps use { workspace = true }'. Dev implemented workspace dependencies\
    \ correctly."
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding 4: 'RawConfig silently ignores unknown fields \u2014\
    \ no #[serde(deny_unknown_fields)]' and 'The config_does_not_store_tokens test\
    \ at config_test.rs:125 actually proves this \u2014 a token field is silently\
    \ ignored rather than rejected. The real security posture should warn the user\
    \ that they're putting secrets in a config file, not silently eat them.'"
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding 8 flags a vacuous test ('exit_code_success_is_zero test\
    \ is vacuous \u2014 assert_eq!(0_i32, 0)'). Same category (vacuous/tautological\
    \ assertion) in a different test file. Per partial match rules, same category\
    \ in adjacent location counts as caught."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
