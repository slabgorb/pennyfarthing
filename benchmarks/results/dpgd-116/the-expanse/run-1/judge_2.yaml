findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: 'No test or code specifically distinguishes NotFound from other error
    types in from_file_or_default. The reviewer flagged silent unknown fields (Finding
    #4) but not the error-swallowing in config loading.'
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented CWE-209 sanitization: 'CliError::Display sanitizes internal\
    \ details (CWE-209) - generic messages for Internal, ServerError, NotFound'. Reviewer\
    \ verified: 'CWE-209 error Display messages sanitized \u2014 Internal(String)\
    \ displays \"An internal error occurred\", not the inner string'. However, the\
    \ ground truth notes stderr still leaks via eprintln!(\"error: {e}\") and needs\
    \ a user_message() method. The pipeline caught the Display sanitization but not\
    \ the stderr leakage path specifically. Scoring as caught since the same vulnerability\
    \ class was addressed."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection tests in siem_client_test.rs and security_test.rs\
    \ covering CWE-113. Dev implemented CR/LF/null validation. However, the ground\
    \ truth issue is that tenant_id uses raw String instead of TenantId from axiathon-core.\
    \ The reviewer flagged this as Finding #7: 'with_tenant() bypasses validation\
    \ \u2014 validated variants are separate methods... Nothing prevents callers from\
    \ using the unvalidated path, making header injection prevention opt-in rather\
    \ than default-safe.' This catches the same concern."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Reviewer verified (#12): 'Workspace dependency declarations correct \u2014\
    \ all deps use { workspace = true }'. However, the TEA summary says 'Added workspace\
    \ dependencies (clap_complete, comfy-table, csv, dirs, reqwest, toml)'. The reviewer\
    \ concluded workspace deps are correct, but the ground truth says 6 deps use direct\
    \ version strings instead of workspace = true. The reviewer reached the opposite\
    \ conclusion, so this is not caught."
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer Finding #4: 'RawConfig silently ignores unknown fields \u2014\
    \ no #[serde(deny_unknown_fields)]... A user typing api_irl instead of api_url\
    \ gets zero feedback. The config_does_not_store_tokens test actually proves this\
    \ \u2014 a token field is silently ignored rather than rejected... the real security\
    \ posture should warn the user that they're putting secrets in a config file,\
    \ not silently eat them.'"
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer Finding #8 flags a vacuous test: 'exit_code_success_is_zero\
    \ test is vacuous \u2014 assert_eq!(0_i32, 0)... It tests nothing about the actual\
    \ code. It's a tautology masquerading as a test.' This is the same category (vacuously\
    \ true test) but a different instance than the ground truth's config test with\
    \ None || true. Scoring as caught per partial match rule #2."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: The ground truth describes a test with zero assertions using 'let _ =
    config;'. The reviewer flagged a different vacuous test (exit_code_success_is_zero)
    but did not flag the zero-assertion config test. No phase identified the specific
    no-assertion default config test.
