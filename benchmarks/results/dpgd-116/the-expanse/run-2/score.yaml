- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged [MEDIUM] CWE-209: ServerError passes through arbitrary
    strings with no sanitization at error.rs:8-9, noting the test is vacuous and attacker-controlled
    5xx response body would be printed verbatim. TEA also listed CWE-209 coverage
    in exit_codes.rs and security.rs.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged [MEDIUM] --tenant accepts raw String instead of validated
    TenantId at cli.rs:29, stating axiathon-core has a TenantId type that should be
    used. TEA also wrote header injection prevention tests for CRLF/null in siem_client.rs.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Reviewer marked [VERIFIED] Workspace dependencies properly declared \u2014\
    \ Cargo.toml uses workspace refs for all deps. This is the opposite conclusion\
    \ from the ground truth, which identifies 6 deps using direct version strings.\
    \ Reviewer examined the area and concluded it was correct."
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged [MEDIUM] Config silently accepts unknown fields \u2014\
    \ no #[serde(deny_unknown_fields)] at config.rs:8, noting typos would silently\
    \ use defaults. This encompasses the token field issue since deny_unknown_fields\
    \ would force explicit handling of any token field in config."
- finding_id: I5
