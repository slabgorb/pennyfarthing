- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that from_file_or_default uses unwrap_or_default() which
    swallows parse errors, permission failures, etc. The reviewer verified token exclusion
    and flagged deny_unknown_fields, but never identified the overly broad error swallowing
    in from_file_or_default.
