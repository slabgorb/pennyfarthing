- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA listed 'Token in config file: must be rejected (tokens belong in\
    \ OS keychain)' as a security test and wrote config_loading tests for it. However,\
    \ the implementation silently returns None rather than warning/errecting, and\
    \ the reviewer marked '[VERIFIED] Token never loaded from config file' as correct\
    \ \u2014 missing the silent-ignore-secret-on-disk concern."
