- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer verified CWE-209 as handled ('ServerError displays server error\
    \ \u2014 internal details not exposed via Display') but missed that Io(#[error(transparent)])\
    \ forwards full OS error details. The Io variant leak was not flagged by any phase."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection (CRLF) tests in siem_client.rs and security.rs\
    \ covering CWE-113. Dev implemented sanitize_header_value rejecting \\r and \\\
    n. Reviewer verified: 'Header injection (CWE-113) \u2014 properly mitigated at\
    \ client.rs:15-21.' Same vulnerability class addressed via runtime sanitization\
    \ rather than type-level TenantId."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged the use of direct version strings instead of workspace
    = true. The reviewer noted the edition mismatch in Cargo.toml but not the dependency
    declaration style.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer explicitly flagged: '[HIGH] ConfigFile does not use #[serde(deny_unknown_fields)]\
    \ \u2014 unknown fields silently accepted... if someone adds token = \"secret\"\
    \ to the config file, it's silently parsed and ignored rather than rejected with\
    \ a security warning.'"
