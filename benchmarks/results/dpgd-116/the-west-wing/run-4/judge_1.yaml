- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: The security.rs tests include a test about 'silent error swallowing' but
    the Dev implemented from_file_or_default with unwrap_or_default() (config.rs),
    and the Reviewer did not flag this specific issue. The Reviewer flagged missing
    deny_unknown_fields but not the error-swallowing pattern in from_file_or_default.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented sanitized Display for ServerError and NotFound in error.rs:17-21,\
    \ showing generic messages rather than internal details. Reviewer verified: 'ServerError\
    \ displays \"server error\" \u2014 internal details stored in the tuple field\
    \ are not exposed via Display.' TEA also wrote tests for CWE-209 in security.rs."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for header injection (CRLF) in siem_client.rs and security.rs.\
    \ Dev implemented sanitize_header_value in client.rs:15-21 rejecting \\r and \\\
    n. However, tenant_id is still a raw String rather than using TenantId from axiathon-core\
    \ \u2014 the CRLF sanitization mitigates CWE-113 but doesn't use the type-safe\
    \ TenantId. The core issue of using raw String instead of validated TenantId was\
    \ not caught."
