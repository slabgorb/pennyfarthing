- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase distinguished NotFound from other errors in from_file_or_default.
    TEA mentioned 'silent error swallowing' generically for stubs but did not write
    a test for config loading distinguishing error types. Dev implemented the swallowing
    pattern. Reviewer did not flag it.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA explicitly listed 'CWE-209: Error display must not leak server internals,\
    \ stack traces, or file paths' as security coverage. Dev implemented safe Display\
    \ on ServerError. Reviewer verified '[VERIFIED] CWE-209 \u2014 ServerError Display\
    \ hides internal details'. Same vulnerability class addressed, though the Io(transparent)\
    \ variant specifically was not called out."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged as [MEDIUM]: ''tenant field uses raw Option<String>
    instead of TenantId newtype'' at cli.rs:19, recommended ''Use TenantId newtype
    from axiathon-core for the --tenant flag''. TEA also wrote CWE-113 header injection
    tests for tenant ID with CRLF characters.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
