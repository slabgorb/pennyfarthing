- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged as [HIGH]: ''RawConfig silently accepts and discards
    unknown fields via _ignored: IgnoredAny'' and explicitly noted the security concern:
    ''A user who typos server_url... will silently get defaults'' and ''users might
    believe their token is being read from the file when it isn''t.'''
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
