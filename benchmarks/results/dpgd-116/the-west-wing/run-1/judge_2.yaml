- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote CWE-209 security tests: 'Error information disclosure (CWE-209)\
    \ \u2014 server paths/stack traces not exposed' in exit_codes.rs. Dev implemented\
    \ ServerError display that omits internal details. Same vulnerability class was\
    \ identified and tested, though the specific Io(transparent) variant was not called\
    \ out."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote 'Header injection prevention (CWE-113) \u2014 newlines in token/tenant\
    \ rejected' tests in siem_client.rs. Reviewer verified try_with_tenant rejects\
    \ CRLF. However, the specific issue of using raw String instead of TenantId type\
    \ was not flagged \u2014 only the injection vector was addressed, not the type-safety\
    \ gap."
