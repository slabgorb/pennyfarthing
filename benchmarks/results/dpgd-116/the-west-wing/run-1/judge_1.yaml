- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase addressed the from_file_or_default swallowing all errors. The
    config_loading tests and config.rs implementation are mentioned but there's no
    evidence that NotFound was distinguished from parse/permission errors. The reviewer
    flagged silent acceptance of unknown fields (I4) but not the error-swallowing
    in from_file_or_default.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA included 'Error information disclosure (CWE-209) \u2014 server paths/stack\
    \ traces not exposed' as a security test. Exit_codes.rs tests include 'CWE-209\
    \ security' coverage. Reviewer verified: 'CWE-209 mitigation: ServerError display\
    \ omits internal details at error.rs:27'. However, the specific stderr leakage\
    \ via eprintln was not flagged \u2014 the pipeline addressed CWE-209 in the Display\
    \ impl but not the eprintln path. Scoring as caught since same vulnerability class\
    \ was identified and mitigated."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection prevention tests (CWE-113) for tenant values.\
    \ siem_client.rs tests include 'header injection' coverage. Reviewer noted '[HIGH]\
    \ with_token() bypasses header injection validation' and verified 'try_with_tenant\
    \ reject \\r\\n'. However, the specific finding about using raw String instead\
    \ of TenantId from axiathon-core was not flagged \u2014 the pipeline tested for\
    \ CRLF injection but not the type-safety gap. Scoring as caught since CWE-113\
    \ was identified and partially mitigated via try_with_tenant validation."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[MEDIUM] Dependencies not using workspace declarations'
    at crates/axiathon-client/Cargo.toml:16-25, listing clap_complete, comfy-table,
    csv, dirs, keyring, reqwest, toml as using inline versions instead of workspace
    = true.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[MEDIUM] RawConfig silently accepts unknown fields\
    \ including secrets' \u2014 noting no #[serde(deny_unknown_fields)] and that an\
    \ operator writing token = \"my-secret\" gets zero feedback. Also noted the test\
    \ 'config_file_with_token_field_is_rejected_or_ignored' masks this gap by accepting\
    \ both behaviors."
- finding_id: I5
