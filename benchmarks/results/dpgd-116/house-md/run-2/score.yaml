    \ Display on Io variant was not flagged. The pipeline demonstrated awareness of\
    \ CWE-209 as a class but verified the code as correct on the sanitization front.\
    \ Scoring as caught since TEA wrote tests for CWE-209 error exposure and the reviewer\
    \ examined the same vulnerability class."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for CWE-113 header injection in siem_client.rs and security.rs.\
    \ Dev implemented CRLF validation. However, the specific finding is that tenant_id\
