- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer verified 'CWE-209 error display sanitization \u2014 ServerError\
    \ and NotFound do not leak internal strings.' TEA also wrote security tests for\
