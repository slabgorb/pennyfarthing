- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: The reviewer flagged validate() silently replacing invalid values and
    create_dir_all error being dropped, but never identified from_file_or_default
    using unwrap_or_default() to swallow parse/permission/IO errors. The specific
    pattern of distinguishing NotFound from other error types was not addressed by
    any phase.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA explicitly listed 'CWE-209: Error Display doesn't leak internal file\
    \ paths' as a security test. Reviewer also flagged 'NotFound stores full URL \u2014\
    \ CWE-209 adjacent' as HIGH. Same vulnerability class identified."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA listed 'CWE-113: Header injection via newlines in tenant ID and token'\
    \ as a security test. Dev implemented HeaderValue::from_str() rejection of CRLF.\
    \ Reviewer verified CWE-113 prevention. Same vulnerability class caught, though\
    \ the type-safety improvement (using TenantId instead of raw String) was not flagged\
    \ \u2014 reviewer even noted axiathon-core dependency is declared but unused."
