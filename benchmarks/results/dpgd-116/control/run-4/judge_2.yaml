- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No test or code distinguishes NotFound from other errors in from_file_or_default.
    The config loading code uses unwrap_or_default() pattern and no phase flagged
    the silent swallowing of parse/permission errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote security tests for CWE-209: 'Error messages don't leak connection\
    \ strings, passwords, or internal details.' Dev implemented sanitized Display\
    \ impls (error.rs:40-54). Reviewer verified: '[VERIFIED] CWE-209 error exposure\
    \ \u2014 properly handled.' However, the specific issue is that eprintln!('error:\
    \ {e}') still prints Display to stderr \u2014 the pipeline addressed the Display\
    \ content but not the stderr leakage vector. Still, same vulnerability class (CWE-209)\
    \ was caught."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote security tests for CWE-113 header injection via newline in\
    \ tenant ID. Dev implemented newline rejection in SiemClient::with_tenant (client.rs:59).\
    \ However, the specific finding is about using raw String instead of validated\
    \ TenantId from axiathon-core \u2014 the pipeline caught the injection vector\
    \ but not the type-safety gap. Reviewer even noted axiathon-core dependency is\
    \ declared but unused. Partial catch \u2014 same vulnerability class addressed."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that dependencies use direct version strings instead
    of workspace = true. The reviewer noted a toml version mismatch but did not flag
    the broader pattern of 6 deps bypassing workspace declarations.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
