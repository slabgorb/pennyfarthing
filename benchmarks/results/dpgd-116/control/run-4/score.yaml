    vector wasn''t called out.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote CWE-113 header injection tests for tenant ID. Dev implemented\
    \ newline rejection in SiemClient::with_tenant (client.rs:59). Reviewer verified:\
    \ 'CWE-113 header injection prevention \u2014 properly handled.' However, the\
    \ specific finding about using raw String instead of TenantId from axiathon-core\
    \ was NOT caught \u2014 reviewer even noted axiathon-core dependency is declared\
    \ but unused (observation 8) without connecting it to tenant type safety. Partial\
    \ credit: the injection vector is mitigated but the type-safety gap (using String\
    \ instead of TenantId) was not flagged."
