    The pattern was implemented by dev and not questioned by reviewer.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "TEA wrote CWE-209 tests and dev implemented sanitized Display for ServerError/ConfigError/NotFound,\
    \ but the Io(#[error(transparent)]) variant was missed. Reviewer explicitly marked\
    \ CWE-209 as '[VERIFIED] correct' \u2014 opposite conclusion rule applies: examining\
    \ the code and concluding it is correct when the vulnerability exists means not\
    \ caught."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[HIGH] SiemClient::new silently drops invalid headers\
    \ \u2014 tenant isolation can be silently bypassed' and noted 'A malformed tenant\
    \ ID produces requests without tenant isolation \u2014 no X-Tenant-ID header,\
    \ no error, no warning.' Same vulnerability class (unsafe tenant ID handling enabling\
    \ bypass)."
