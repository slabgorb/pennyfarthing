- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer finding #4 [MEDIUM]: ''RawConfig uses default serde behavior
    (ignore unknown fields)... no #[serde(deny_unknown_fields)] to catch typos in
    other fields. This is a usability trap for operators.'' This is the same fix the
    ground truth recommends. However, the reviewer also marked token exclusion as
    ''[VERIFIED]... Good,'' reaching the opposite conclusion on the token-specific
    aspect.'
