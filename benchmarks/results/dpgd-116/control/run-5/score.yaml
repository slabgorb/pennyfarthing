- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for 'Header injection: tenant ID and token with \\r\\\
    n must be rejected/sanitized.' Dev implemented CRLF stripping in client.rs:45,52.\
    \ Reviewer observation #11 explicitly flagged 'tenant field is Option<String>\
    \ not TenantId \u2014 cli.rs:22' and stated 'the CLI should validate and convert\
    \ to TenantId at the boundary.'"
