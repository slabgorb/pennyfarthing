- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flags from_file_or_default swallowing all errors. Config loading
    tests cover happy paths and defaults but never test error discrimination between
    NotFound and parse/permission errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented sanitized Display for ServerError showing ''server error:
    please try again later'' regardless of internal string. TEA wrote CWE-209 security
    tests. Reviewer verified CWE-209 sanitization. Same vulnerability class (CWE-209)
    caught, though the Io(transparent) variant specifically leaking OS details was
    not flagged.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection prevention tests covering CWE-113. Dev implemented\
    \ newline rejection in with_tenant(). Reviewer verified header injection defense.\
    \ However, no phase flagged that tenant_id should use TenantId from axiathon-core\
    \ instead of raw String \u2014 the type safety gap was missed, but the vulnerability\
    \ class was caught."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentions direct version strings vs workspace = true. The Cargo.toml
    changes show deps added but no reviewer or dev flagged the workspace dependency
    convention violation.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer finding #4 flags ''[MEDIUM] RawConfig silently accepts unknown
    fields'' and recommends #[serde(deny_unknown_fields)]. This is the same fix needed
    for I4. However, the reviewer separately marked token exclusion as ''[VERIFIED]''
    without recognizing the usability trap of silent ignore.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (assert!(config.server().is_none()
    || ...)) where the first branch always being true makes the OR always pass.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
