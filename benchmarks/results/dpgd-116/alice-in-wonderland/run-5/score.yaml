findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA's 'silent error swallowing' security test targets connection failures,
    not config parse/permission errors. Reviewer didn't flag from_file_or_default's
    unwrap_or_default() swallowing all error types. Dev implemented the pattern without
    distinguishing NotFound from other errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: Dev implemented sanitized Display for ServerError (generic message, not
    inner string). TEA wrote CWE-209 tests at security.rs. Reviewer verified 'CWE-209
    error sanitization is correct' at error.rs:47. Same vulnerability class addressed,
    though the Io(transparent) variant specifically was missed.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote CRLF header injection tests in security.rs:48-66. Dev implemented
    with_tenant_validated() rejecting \r and \n at client.rs:49-83. Reviewer verified
    CRLF prevention works and flagged that with_token() bypasses validation. Type-safety
    aspect (using TenantId from axiathon-core) not caught, but same CWE-113 vulnerability
    class addressed.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged dependencies using direct version strings instead of
    workspace = true. Reviewer did not mention this in their 11 findings.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
