- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: Dev implemented sanitized Display for ServerError (error.rs:47 outputs
    generic message). TEA wrote CWE-209 test at security.rs:18 confirming internal
    IPs/ports don't leak. Reviewer verified CWE-209 sanitization correct. Same vulnerability
    class addressed, though Io(transparent) variant not specifically flagged.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote CRLF header injection tests in security.rs:48-66. Dev implemented\
    \ with_tenant_validated() and with_token_validated() with \\r\\n rejection at\
    \ client.rs:49-83. Reviewer verified CRLF prevention works and flagged that with_token()/with_tenant()\
    \ bypass validation (MEDIUM finding). However, the type-safety fix (using TenantId\
    \ from axiathon-core) was not adopted \u2014 runtime validation used instead."
