- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer flagged silent env override swallowing and unknown serde fields,
    but never identified from_file_or_default using unwrap_or_default() to swallow
    parse/permission/IO errors. Different error-swallowing instances.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote security tests demanding 'No server stack traces in Display
    output' (CWE-209). Dev implemented sanitized Display. Reviewer verified 'CliError
    Display impls sanitize internal details.' Same vulnerability class addressed,
    though the specific Io(#[error(transparent)]) passthrough may still leak.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote tests for 'CRLF/null-byte rejection in HTTP headers (header
    injection)' (CWE-113). Dev implemented header validation checks for \r, \n, \0
    at client.rs:51-69. Same vulnerability class addressed via runtime validation
    rather than type-level TenantId usage.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentioned workspace dependency declarations or flagged direct
    version strings vs workspace = true. The reviewer noted a toml version mismatch
    (0.8 vs 0.9) but not the workspace inheritance pattern.
