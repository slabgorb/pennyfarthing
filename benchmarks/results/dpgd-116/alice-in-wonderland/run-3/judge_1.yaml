    and other error types.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote tests for 'CWE-209 error exposure' in error_exit_codes.rs and
    dev implemented 'security-sanitized Display'. However, the reviewer verified CWE-209
    as correct on ServerError and Config, missing the Io(transparent) variant that
    forwards full OS details. Credit given for demonstrating awareness of the vulnerability
    class per partial match rule 1.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged [HIGH] 'Vacuous header injection test \u2014 siem_client.rs:113-119'\
    \ noting '!x || true is always true' and 'SiemClient itself performs zero validation\
    \ on token or tenant values containing CRLF.' TEA also wrote tests for 'header\
    \ injection (CRLF in token/tenant)' though the tests were vacuous."
