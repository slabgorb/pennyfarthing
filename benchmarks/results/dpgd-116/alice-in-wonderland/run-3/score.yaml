- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentions distinguishing NotFound from other errors in from_file_or_default.
    The config loading tests and reviewer findings don't address error-type discrimination
    in the fallback path.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote CWE-209 error exposure tests in error_exit_codes.rs. Dev implemented
    security-sanitized Display on CliError. Reviewer verified: ''ServerError Display
    intentionally omits the response body. Config Display omits config content. Both
    have SECURITY comments.'' Same vulnerability class (CWE-209) addressed, though
    the Io(transparent) variant specifically may still leak.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged as HIGH: ''The SiemClient itself performs zero validation
    on token or tenant values containing CRLF. Defense is deferred entirely to reqwest
    at send time, but that''s undocumented and untested.'' Also flagged the vacuous
    test that claims to test CRLF injection but uses !x || true.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentions direct version strings vs workspace = true. The reviewer's
    Cargo.toml finding is about toml version mismatch (0.8 vs 0.9), not about workspace
    dependency declarations.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged as MEDIUM: ''has_token_field() test is vacuous... the
    token field IS silently accepted and ignored by serde. The real question (does
    the config parse and store a token?) is never actually tested. If someone adds
    a token field to RawConfig later, this test still passes.'''
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged vacuous assertion as HIGH: ''The expression !x || true
    is always true. This test can never fail.'' Same category of vacuous boolean assertion
    (always-true OR expression) though in siem_client.rs rather than config_loading.rs.'
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: The specific zero-assertion test (let _ = config with no assert) is not
    flagged by any phase. The reviewer flags vacuous assertions (always-true conditions)
    but does not identify tests with literally zero assertions as a distinct problem.
