- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote siem_client.rs tests covering 'header injection' and security.rs
    tests for 'CRLF injection'. Dev implemented CRLF/null byte validation in client.rs:77-85.
