- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that from_file_or_default swallows all error types. TEA
    tests cover config loading but none specifically assert that parse/permission
    errors propagate rather than falling back to defaults. Dev implemented the method
    without distinguishing NotFound from other errors. Reviewer did not mention this.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA created security.rs with 8 tests explicitly covering CWE-209. Per
    rule 1, same vulnerability class (CWE-209 information exposure) was identified
    and tested for. Dev also claims 'CWE-209 sanitized Display' implementation. However,
    the reviewer verified error.rs Display as correct when the transparent Io variant
    still leaks details, so the specific instance was missed despite class awareness.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote siem_client.rs tests (15 tests) covering 'HTTP headers, status
    code mapping, header injection.' Dev implemented CRLF + null byte validation at
    client.rs:77-85. Reviewer verified 'Header injection prevention (CRLF + null byte)
    correctly implemented.' Same vulnerability class (CWE-113 header injection) caught
    per rule 1, though root cause of using raw String instead of TenantId type was
    not flagged.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that crate Cargo.toml uses direct version strings instead
    of workspace = true. The reviewer noted a toml version mismatch (0.8 vs 0.9) but
    did not identify the workspace = true pattern violation across all 6 dependencies.
