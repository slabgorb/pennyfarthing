- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA wrote a 'malformed TOML rejection' test and Dev implemented it passing,
    but the specific from_file_or_default swallowing ALL errors (not just NotFound)
