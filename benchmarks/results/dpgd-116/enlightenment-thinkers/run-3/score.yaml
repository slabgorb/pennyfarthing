- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #8: 'Config silently accepts unknown TOML fields...\
    \ Missing #[serde(deny_unknown_fields)]. If a user writes server_ur1 = \"...\"\
    \ (typo), the field is silently ignored.' This encompasses the token field scenario\
    \ \u2014 a user adding token = \"sk-secret...\" would be silently ignored."
