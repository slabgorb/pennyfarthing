- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer finding #13 explicitly marked CWE-209 as VERIFIED correct: 'Display\
    \ messages are generic... No stack traces, no token values, no internal paths.'\
    \ This is the opposite conclusion \u2014 the ground truth says Io(#[error(transparent)])\
    \ forwards full OS error details. TEA wrote CWE-209 tests but they passed, meaning\
    \ they failed to catch the transparent forwarding."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #9: 'SiemClient stores raw String for tenant_id \u2014\
    \ client.rs:13. The axiathon-core crate provides TenantId as a validated newtype...\
    \ SiemClient uses Option<String> instead of Option<TenantId>. This bypasses the\
    \ validation boundary that newtypes exist to enforce.'"
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: 'Reviewer finding #15 marked as VERIFIED correct: ''All dependencies declared
    in workspace Cargo.toml and consumed via { workspace = true } in the crate Cargo.toml.
