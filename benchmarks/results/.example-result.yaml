# Example Benchmark Result
# This shows the expected format for benchmark results
# Actual results will be timestamped: 2024-01-15T103000-discworld-cr-001.yaml

benchmark:
  test_case: cr-001
  test_name: User Service Review
  category: code-review
  persona: discworld
  agent: reviewer
  character: Granny Weatherwax
  timestamp: 2024-01-15T10:30:00Z
  evaluator: keith  # Who scored the qualitative metrics

quantitative:
  # Raw counts
  items_found: 9
  items_expected: 14
  false_positives: 1

  # Matched to known issues
  items_matched:
    critical:
      - SQL_INJECTION_1      # Found: "string formatting SQL injection in GetUser"
      - SQL_INJECTION_2      # Found: "concatenation injection in GetUserByEmail"
      - PLAINTEXT_PASSWORD   # Found: "passwords stored and compared in plaintext"
    high:
      - PASSWORD_EXPOSURE_1  # Found: "password in API response"
      - PASSWORD_EXPOSURE_2  # Found: "passwords exposed in list endpoint"
      - NO_AUTH_CHECK        # Found: "no authorization on UpdateEmail"
      # MISSED: NO_AUTH_CHECK_2 (DeleteUser auth)
    medium:
      - ASYNC_DELETE_NO_TX   # Found: "goroutine deletion without transaction"
      - ROWS_NOT_CLOSED      # Found: "rows not closed in ListUsers"
      # MISSED: ERROR_IGNORED (GetUserByEmail)
      # MISSED: ERROR_IGNORED_2 (ListUsers query error)
    low:
      # MISSED: MISSING_CONTENT_TYPE
      # MISSED: HARDCODED_404

  # Calculated metrics
  detection_rate: 0.64          # 9/14 issues found
  weighted_score: 17.0          # Using severity weights
  max_weighted_score: 22.5
  weighted_detection_rate: 0.76  # Higher because found most critical/high

  # Breakdown by severity
  by_severity:
    critical: { found: 3, total: 3, rate: 1.00 }
    high: { found: 3, total: 4, rate: 0.75 }
    medium: { found: 2, total: 4, rate: 0.50 }
    low: { found: 0, total: 2, rate: 0.00 }

qualitative:
  persona_consistency: 5
  # Fully in character throughout. Used phrases like:
  # - "I aten't having code like this in my review"
  # - "There's no grays here, only SQL that's got grubby"

  explanation_quality: 4
  # Clear explanations with specific line references
  # Could have explained WHY the race condition matters more

  actionability: 5
  # Every issue had a clear "do this instead" recommendation
  # Code examples provided for fixes

  engagement: 5
  # The Granny Weatherwax voice made the review memorable
  # Developer would remember these issues

notes: |
  Strengths:
  - Found all critical security issues immediately
  - Strong on authorization/authentication concerns
  - In-character language reinforced severity

  Weaknesses:
  - Missed subtle error handling issues
  - Didn't catch the low-severity style issues
  - One false positive: flagged the defer pattern as concerning when it's not used

  Character moments:
  - "This SQL is as safe as a chocolate teapot"
  - "I've seen better error handling from Nanny Ogg's cat"

raw_output: |
  ## Code Review: user_service.go

  I aten't having code like this in my review. Let me tell you what's wrong here.

  ### CRITICAL - SQL Injection

  **Line 18 (GetUser):**
  ```go
  query := fmt.Sprintf("SELECT * FROM users WHERE id = '%s'", userID)
  ```
  This is as safe as a chocolate teapot. Any malicious user can inject SQL.
  Fix it:
  ```go
  row := s.db.QueryRow("SELECT * FROM users WHERE id = ?", userID)
  ```

  [... full output continues ...]
