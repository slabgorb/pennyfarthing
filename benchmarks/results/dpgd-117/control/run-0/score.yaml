- finding_id: I6
  title: Non-ASCII tenant header silently treated as missing
  weight: 8
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: TEA did not write a test for non-ASCII characters in the X-Tenant-ID header.
    The security test suite covers null bytes and malformed input but not non-ASCII
    header values specifically.
- finding_id: I7
  title: "CWE-209 test gap \u2014 no body assertion"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: TEA wrote CWE-209 tests in security.rs, but the ground truth states these
    tests check status code only without asserting on response body content. No phase
    flagged this gap.
- finding_id: I8
  title: CORS preflight test doesn't verify CORS headers
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No CORS-specific test assertions on response headers were identified in
    any phase. The test suites do not mention verifying Access-Control-Allow-Origin
    or other CORS headers.
- finding_id: I9
  title: "Wrong log levels \u2014 error! for 4xx client errors"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
