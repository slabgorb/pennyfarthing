findings:
- finding_id: I1
  title: Dependencies inline instead of workspace level
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged inline dependency versions. Dev added chrono and uuid
    to Cargo.toml but no mention of workspace = true. Reviewer did not flag it.
- finding_id: I2
  title: 'FieldErrorCode missing #[non_exhaustive]'
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[MEDIUM] No #[non_exhaustive] on public enums/structs\
    \ \u2014 response.rs, auth.rs' mentioning ErrorEntry and AuthIdentity. Same vulnerability\
    \ class (missing #[non_exhaustive] on public enums) even though specific enum\
    \ differs."
- finding_id: I3
  title: Hardcoded trace_id 'none'
  weight: 5
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev created ResponseMeta with trace_id field but no phase flagged that
    trace_id is hardcoded to 'none'. Reviewer's observability finding addresses missing
    tracing calls, not the hardcoded trace_id value in the response envelope.
- finding_id: I4
  title: Zero structured logging
  weight: 5
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: "Reviewer explicitly flagged '[MEDIUM] No structured logging / tracing\
    \ anywhere \u2014 missing observability' noting 'zero tracing::info!, tracing::warn!,\
    \ or span macros anywhere. Authentication failures, rate limit hits, request processing\
    \ \u2014 all silent.'"
- finding_id: I5
  title: Security comment claims tracing that doesn't exist
  weight: 3
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: Reviewer flagged absence of logging but did not specifically identify
    the misleading SECURITY comment that claims errors are 'logged for debugging'
    when no logging exists. The misleading documentation aspect was not called out.
- finding_id: I6
  title: Non-ASCII tenant header silently treated as missing
  weight: 8
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: TEA wrote 14 auth tests covering missing/expired/malformed tokens but
    no test for non-ASCII characters in X-Tenant-ID header. No phase mentioned this
    edge case.
- finding_id: I7
  title: "CWE-209 test gap \u2014 no body assertion"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: "Reviewer marked '[VERIFIED] Error responses don't leak internal details\
    \ \u2014 api_security.rs tests pass' \u2014 opposite conclusion. The CWE-209 test\
    \ exists but the ground truth says it only checks status code, not response body\
    \ content. Pipeline concluded the test was adequate."
- finding_id: I8
  title: CORS preflight test doesn't verify CORS headers
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No CORS preflight test appears in any TEA test file listing. CORS is not
    mentioned in any pipeline phase output.
- finding_id: I9
  title: "Wrong log levels \u2014 error! for 4xx client errors"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: Since zero logging was implemented (I4), the wrong-log-level issue never
    materialized. No phase discussed appropriate log levels for 4xx vs 5xx errors.
- finding_id: I10
  title: CORS allows Any origin/method/header (CWE-942)
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No mention of CORS middleware configuration in any pipeline phase. No
    tests for CORS behavior. The CWE-942 risk of allow_origin(Any) was never examined.
