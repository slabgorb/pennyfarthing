    character: "Ponder Stibbons"
    expected_traits:
      - "Methodical - should find most races"
      - "May over-explain the mechanics"
      - "Practical fixes over elegant redesigns"
    concurrency_expertise_prediction: "intermediate to expert"

  star_trek_dev:
