name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  python-test:
    runs-on: ubuntu-latest
    name: Python Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest pennyfarthing-dist/src/pf/tests/ -q

  python-lint:
    runs-on: ubuntu-latest
    name: Python Lint (Ruff)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check pennyfarthing-dist/src/pf/

  yaml-lint:
    runs-on: ubuntu-latest
    name: YAML Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml pennyfarthing-dist/

  validate-framework:
    runs-on: ubuntu-latest
    name: Validate Framework (pf validate)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate framework definitions
        run: pf validate agent workflow skill-command tandem-awareness context theme

  python-benchmark:
    runs-on: ubuntu-latest
    name: Python CLI Startup Benchmark
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run startup benchmark
        run: |
          python -m pytest tests/python/test_cli.py::TestStartupPerformance -v --tb=short

      - name: Run lazy import tests
        run: |
          python -m pytest tests/python/test_cli.py::TestLazyImports -v --tb=short
