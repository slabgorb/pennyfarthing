name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: [self-hosted, Ubuntu, Common]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm run build

      - name: Run tests (shared)
        run: pnpm --filter @pennyfarthing/shared test

      - name: Run tests (bikerack)
        run: pnpm --filter @pennyfarthing/bikerack test

      - name: Run tests (core)
        run: pnpm --filter @pennyfarthing/core test
        continue-on-error: true  # Some tests have pre-existing failures (Story 18-6)

      - name: Run tests with coverage (cyclist)
        run: pnpm --filter @pennyfarthing/cyclist test -- --coverage
        continue-on-error: true  # Vitest tests, may have environment issues in CI

  smoke-test:
    runs-on: [self-hosted, Ubuntu, Common]
    name: Consumer Install Smoke Test
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm run build

      - name: Run consumer install smoke test
        run: ./tests/integration/test_consumer_install.sh

  lint:
    runs-on: [self-hosted, Ubuntu, Common]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

  python-lint:
    runs-on: [self-hosted, Ubuntu, Common]
    name: Python Lint (Ruff)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check pennyfarthing-dist/src/pf/

  markdown-lint:
    runs-on: [self-hosted, Ubuntu, Common]
    name: Markdown Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run markdownlint
        run: pnpm run lint:md

  yaml-lint:
    runs-on: [self-hosted, Ubuntu, Common]
    name: YAML Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml pennyfarthing-dist/

  validate-refs:
    runs-on: [self-hosted, Ubuntu, Common]
    name: Validate File References

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Validate cross-file references
        run: node scripts/validate-refs.js --strict

  python-benchmark:
    runs-on: [self-hosted, Ubuntu, Common]
    name: Python CLI Startup Benchmark
    continue-on-error: true  # Flaky on loaded runners — timing-sensitive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run startup benchmark
        run: |
          python -m pytest tests/python/test_cli.py::TestStartupPerformance -v --tb=short

      - name: Run lazy import tests
        run: |
          python -m pytest tests/python/test_cli.py::TestLazyImports -v --tb=short
