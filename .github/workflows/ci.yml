name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  python-lint:
    runs-on: [self-hosted, Ubuntu, Common]
    name: Python Lint (Ruff)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check pennyfarthing-dist/src/pf/

  markdown-lint:
    runs-on: [self-hosted, Ubuntu, Common]
    name: Markdown Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run markdownlint
        run: pnpm run lint:md

  yaml-lint:
    runs-on: [self-hosted, Ubuntu, Common]
    name: YAML Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml pennyfarthing-dist/

  validate-framework:
    runs-on: [self-hosted, Ubuntu, Common]
    name: Validate Framework (pf validate)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate framework definitions
        run: pf validate agent workflow skill-command tandem-awareness context theme

  python-benchmark:
    runs-on: [self-hosted, Ubuntu, Common]
    name: Python CLI Startup Benchmark
    continue-on-error: true  # Flaky on loaded runners — timing-sensitive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run startup benchmark
        run: |
          python -m pytest tests/python/test_cli.py::TestStartupPerformance -v --tb=short

      - name: Run lazy import tests
        run: |
          python -m pytest tests/python/test_cli.py::TestLazyImports -v --tb=short
