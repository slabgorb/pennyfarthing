name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: [self-hosted, Ubuntu, Common]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm run build

      - name: Run tests
        run: pnpm --filter @pennyfarthing/core test

      # Publish @pennyfarthing/core (the only published package)
      - name: Publish @pennyfarthing/core
        run: |
          cd packages/core
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm publish --dry-run --access public --no-git-checks
          else
            pnpm publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Note: @pennyfarthing/cyclist is private (not published to npm)
