name: Validate Codeowners
on:
  workflow_dispatch:

  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-codeowners:
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout source code at current commit"
      uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # https://github.com/actions/checkout/releases/tag/v4.2.2
      # Leave pinned at 0.7.1 until https://github.com/mszostok/codeowners-validator/issues/173 is resolved
    - uses: mszostok/codeowners-validator@f3651e3810802a37bd965e6a9a7210728179d076 # https://github.com/mszostok/codeowners-validator/releases/tag/v0.7.1
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      name: "Full check of CODEOWNERS"
      with:
        checks: "syntax,duppatterns"
        github_access_token: "${{ secrets.GITHUB_TOKEN }}"
      # Leave pinned at 0.7.1 until https://github.com/mszostok/codeowners-validator/issues/173 is resolved
    - uses: mszostok/codeowners-validator@f3651e3810802a37bd965e6a9a7210728179d076 # https://github.com/mszostok/codeowners-validator/releases/tag/v0.7.1
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      name: "Syntax check of CODEOWNERS"
      with:
        checks: "syntax,duppatterns"
