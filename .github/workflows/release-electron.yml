name: Release Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g., v11.1.1). Uses current HEAD if not a tag push.'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: true
      skip_tests:
        description: 'Skip test step (use for re-runs after test fixes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-electron-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # Gate: run tests before building release artifacts
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: [self-hosted, Ubuntu, Common]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm run build

      - name: Run tests (shared)
        run: pnpm --filter @pennyfarthing/shared test

      - name: Run tests (core)
        run: pnpm --filter @pennyfarthing/core test
        continue-on-error: true

      - name: Run tests (cyclist)
        run: pnpm --filter @pennyfarthing/cyclist test
        continue-on-error: true

      - name: TypeScript check (electron)
        run: pnpm --filter @pennyfarthing/electron run build

  # Build platform-specific artifacts
  build:
    needs: [test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact_name: cyclist-mac
          - os: windows-latest
            platform: win
            artifact_name: cyclist-win
          - os: ubuntu-latest
            platform: linux
            artifact_name: cyclist-linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace packages
        run: pnpm run build

      - name: Build Electron app (${{ matrix.platform }})
        shell: bash
        working-directory: packages/electron
        run: npx electron-builder --${{ matrix.platform }} -c.npmRebuild=false
        env:
          # macOS code signing (optional — builds unsigned if not set)
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # macOS notarization (optional)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Disable code signing if no certs available
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK && 'true' || 'false' }}
          # GitHub token for auto-update provider
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            packages/electron/release/*.dmg
            packages/electron/release/*.zip
            packages/electron/release/*.exe
            packages/electron/release/*.AppImage
            packages/electron/release/*.deb
            packages/electron/release/*.yml
            packages/electron/release/*.yaml
            packages/electron/release/*.blockmap
          if-no-files-found: error
          retention-days: 5

  # Create GitHub Release and attach artifacts
  release:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$(node -p "require('./packages/electron/package.json').version")"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Releasing: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          # Find previous tag for changelog
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi

          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "## Cyclist ${{ steps.version.outputs.version }}"
            echo ""
            echo "### What's Changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges | head -50
            echo ""
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| macOS | \`Cyclist-${{ steps.version.outputs.version }}.dmg\` |"
            echo "| macOS (zip) | \`Cyclist-${{ steps.version.outputs.version }}-mac.zip\` |"
            echo "| Windows (installer) | \`Cyclist Setup ${{ steps.version.outputs.version }}.exe\` |"
            echo "| Windows (portable) | \`Cyclist ${{ steps.version.outputs.version }}.exe\` |"
            echo "| Linux (AppImage) | \`Cyclist-${{ steps.version.outputs.version }}.AppImage\` |"
            echo "| Linux (deb) | \`cyclist_${{ steps.version.outputs.version }}_amd64.deb\` |"
            echo ""
            echo "### Installation"
            echo ""
            echo "See [DISTRIBUTION.md](packages/electron/DISTRIBUTION.md) for detailed installation and upgrade instructions."
            echo "RELEASE_NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Cyclist ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          draft: ${{ inputs.draft || false }}
          prerelease: false
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.yml
            release-artifacts/**/*.yaml
            release-artifacts/**/*.blockmap
          fail_on_unmatched_files: false
