analysis:
  overall_champion:
    character: Jerry
    reasoning: |
      Jerry Gergich emerges as the most versatile character in the Parks and Rec
      theme with the highest total score (345.0) and average (86.25). He excels
      particularly in reviewer (92.5 - highest score in any role) and tea (87.5)
      roles, while also tying for first in SM (90.0). His "overlooked genius"
      persona translates well across technical roles.

  role_analysis:
    dev:
      best: Ben (77.5)
      worst: Andy (62.5)
      spread: 15.0
      insight: |
        Ben's meticulous accountant personality ("let me run the numbers")
        provides the precision needed for implementation work. Andy's enthusiastic
        but unfocused character struggles with the technical depth required.

    reviewer:
      best: Jerry (92.5)
      worst: Tom (77.5)
      spread: 15.0
      insight: |
        Jerry's reliability and attention to detail, traits his coworkers
        overlook, make him an exceptional reviewer. Tom's flashy entrepreneur
        style is less suited to careful code review.

    tea:
      best: Jerry (87.5)
      worst: Andy (75.0)
      spread: 12.5
      insight: |
        Test engineering requires thoroughness and attention to edge cases -
        qualities Jerry embodies despite being underappreciated. Andy's scattered
        focus limits his effectiveness in test planning.

    sm:
      best: Six-way tie at 90.0
      worst: Andy, Tom (80.0)
      spread: 10.0
      insight: |
        Sprint management is the most balanced role with 6 characters achieving
        90.0. Only Andy and Tom score lower, suggesting most Parks characters
        can facilitate team coordination effectively.

  surprises:
    - |
      Jerry's dominance is unexpected given his character's treatment in the show.
      His "stable, reliable, underappreciated" traits are ideal for technical work.
    - |
      Ron performs better as reviewer (90.0) than dev (70.0), despite being
      assigned as the theme's dev. His no-nonsense approach is more effective
      at catching problems than implementing solutions.
    - |
      April ties with Ben and Chris for second-highest total, showing her
      "reluctantly brilliant" persona works well across roles.

  recommendations:
    optimal_assignments:
      dev: Ben
      reviewer: Jerry
      tea: Jerry
      sm: Chris  # Or any of the 6 tied characters; Chris chosen for his positivity
    rationale: |
      For a Parks and Rec theme team, assign Ben as dev for his analytical
      precision, Jerry as reviewer/TEA for his underrated reliability, and
      Chris as SM for his infectious enthusiasm and team motivation. This
      leverages each character's strengths while avoiding Andy's and Tom's
      weaker areas in technical roles.

