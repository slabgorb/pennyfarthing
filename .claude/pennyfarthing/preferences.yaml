# Pennyfarthing User Preferences
# Copy to .claude/pennyfarthing/preferences.yaml to customize
# Override with .local.yaml for personal preferences (gitignored)

# Enable persona character voice in agent output
# When false, agents respond in a neutral, professional tone
character_voice: true

# Show reasoning and decision explanations
# When true, agents explain their thought process
explain_decisions: true

# Auto-commit on story completion
# When true, SM auto-commits after finishing a story
auto_commit: false
