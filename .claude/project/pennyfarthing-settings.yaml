# Pennyfarthing Project Settings
# Consolidated configuration for agent workflows, repos, services, and testing
#
# Used by: repo-utils.sh, worktree-manager.sh, test-setup.sh
#
# Sections:
#   repos     - Repository definitions (multi-repo support)
#   services  - Dev server ports for worktree management
#   testing   - Test configuration and skip patterns

# ============================================================================
# Repository Definitions
# ============================================================================
# Each repo can define:
#   path: relative path from PROJECT_ROOT (defaults to repo name)
#   type: api, ui, adapter, service, shared, lib, cli, etc.
#   language: go, typescript, python, rust, etc.
#   test_command: command to run tests (or "just test" if using justfile)
#   build_command: command to build
#   lint_command: command to lint
#   dependencies: list of repos this depends on (for build order)
#   test_env: environment variables needed for tests
#   skip_patterns: regex patterns that indicate skipped tests (policy violation)

repos:
  # Example: Pennyfarthing-style multi-repo project
  # Pennyfarthing-api:
  #   path: Pennyfarthing-api
  #   type: api
  #   language: go
  #   test_command: "just test"
  #   build_command: "just build"
  #   lint_command: "golangci-lint run"
  #   test_env:
  #     TEST_DATABASE_URL: "postgres://testuser:testpass@localhost:5433/testdb?sslmode=disable"
  #     TEST_MONGODB_URL: "mongodb://testuser:testpass@localhost:27018"
  #   skip_patterns:
  #     - 't\.Skip'
  #   skip_exceptions:
  #     - 'LocalStack'
  #     - 'not available'
  #
  # Pennyfarthing-ui:
  #   path: Pennyfarthing-ui
  #   type: ui
  #   language: typescript
  #   test_command: "npm run test -- --run"
  #   build_command: "npm run build"
  #   lint_command: "npm run lint"
  #   skip_patterns:
  #     - 'it\.skip'
  #     - 'describe\.skip'
  #     - 'test\.skip'

  # Pennyfarthing itself (single repo, no external deps)
  pennyfarthing:
    path: "."
    type: cli
    language: bash
    test_command: ""  # No tests for agent framework itself
    build_command: ""
    lint_command: "shellcheck scripts/**/*.sh"

# ============================================================================
# Services Configuration
# ============================================================================
# Define dev server ports for worktree management
# Each service gets offset ports in worktrees (base + worktree_index * port_offset)
#
# Example for Go API + React UI project:
#   services:
#     port_offset: 100
#     definitions:
#       - name: API
#         base_port: 8080
#         env_var: API_PORT
#       - name: UI
#         base_port: 5173
#         env_var: UI_PORT

services:
  port_offset: 100
  definitions:
    - name: Showcase
      base_port: 4321
      env_var: SHOWCASE_PORT

# ============================================================================
# Testing Configuration
# ============================================================================
testing:
  # Directory for test logs (relative to PROJECT_ROOT)
  log_dir: ".session"

  # Command to start test containers (if any)
  # container_command: "just test-setup"

  # Container health checks (name:port pairs)
  # containers:
  #   - name: "Pennyfarthing-test-db"
  #     port: 5433
  #   - name: "Pennyfarthing-test-mongo"
  #     port: 27018

  # Default skip patterns by language (can be overridden per-repo)
  skip_patterns_by_language:
    go:
      patterns: ['t\.Skip']
      exceptions: ['LocalStack', 'not available', 'CI environment']
      file_pattern: "*_test.go"
    typescript:
      patterns: ['it\.skip', 'describe\.skip', 'test\.skip']
      exceptions: []
      file_pattern: "*.test.*"
    python:
      patterns: ['@pytest\.mark\.skip', 'pytest\.skip']
      exceptions: ['CI only']
      file_pattern: "test_*.py"
    rust:
      patterns: ['#\[ignore\]']
      exceptions: []
      file_pattern: "*.rs"

# ============================================================================
# Legacy Compatibility
# ============================================================================
# If your scripts use $API_REPO/$UI_REPO, map them here
# legacy_compat:
#   api_repo: Pennyfarthing-api
#   ui_repo: Pennyfarthing-ui

# ============================================================================
# Build Order
# ============================================================================
# Optional explicit order (defaults to order defined above)
# build_order:
#   - shared-lib
#   - Pennyfarthing-api
#   - Pennyfarthing-ui
